// ── PROXY HELPERS ──────────────────────────────────────────────────────────────
async function proxyCall(params) {
  const url        = PROXY_URL + "?" + new URLSearchParams({ token: PROXY_TOKEN, ...params }).toString();
  const controller = new AbortController();
  const timer      = setTimeout(() => controller.abort(), 20000); // 20s timeout
  try {
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok) throw new Error("Proxy error: " + res.status);
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    return json.data;
  } catch(e) {
    clearTimeout(timer);
    if (e.name === "AbortError") throw new Error("Request timed out — Google Apps Script may be cold-starting. Please try again.");
    throw e;
  }
}
const readConfig = () => readSheet(CALENDAR_SHEET_ID, CONFIG_SHEET_NAME);
const readSheet  = (sheetId, sheetName) => proxyCall({ action: "getTasks", sheetId, sheetName });

function rowsToTasks(rows) {

}
function rowsToArchiveTasks(rows) {

function normalizeUrl(url) {
  if (!url) return "";
  return /^https?:\/\//i.test(url) ? url : "https://" + url;
}
function notesCellHTML(notes, uid) {
  if (!notes) return "";
  const safe = notes.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  if (notes.length <= 120) return `<div style="word-break:break-word;overflow-wrap:anywhere;font-size:12px;color:#6b7280;">${safe}</div>`;
  const shortSafe = safe.slice(0, 120);
  const restSafe  = safe.slice(120);
  return `<div style="font-size:12px;color:#6b7280;word-break:break-word;overflow-wrap:anywhere;">
    <span id="ns-${uid}">${shortSafe}<span id="nr-${uid}" style="display:none;">${restSafe}</span>
      <button class="notes-toggle" id="nb-${uid}"
        onclick="(function(id){var r=document.getElementById('nr-'+id),b=document.getElementById('nb-'+id),e=r.style.display==='none';r.style.display=e?'inline':'none';b.textContent=e?'▴ less':'▾ more';}('${uid}'))">▾ more</button>
    </span>
  </div>`;
}
function parseDate(d) {
  if (!d) return null;
  if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(d)) {
    const [m,dy,y] = d.split("/");
    return new Date(+y, +m-1, +dy);
  }
  if (/^\d{4}-\d{2}-\d{2}T/.test(d)) {
    const dt = new Date(d);
    return isNaN(dt) ? null : new Date(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate());
  }
  if (/^\d{4}-\d{2}-\d{2}$/.test(d)) {
    const [y,m,dy] = d.split("-");
    return new Date(+y, +m-1, +dy);
  }
  return null;
}
function isOverdue(d) {
  const due = parseDate(d); if (!due) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return due < today;
}
function escHtml(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function formatTimestamp(ts) {
  if (!ts) return "";
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  let dt;
  if (/^\d{4}-\d{2}-\d{2}T/.test(String(ts))) {
    dt = new Date(ts);
  } else {
    dt = new Date(ts);
    if (isNaN(dt)) return ts;
  }
  const d   = String(dt.getDate()).padStart(2,"0");
  const mon = MON[dt.getMonth()];
  const y   = dt.getFullYear();
  const h   = String(dt.getHours()).padStart(2,"0");
  const min = String(dt.getMinutes()).padStart(2,"0");
  return `${d}-${mon}-${y} ${h}:${min}`;
}
function formatDueDate(d) {
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const dt = parseDate(d); if (!dt) return d||"";
  return `${String(dt.getDate()).padStart(2,"0")}-${MON[dt.getMonth()]}-${dt.getFullYear()}`;
}
function dueDaysBadge(d, status) {
  if (!d || status === "Completed") return "";
  const dt = parseDate(d); if (!dt) return "";
  dt.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((dt - today) / 86400000);
  if (diff === 0) return `<div style="font-size:10px;font-weight:700;color:#f59e0b;margin-top:2px;">Due today</div>`;
  if (diff < 0)  return `<div style="font-size:10px;font-weight:700;color:#dc2626;margin-top:2px;">${diff} days</div>`;
  return `<div style="font-size:10px;font-weight:700;color:#16a34a;margin-top:2px;">+${diff} days</div>`;
}
function nextTaskId(tasks) {
  const nums = tasks.map(t => parseInt(t.taskId.replace("TSK-",""),10)).filter(n=>!isNaN(n));

}

// ── LOGIN NAME CACHE ───────────────────────────────────────────────────────────
const LOGIN_NAMES_KEY = "tmgr_login_names";
function getCachedLoginNames() {
  try {
    const item = JSON.parse(localStorage.getItem(LOGIN_NAMES_KEY) || "null");
    if (!item || Date.now() - item.ts > 3600000) return null;
    return item.names;
  } catch { return null; }
}
function setCachedLoginNames(names) {
  try { localStorage.setItem(LOGIN_NAMES_KEY, JSON.stringify({ ts: Date.now(), names })); } catch {}
}

// ── LOCKOUT HELPERS (localStorage = primary, sheet = secondary/sync) ──────────
const LS_KEY = "tmgr_lockout";
function lsGetAll()               { try { return JSON.parse(localStorage.getItem(LS_KEY)||"{}"); } catch { return {}; } }
function lsSetUser(name, data)    { try { const a=lsGetAll(); a[name]=data; localStorage.setItem(LS_KEY,JSON.stringify(a)); } catch {} }
function lsClearUser(name)        { try { const a=lsGetAll(); delete a[name]; localStorage.setItem(LS_KEY,JSON.stringify(a)); } catch {} }

function rowsToAccountStatus(rows) {
  const out = {};
  if (rows.length < 2) return out;
  rows.slice(1).forEach((r, i) => {
    if (!r[0]) return;
    out[r[0]] = {
      rowIndex: i + 2,
      failed:   parseInt(r[1]) || 0,
      locked:   String(r[2]).toUpperCase() === "TRUE"
    };
  });
  return out;
}

function _onLoginNameChange() {
  document.getElementById("inp-pin").value = "";
  const errEl = document.getElementById("login-error");
  const btn   = document.getElementById("btn-signin");
  if (btn) { btn.disabled = false; btn.style.opacity = "1"; btn.textContent = "Sign In"; }
  const name = document.getElementById("sel-name")?.value;
  const acct = name ? (window._accountStatus || {})[name] : null;
  if (acct && acct.locked) {
    const msg = acct.failed >= 3
      ? "Your account is locked after too many failed attempts. Please contact your manager."
      : "Your account is not active. Please contact your manager.";
    if (errEl) errEl.innerHTML = errorBox(msg);
  } else {
    if (errEl) errEl.innerHTML = "";
  }
}

      ${names.map(n=>`<option value="${n}">${n}</option>`).join("")}

    <label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:6px;">PIN</label>
    <input id="inp-pin" type="password" maxlength="4" placeholder="4-digit PIN"
      autocomplete="off" data-1p-ignore data-lpignore="true" data-bwignore="true"
      style="width:100%;padding:10px 12px;border-radius:8px;margin-bottom:20px;border:1.5px solid #d1fae5;font-size:18px;letter-spacing:8px;color:#1b4332;background:#f0fdf4;outline:none;"/>
    <div id="login-error"></div>
    <button id="btn-signin" onclick="doLogin()" style="width:100%;padding:12px;border-radius:10px;background:#1b4332;color:#fff;font-size:15px;font-weight:600;border:none;">Sign In</button>`;
  document.getElementById("inp-pin").addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });
}

function _applyLoginStatus(configRows, statusRows) {
  const data = configRows.slice(1).filter(r => r[0]);
  window._configRows = data;
  const sheetStatus = rowsToAccountStatus(statusRows);
  const lsStatus    = lsGetAll();
  window._accountStatus = sheetStatus;
  Object.entries(lsStatus).forEach(([name, ls]) => {
    const s = window._accountStatus[name] || { rowIndex: null, failed: 0 };
    window._accountStatus[name] = { ...s, failed: Math.max(s.failed, ls.failed||0), locked: s.locked||ls.locked||false };
  });
  return data.map(r => r[0]);
}

async function loadLoginData() {
  const cachedNames = getCachedLoginNames();
  if (cachedNames) {
    // Show form immediately from cache — no network wait
    window._configRows = window._configRows || [];
    window._accountStatus = {};
    Object.entries(lsGetAll()).forEach(([name, ls]) => {
      window._accountStatus[name] = { rowIndex: null, failed: ls.failed||0, locked: ls.locked||false };
    });
    _renderLoginForm(cachedNames);
    // Refresh config + account status in background
    _bgRefreshLoginData();
    return;
  }
  // No cache — first visit, must fetch
  try {
    const [configRows, statusRows] = await Promise.all([
      proxyCall({ action: "getConfig", sheetId: CALENDAR_SHEET_ID }),
      readSheet(CALENDAR_SHEET_ID, ACCOUNT_STATUS_SHEET_NAME).catch(() => [])
    ]);
    const names = _applyLoginStatus(configRows, statusRows);
    setCachedLoginNames(names);
    _renderLoginForm(names);
  } catch(e) {
    document.getElementById("login-body").innerHTML = `<div style="background:#fee2e2;color:#991b1b;padding:12px;border-radius:8px;">Could not load config: ${e.message}</div>`;
  }
}

async function _bgRefreshLoginData() {
  try {
    const [configRows, statusRows] = await Promise.all([
      proxyCall({ action: "getConfig", sheetId: CALENDAR_SHEET_ID }),
      readSheet(CALENDAR_SHEET_ID, ACCOUNT_STATUS_SHEET_NAME).catch(() => [])
    ]);
    const names = _applyLoginStatus(configRows, statusRows);
    setCachedLoginNames(names);
    // Update dropdown silently with fresh names (picks up new/removed users)
    const sel = document.getElementById("sel-name");
    if (sel) {
      const cur = sel.value;
      sel.innerHTML = `<option value="">— Select your name —</option>` +
        names.map(n => `<option value="${n}">${n}</option>`).join("");
      if (cur) sel.value = cur;
    }
  } catch {} // silent — form already visible
}

async function doLogin() {
  const name  = document.getElementById("sel-name").value;
  const pin   = document.getElementById("inp-pin").value;
  const errEl = document.getElementById("login-error");
  const btnEl = document.getElementById("btn-signin");

  if (!name) { errEl.innerHTML = errorBox("Please select your name."); return; }

  const acct = window._accountStatus[name];
  if (acct && acct.locked) {
    const msg = acct.failed >= 3
      ? "Your account is locked after too many failed attempts. Please contact your manager."
      : "Your account is not active. Please contact your manager.";
    errEl.innerHTML = errorBox(msg);
    if (btnEl) { btnEl.disabled = true; btnEl.style.opacity = "0.5"; }
    return;
  }

  if (btnEl) { btnEl.disabled = true; btnEl.style.opacity = "0.5"; btnEl.textContent = "Checking…"; }
  try {
    const user = await proxyCall({ action: "validatePin", sheetId: CALENDAR_SHEET_ID, name, pin });
    if (!user || !user.valid) {
      const lockResult = await incrementFailedAttempts(name);
      logLoginFailure(name); // fire-and-forget — don't await, don't block UI
      if (btnEl) { btnEl.disabled = false; btnEl.style.opacity = "1"; btnEl.textContent = "Sign In"; }
      if (lockResult.locked) {
        errEl.innerHTML = errorBox("Account locked after 3 failed attempts. Please contact your manager.");
        if (btnEl) { btnEl.disabled = true; btnEl.style.opacity = "0.5"; }
      } else {
        const left = 3 - lockResult.failed;
        errEl.innerHTML = errorBox(`Invalid PIN. ${left} attempt${left!==1?"s":""} remaining before lockout.`);
      }
      return;
    }
    const parseTeams = v => (v||"").split(",").map(t=>t.trim()).filter(Boolean);
    if (user.role === "Manager") {
      const memberRows = window._configRows.filter(r => r[2] === "Member");
      const teams = [...new Set(window._configRows.flatMap(r => parseTeams(r[6])))];
      SESSION = { name: user.name, role: user.role, memberRows, teams };
    } else {
      SESSION = { name: user.name, role: user.role, teams: parseTeams(user.team) };
    }
    resetAccountStatus(name);
    render();
    prefetchAllTabs();
    logLoginActivity();
  } catch(e) {
    if (btnEl) { btnEl.disabled = false; btnEl.style.opacity = "1"; btnEl.textContent = "Sign In"; }
    errEl.innerHTML = errorBox("Login error: " + e.message);
  }
}

async function incrementFailedAttempts(name) {
  const s         = window._accountStatus[name];
  const newFailed = (s ? s.failed : 0) + 1;
  const isLocked  = newFailed >= 3;

  // 1. Write to localStorage immediately (survives refresh, guaranteed)
  lsSetUser(name, { failed: newFailed, locked: isLocked });

  // 2. Update in-memory state
  window._accountStatus[name] = { ...(s||{ rowIndex: null }), failed: newFailed, locked: isLocked };

  // 3. Sync to sheet in background (for cross-device / Manager visibility)
  try {
    if (s && s.rowIndex) {
      await updateRow(CALENDAR_SHEET_ID, ACCOUNT_STATUS_SHEET_NAME, s.rowIndex, [name, String(newFailed), isLocked ? "TRUE" : "FALSE"]);
    } else {
      await appendRow(CALENDAR_SHEET_ID, ACCOUNT_STATUS_SHEET_NAME, [name, String(newFailed), isLocked ? "TRUE" : "FALSE"]);
      const rows = await readSheet(CALENDAR_SHEET_ID, ACCOUNT_STATUS_SHEET_NAME);
      window._accountStatus = rowsToAccountStatus(rows);
      lsSetUser(name, { failed: newFailed, locked: isLocked }); // re-apply after re-read
    }
  } catch { /* sheet sync failed — localStorage still holds the lock */ }

  return { failed: newFailed, locked: isLocked };
}

async function resetAccountStatus(name) {
  // 1. Clear localStorage immediately
  lsClearUser(name);

  // 2. Update in-memory
  if (window._accountStatus[name]) {
    window._accountStatus[name] = { ...window._accountStatus[name], failed: 0, locked: false };
  }

  // 3. Sync to sheet
  const s = window._accountStatus[name];
  try {
    if (s && s.rowIndex) {
      await updateRow(CALENDAR_SHEET_ID, ACCOUNT_STATUS_SHEET_NAME, s.rowIndex, [name, "0", "FALSE"]);
    } else {
      await appendRow(CALENDAR_SHEET_ID, ACCOUNT_STATUS_SHEET_NAME, [name, "0", "FALSE"]);
    }
  } catch { /* sheet sync failed — localStorage already cleared */ }
}

function _sGet(k)    { try { return JSON.parse(sessionStorage.getItem(k) || "null"); } catch { return null; } }
function _sSet(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch {} }
function _sDel(k)    { try { sessionStorage.removeItem(k); } catch {} }

const TASKS_TTL_MS = 60 * 60 * 1000; // 1 hour
function _tasksCacheKey() { return "tmgr_tasks_" + (SESSION ? SESSION.name : ""); }
function getCachedTasks() {
  try {
    const item = JSON.parse(localStorage.getItem(_tasksCacheKey()) || "null");
    if (!item) return null;
    if (Date.now() - item.ts > TASKS_TTL_MS) { localStorage.removeItem(_tasksCacheKey()); return null; }
    return item.data;
  } catch { return null; }
}
function setCachedTasks(tasks) {
  try { localStorage.setItem(_tasksCacheKey(), JSON.stringify({ ts: Date.now(), data: tasks })); } catch {}
}
function clearTasksCache() { try { localStorage.removeItem(_tasksCacheKey()); } catch {} }

async function loadMemberTasks() {
  const cached = getCachedTasks();
  if (cached) {
    _memberTasks = cached.filter(t => t.assignedTo === SESSION.name);
    _memberEditingTask = null;
    renderMemberTable();
  }
  try {
    const rows  = await readSheet(CALENDAR_SHEET_ID, TASKS_SHEET_NAME);
    const all   = rowsToTasks(rows);
    setCachedTasks(all);
    _memberTasks = all.filter(t => t.assignedTo === SESSION.name);
    _memberEditingTask = null;
    renderMemberTable(); // always render — clears spinner even when task list is empty
  } catch(e) {
    if (!cached) document.getElementById("member-main").innerHTML = `<div style="background:#fee2e2;color:#991b1b;padding:16px 20px;border-radius:12px;margin:16px 0;">

async function _bgRefreshMemberTasks() {
  if (_taskOpInProgress) return;
  try {
    const rows  = await readSheet(CALENDAR_SHEET_ID, TASKS_SHEET_NAME);
    if (_taskOpInProgress) return; // re-check after async wait
    const all   = rowsToTasks(rows);
    setCachedTasks(all);
    const fresh = all.filter(t => t.assignedTo === SESSION.name);
    if (JSON.stringify(fresh) !== JSON.stringify(_memberTasks)) {

      renderMemberTable();
    }
  } catch {}
}

  const t = _memberTasks.find(t => t.rowIndex === rowIndex);

    await loadMemberTasks();
    showToast("Deleted");

}

}

    const active  = _filterMember === n;
    const count   = _allTasks.filter(t => t.assignedTo === n).length;
    const status  = (window._accountStatus || {})[n];
    const manualLocked = status?.locked && (status?.failed || 0) === 0;
    if (manualLocked) return ""; // hide admin-locked (deactivated) users from chips
    const autoLocked = status?.locked && (status?.failed || 0) >= 3;
    const bg     = active ? (autoLocked ? "#7f1d1d" : "#1b4332") : (autoLocked ? "#fff1f2" : "#f0fdf4");
    const fg     = active ? "#fff" : (autoLocked ? "#991b1b" : "#1b4332");
    const border = active ? `2px solid ${autoLocked?"#991b1b":"#1b4332"}` : `1.5px solid ${autoLocked?"#fca5a5":"#d1fae5"}`;
    const label  = `${autoLocked?"🔒 ":""}${n.split(" ")[0]} (${count})`;
    return `<button onclick="setFilter('${n}')" title="${autoLocked?n+" is locked — too many attempts":""}"

function setFilter(name) {
  _filterMember = name;
  _selectedTaskRows.clear();
  renderManagerTable();
}

function toggleTaskSelect(rowIndex) {
  if (_selectedTaskRows.has(rowIndex)) _selectedTaskRows.delete(rowIndex);
  else _selectedTaskRows.add(rowIndex);
  renderManagerTable();
}

function toggleSelectAll() {
  const filtered = _filterMember === "All" ? _allTasks : _allTasks.filter(t => t.assignedTo === _filterMember);
  const allChecked = filtered.every(t => _selectedTaskRows.has(t.rowIndex));
  if (allChecked) filtered.forEach(t => _selectedTaskRows.delete(t.rowIndex));
  else filtered.forEach(t => _selectedTaskRows.add(t.rowIndex));
  renderManagerTable();
}

async function deleteSelectedTasks() {
  const rows = [..._selectedTaskRows].sort((a, b) => b - a);
  if (!rows.length) return;
  const names = rows.map(ri => _allTasks.find(t => t.rowIndex === ri)?.task).filter(Boolean);
  if (!confirm(`Delete ${rows.length} task${rows.length > 1 ? "s" : ""}?\n\n${names.slice(0,5).join("\n")}${names.length > 5 ? `\n…and ${names.length-5} more` : ""}`)) return;
  try {
    for (const rowIndex of rows) {
      await deleteRowProxy(CALENDAR_SHEET_ID, TASKS_SHEET_NAME, rowIndex);
    }
    _selectedTaskRows.clear();
    await reloadAllTasks();
    showToast(`${rows.length} task${rows.length > 1 ? "s" : ""} deleted`);
  } catch(e) { alert("Delete failed: " + e.message); }
}

function toggleAddTaskMember(name) {
  if (_addTaskMembers.has(name)) _addTaskMembers.delete(name);
  else _addTaskMembers.add(name);
  renderAddTaskModal();
}

function toggleAllMembers() {
  const memberNames = SESSION.memberRows.map(r => r[0]);
  if (memberNames.every(n => _addTaskMembers.has(n))) _addTaskMembers.clear();
  else memberNames.forEach(n => _addTaskMembers.add(n));
  renderAddTaskModal();
}

async function reloadAllTasks() {
  const rows = await readSheet(CALENDAR_SHEET_ID, TASKS_SHEET_NAME);
  _allTasks = rowsToTasks(rows);
  setCachedTasks(_allTasks);
  _selectedTaskRows.clear();
  renderManagerTable();
}

async function doDelete(rowIndex) {
  const t = _allTasks.find(t => t.rowIndex === rowIndex);
  if (!t || !confirm(`Delete task "${t.task}"?`)) return;
  try {
    await deleteRowProxy(CALENDAR_SHEET_ID, TASKS_SHEET_NAME, rowIndex);
    await reloadAllTasks();
  } catch(e) { alert("Delete failed: " + e.message); }
}

async function doAddTask() {
  const selected = [..._addTaskMembers];
  const task     = document.getElementById("at-task").value.trim();
  const dueDate  = document.getElementById("at-dueDate").value;
  const priority = document.getElementById("at-priority").value;
  const status   = document.getElementById("at-status").value;
  const notes    = document.getElementById("at-notes").value;
  const url      = document.getElementById("at-url").value.trim();
  if (!selected.length) { document.getElementById("at-error").textContent = "Please select at least one team member."; return; }
  if (!task) { document.getElementById("at-error").textContent = "Task description is required."; return; }
  try {
    let base = _allTasks.slice();
    for (const name of selected) {
      const taskId = nextTaskId(base);
      await appendRow(CALENDAR_SHEET_ID, TASKS_SHEET_NAME, [taskId, name, task, dueDate, priority, status, notes, url]);
      base.push({ taskId });
    }
    closeAddTaskModal();
    await reloadAllTasks();
    showToast(`Task added for ${selected.length} member${selected.length > 1 ? "s" : ""} ✓`);
  } catch(e) { alert("Failed to add task: " + e.message); }
}

function closeEditTaskModal() {
  _editTaskModal = null;
  const el = document.getElementById("edit-task-modal");
  if (el) el.remove();
}

async function doSaveEditModal() {
  const t          = _editTaskModal;
  const assignedTo = document.getElementById("et-assignedTo").value;
  const task       = document.getElementById("et-task").value.trim();
  const dueDate    = document.getElementById("et-dueDate").value;
  const priority   = document.getElementById("et-priority").value;
  const status     = document.getElementById("et-status").value;
  const notes      = document.getElementById("et-notes").value;
  const url        = document.getElementById("et-url").value.trim();
  const errEl      = document.getElementById("et-error");
  if (!task) { errEl.textContent = "Task description is required."; return; }
  try {
    await updateRow(CALENDAR_SHEET_ID, TASKS_SHEET_NAME, t.rowIndex,
      [t.taskId, assignedTo, task, dueDate, priority, status, notes, url]);
    closeEditTaskModal();
    if (SESSION.role === "Manager") await reloadAllTasks();
    else await loadMemberTasks();
    showToast("Saved ✓");
  } catch(e) { errEl.textContent = "Save failed: " + e.message; }
}

async function doDeleteFromEditModal() {
  const t = _editTaskModal;
  if (!t || !confirm(`Delete task "${t.task}"?`)) return;
  closeEditTaskModal();
  if (SESSION.role === "Manager") await doDelete(t.rowIndex);
  else await memberDeleteTask(t.rowIndex);
}

let _editTaskModal = null;

// ── INLINE TASK EDITING ────────────────────────────────────────────────────────
function _findTaskByRow(rowIndex) {
  return (_allTasks.concat(_memberTasks)).find(x => x.rowIndex === rowIndex);
}
function _dueDateCellInner(t) {
  const ov = isOverdue(t.dueDate) && t.status !== "Completed";
  const dateStr = t.dueDate ? formatDueDate(t.dueDate) : `<span style="color:#d1d5db;font-size:12px;">Set date</span>`;
  return `<div onclick="inlineDueDateEdit(${t.rowIndex})" title="Click to edit" style="cursor:pointer;">
    <div style="color:${ov?"#dc2626":"#374151"};font-weight:${ov?600:400};font-size:12px;">${dateStr}</div>
    ${dueDaysBadge(t.dueDate, t.status)}
  </div>`;
}
function _statusCellInner(t) {
  return `<div onclick="inlineStatusEdit(${t.rowIndex})" title="Click to edit" style="cursor:pointer;display:inline-block;">${statusBadge(t.status)}</div>`;
}
function inlineDueDateEdit(rowIndex) {
  const td = document.getElementById("td-due-" + rowIndex);
  const t  = _findTaskByRow(rowIndex);
  if (!td || !t) return;
  td.innerHTML = `<input type="date" value="${t.dueDate||""}"
    style="font-size:12px;padding:4px 8px;border:1.5px solid #16a34a;border-radius:6px;color:#1b4332;outline:none;"
    onchange="saveInlineDueDate(${rowIndex},this.value)"
    onblur="cancelInlineDueDate(${rowIndex})"
    onkeydown="if(event.key==='Escape')cancelInlineDueDate(${rowIndex})"/>`;
  td.querySelector("input").focus();
}
function cancelInlineDueDate(rowIndex) {
  const td = document.getElementById("td-due-" + rowIndex);
  const t  = _findTaskByRow(rowIndex);
  if (td && t) td.innerHTML = _dueDateCellInner(t);
}
async function saveInlineDueDate(rowIndex, newDate) {
  const list = SESSION.role === "Manager" ? _allTasks : _memberTasks;
  const t = list.find(x => x.rowIndex === rowIndex);
  if (!t) return;
  t.dueDate = newDate;
  const td  = document.getElementById("td-due-" + rowIndex);
  const ov  = isOverdue(newDate) && t.status !== "Completed";
  if (td) td.innerHTML = _dueDateCellInner(t);
  const tr  = td?.closest("tr");
  if (tr) tr.style.background = ov ? "#fff1f2" : "#fff";
  try {
    await updateRow(CALENDAR_SHEET_ID, TASKS_SHEET_NAME, rowIndex,
      [t.taskId, t.assignedTo, t.task, newDate, t.priority, t.status, t.notes, t.url]);
    showToast("Saved ✓");
  } catch(e) { showToast("Save failed ✗"); }
}
function inlineStatusEdit(rowIndex) {
  const td = document.getElementById("td-status-" + rowIndex);
  const t  = _findTaskByRow(rowIndex);
  if (!td || !t) return;
  const opts = ["Not Started","In Progress","On Hold","Completed"].map(s =>
    `<option value="${s}" ${t.status===s?"selected":""}>${s}</option>`).join("");
  td.innerHTML = `<select style="font-size:12px;padding:4px 8px;border:1.5px solid #16a34a;border-radius:6px;color:#1b4332;outline:none;cursor:pointer;background:#fff;"
    onchange="saveInlineStatus(${rowIndex},this.value)"
    onblur="cancelInlineStatus(${rowIndex})"
    onkeydown="if(event.key==='Escape')cancelInlineStatus(${rowIndex})">${opts}</select>`;
  td.querySelector("select").focus();
}
function cancelInlineStatus(rowIndex) {
  const td = document.getElementById("td-status-" + rowIndex);
  const t  = _findTaskByRow(rowIndex);
  if (td && t) td.innerHTML = _statusCellInner(t);
}
async function saveInlineStatus(rowIndex, newStatus) {
  const list = SESSION.role === "Manager" ? _allTasks : _memberTasks;
  const t = list.find(x => x.rowIndex === rowIndex);
  if (!t) return;
  t.status = newStatus;
  const td    = document.getElementById("td-status-" + rowIndex);
  const tdDue = document.getElementById("td-due-" + rowIndex);
  if (td) td.innerHTML = _statusCellInner(t);
  if (tdDue) tdDue.innerHTML = _dueDateCellInner(t);
  const ov = isOverdue(t.dueDate) && newStatus !== "Completed";
  const tr = td?.closest("tr");
  if (tr) tr.style.background = ov ? "#fff1f2" : "#fff";
  try {
    await updateRow(CALENDAR_SHEET_ID, TASKS_SHEET_NAME, rowIndex,
      [t.taskId, t.assignedTo, t.task, t.dueDate, t.priority, newStatus, t.notes, t.url]);
    showToast("Saved ✓");
  } catch(e) { showToast("Save failed ✗"); }
}

function tabBarHTML() {

  if (SESSION.role === "Manager" || (SESSION.teams||[]).length > 0) tabs.push(["events","Business Calendar"]);
  tabs.push(["directory","Directory"]);
  if (SESSION.role === "Manager") tabs.push(["activity","User/Activity"]);
  if (SESSION.role === "Manager") tabs.push(["onboarding","Onboarding"]);
  tabs.push(["archive","Archive"]);
  return `<div style="display:flex;gap:4px;margin-bottom:24px;background:#fff;border-radius:10px;padding:4px;border:1px solid #d1fae5;width:fit-content;">` +
    tabs.map(([id,label]) => {
      const a = _activeTab === id;
      return `<button onclick="switchTab('${id}')" style="padding:7px 22px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;background:${a?"#1b4332":"transparent"};color:${a?"#fff":"#6b7280"};">${label}</button>`;
    }).join("") + `</div>`;

function switchTab(tab) {
  _activeTab = tab;
  if (tab === "calendar") _calView = "month";
  if (tab === "events")   _teamCalView = "month";
  render();
}

function normDate(d) {
  if (!d) return "";
  if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
  const m = String(d).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return `${m[3]}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`;
  const dt = new Date(d);
  if (!isNaN(dt)) return dt.toISOString().slice(0, 10);
  return d;
}

function rowsToEvents(rows) {
  if (rows.length < 2) return [];
  return rows.slice(1).map((r, i) => ({
    rowIndex:   i + 2,
    eventId:    r[0] || "",
    memberName: r[1] || "",
    notes:      r[2] || "",
    startDate:  normDate(r[3]),
    endDate:    normDate(r[4])
  })).filter(e => e.startDate && e.endDate);
}

function nextEventId(events) {
  const nums = events.map(e => parseInt((e.eventId||"").replace("VAC-",""), 10)).filter(n => !isNaN(n));
  return "VAC-" + String((nums.length ? Math.max(...nums) : 0) + 1).padStart(3, "0");
}

function teamColor(t) {
  if (!t || t === "All") return { bg:"#f1f5f9", color:"#475569", border:"#e2e8f0" };
  const palette = ["#dbeafe|#1e40af|#bfdbfe","#dcfce7|#166534|#bbf7d0","#fef9c3|#854d0e|#fde68a",
                   "#fce7f3|#9d174d|#fbcfe8","#ede9fe|#6d28d9|#ddd6fe"];
  let h = 0; for (const c of t) h = ((h<<5)-h+c.charCodeAt(0))|0;
  const [bg,color,border] = palette[Math.abs(h)%palette.length].split("|");
  return { bg, color, border };
}
function memberColor(name) {
  const palette = ["#3b82f6","#f59e0b","#ef4444","#8b5cf6","#06b6d4","#ec4899","#10b981","#f97316"];
  let h = 0;
  for (const c of (name || "")) h = ((h << 5) - h + c.charCodeAt(0)) | 0;
  return palette[Math.abs(h) % palette.length];
}

function renderCalendar() {
  const role = SESSION.role;
  document.getElementById("app").innerHTML = shellHTML(role, SESSION.name, tabBarHTML() + `<div id="cal-main"></div>`);
  if (_calLoaded) {
    _calView === "year" ? renderYearView() : renderCalendarGrid();
    _bgRefreshCal();
  } else {
    document.getElementById("cal-main").innerHTML = `<div class="spinner"></div>`;
    loadCalendarEvents();
  }
}

async function loadCalendarEvents() {
  const cached = _sGet(CAL_CACHE_KEY);
  if (cached) {
    _calEvents = cached;
    _calLoaded = true;
    _calView === "year" ? renderYearView() : renderCalendarGrid();
  }
  try {
    const rows  = await readSheet(CALENDAR_SHEET_ID, CALENDAR_SHEET_NAME);
    const fresh = rowsToEvents(rows);
    _sSet(CAL_CACHE_KEY, fresh);
    if (JSON.stringify(fresh) !== JSON.stringify(_calEvents)) {
      _calEvents = fresh;
      _calView === "year" ? renderYearView() : renderCalendarGrid();
    }
    _calLoaded = true;
  } catch(e) {
    if (!cached) {
      const el = document.getElementById("cal-main");
      if (el) el.innerHTML = `<div style="color:#dc2626;padding:16px;">Failed to load calendar: ${e.message}</div>`;
    }
  }
}

async function reloadCalendarEvents() {
  const rows  = await readSheet(CALENDAR_SHEET_ID, CALENDAR_SHEET_NAME);
  _calEvents  = rowsToEvents(rows);
  _sSet(CAL_CACHE_KEY, _calEvents);
  _calLoaded  = true;
  _calView === "year" ? renderYearView() : renderCalendarGrid();
}

async function _bgRefreshCal() {
  try {
    const rows  = await readSheet(CALENDAR_SHEET_ID, CALENDAR_SHEET_NAME);
    const fresh = rowsToEvents(rows);
    _sSet(CAL_CACHE_KEY, fresh);
    if (JSON.stringify(fresh) !== JSON.stringify(_calEvents)) {
      _calEvents = fresh;
      _calView === "year" ? renderYearView() : renderCalendarGrid();
    }
  } catch {}
}

function renderCalendarGrid() {
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DAYS   = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const year = _calYear, month = _calMonth;
  const firstDay    = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const td = new Date();
  const todayStr  = `${td.getFullYear()}-${String(td.getMonth()+1).padStart(2,"0")}-${String(td.getDate()).padStart(2,"0")}`;
  const mStart    = `${year}-${String(month+1).padStart(2,"0")}-01`;
  const mEnd      = `${year}-${String(month+1).padStart(2,"0")}-${String(daysInMonth).padStart(2,"0")}`;
  const monthEvts = _calEvents.filter(e => e.endDate >= mStart && e.startDate <= mEnd);

  const cells = Array(firstDay).fill(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const dayHeaders = DAYS.map(d =>
    `<div style="text-align:center;font-size:10px;font-weight:700;color:#9ca3af;padding:5px 2px;letter-spacing:0.4px;">${d}</div>`
  ).join("");

  const rowsHTML = [];
  for (let r = 0; r < cells.length; r += 7) {
    const rowCells = cells.slice(r, r+7).map(day => {
      if (!day) return `<div style="min-height:68px;background:#fafafa;border-right:1px solid #f3f4f6;"></div>`;
      const ds = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      const isToday = ds === todayStr;
      const dayEvts = monthEvts.filter(e => e.startDate <= ds && e.endDate >= ds);
      const chips = dayEvts.map(e => {
        const bg    = memberColor(e.memberName);
        const first = e.memberName.split(" ")[0];
        const label = e.notes ? `${first} · ${e.notes}` : first;
        return `<div onclick="event.stopPropagation();openCalEditModal(${e.rowIndex})"
          title="${e.memberName}: ${formatDueDate(e.startDate)} – ${formatDueDate(e.endDate)}${e.notes ? ' | '+e.notes : ''}"
          style="background:${bg};color:#fff;font-size:9px;font-weight:600;padding:1px 4px;border-radius:3px;margin-top:2px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${label}</div>`;
      }).join("");
      const bgNorm = isToday ? "#f0fdf4" : "#fff";
      const bgHov  = isToday ? "#d1fae5" : "#f9fafb";
      return `<div onclick="openCalAddModal('${ds}')"
        style="min-height:68px;padding:3px 4px;border-right:1px solid #f3f4f6;background:${bgNorm};cursor:pointer;"
        onmouseover="this.style.background='${bgHov}'" onmouseout="this.style.background='${bgNorm}'">
        <div style="font-size:11px;font-weight:${isToday?700:500};width:19px;height:19px;display:flex;align-items:center;justify-content:center;border-radius:50%;${isToday?"background:#1b4332;color:#fff;":"color:#374151;"}">${day}</div>
        ${chips}
      </div>`;
    }).join("");
    rowsHTML.push(`<div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid #f3f4f6;">${rowCells}</div>`);
  }

  const allNames = _calEvents.length
    ? [...new Set(_calEvents.map(e => e.memberName))].filter(Boolean)
    : (SESSION.role === "Manager" ? [SESSION.name, ...SESSION.memberRows.map(r => r[0])] : [SESSION.name]);
  const legendItems = allNames.map(n =>
    `<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#6b7280;white-space:nowrap;">
      <div style="width:7px;height:7px;border-radius:50%;background:${memberColor(n)};flex-shrink:0;"></div>${n.split(" ")[0]}
    </div>`
  ).join("");

  const el = document.getElementById("cal-main");
  if (el) el.innerHTML = `
    <div style="overflow-x:auto;">
    <div style="background:#fff;border-radius:16px;border:1px solid #d1fae5;overflow:hidden;min-width:560px;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #d1fae5;gap:6px;">
        <button onclick="calPrevMonth()" style="background:#f0fdf4;border:none;color:#1b4332;border-radius:8px;padding:4px 12px;font-size:18px;font-weight:700;cursor:pointer;line-height:1;flex-shrink:0;">&#8249;</button>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;flex:1;">
          <span style="font-size:15px;font-weight:700;color:#1b4332;">${MONTHS[month]} ${year}</span>
          ${calViewToggleHTML()}
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">${legendItems}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
          <button onclick="openCalAddModal(null)" style="background:#1b4332;color:#fff;font-size:11px;font-weight:600;padding:5px 10px;border-radius:8px;border:none;cursor:pointer;">+ Add</button>
          <button onclick="calNextMonth()" style="background:#f0fdf4;border:none;color:#1b4332;border-radius:8px;padding:4px 12px;font-size:18px;font-weight:700;cursor:pointer;line-height:1;">&#8250;</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);background:#f9fafb;border-bottom:1px solid #f3f4f6;">${dayHeaders}</div>
      ${rowsHTML.join("")}
    </div>
    </div>`;
}

function calPrevMonth() {
  if (_calMonth === 0) { _calMonth = 11; _calYear--; } else _calMonth--;
  renderCalendarGrid();
}
function calNextMonth() {
  if (_calMonth === 11) { _calMonth = 0; _calYear++; } else _calMonth++;
  renderCalendarGrid();
}
function calPrevYear() { _calYear--; renderYearView(); }
function calNextYear() { _calYear++; renderYearView(); }

function setCalView(view) {
  _calView = view;
  view === "year" ? renderYearView() : renderCalendarGrid();
}

function switchToMonth(monthIndex) {
  _calMonth = monthIndex;

}

function calViewToggleHTML() {
  return `<div style="display:flex;background:#f0fdf4;border-radius:7px;padding:2px;border:1px solid #d1fae5;">
    <button onclick="setCalView('month')" style="padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;border:none;cursor:pointer;background:${_calView==='month'?'#1b4332':'transparent'};color:${_calView==='month'?'#fff':'#6b7280'};">Month</button>

  </div>`;
}

function renderYearView() {
  const MONTHS  = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DAYS    = ["S","M","T","W","T","F","S"];
  const year    = _calYear;
  const td      = new Date();
  const todayStr = `${td.getFullYear()}-${String(td.getMonth()+1).padStart(2,"0")}-${String(td.getDate()).padStart(2,"0")}`;
  const yStart  = `${year}-01-01`, yEnd = `${year}-12-31`;
  const yEvts   = _calEvents.filter(e => e.endDate >= yStart && e.startDate <= yEnd);

  const allNames = yEvts.length
    ? [...new Set(yEvts.map(e => e.memberName))].filter(Boolean)
    : (SESSION.role === "Manager" ? [SESSION.name, ...SESSION.memberRows.map(r => r[0])] : [SESSION.name]);
  const legendItems = allNames.map(n =>
    `<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#6b7280;white-space:nowrap;">
      <div style="width:7px;height:7px;border-radius:50%;background:${memberColor(n)};flex-shrink:0;"></div>${n.split(" ")[0]}
    </div>`
  ).join("");

  const miniMonths = MONTHS.map((mName, mi) => {
    const mn       = mi + 1;
    const dim      = new Date(year, mn, 0).getDate();
    const fd       = new Date(year, mi, 1).getDay();
    const mStart   = `${year}-${String(mn).padStart(2,"0")}-01`;
    const mEnd     = `${year}-${String(mn).padStart(2,"0")}-${String(dim).padStart(2,"0")}`;
    const mEvts    = yEvts.filter(e => e.endDate >= mStart && e.startDate <= mEnd);

    const cells = Array(fd).fill(null);
    for (let d = 1; d <= dim; d++) cells.push(d);
    while (cells.length % 7 !== 0) cells.push(null);

    const hdr = DAYS.map(d => `<div style="text-align:center;font-size:7px;font-weight:700;color:#9ca3af;">${d}</div>`).join("");

    let gridRows = "";
    for (let r = 0; r < cells.length; r += 7) {
      const rowCells = cells.slice(r, r+7).map(day => {
        if (!day) return `<div style="height:18px;"></div>`;
        const ds      = `${year}-${String(mn).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
        const isToday = ds === todayStr;
        const dayEvts = mEvts.filter(e => e.startDate <= ds && e.endDate >= ds);
        const hasPTO  = dayEvts.length > 0;

        let cellBg = "transparent", numColor = "#374151", numBg = "transparent";
        if (isToday)     { numBg = "#1b4332"; numColor = "#fff"; }
        else if (hasPTO) { cellBg = memberColor(dayEvts[0].memberName) + "28"; numColor = "#111"; }

        const dots = hasPTO
          ? `<div style="display:flex;gap:1px;justify-content:center;">${
              dayEvts.slice(0,3).map(e => `<div style="width:3px;height:3px;border-radius:50%;background:${memberColor(e.memberName)};"></div>`).join("")
            }</div>`
          : "";

        const tip = hasPTO ? ` title="${dayEvts.map(e=>e.memberName.split(' ')[0]).join(', ')}"` : "";
        return `<div${tip} style="height:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:${cellBg};border-radius:2px;">
          <div style="font-size:8px;font-weight:${isToday?700:400};color:${numColor};background:${numBg};border-radius:50%;width:13px;height:13px;display:flex;align-items:center;justify-content:center;">${day}</div>
          ${dots}
        </div>`;
      }).join("");
      gridRows += `<div style="display:grid;grid-template-columns:repeat(7,1fr);">${rowCells}</div>`;
    }

    return `<div onclick="switchToMonth(${mi})" title="View ${mName}"
      style="background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:8px 6px;cursor:pointer;"
      onmouseover="this.style.borderColor='#1b4332';this.style.background='#f0fdf4'"
      onmouseout="this.style.borderColor='#e5e7eb';this.style.background='#fff'">
      <div style="font-size:11px;font-weight:700;color:#1b4332;text-align:center;margin-bottom:5px;">${mName}</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px;">${hdr}</div>
      ${gridRows}
    </div>`;
  });

  const el = document.getElementById("cal-main");
  if (el) el.innerHTML = `
    <div style="overflow-x:auto;">
    <div style="background:#fff;border-radius:16px;border:1px solid #d1fae5;overflow:hidden;min-width:600px;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #d1fae5;gap:6px;">
        <button onclick="calPrevYear()" style="background:#f0fdf4;border:none;color:#1b4332;border-radius:8px;padding:4px 12px;font-size:18px;font-weight:700;cursor:pointer;line-height:1;flex-shrink:0;">&#8249;</button>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;flex:1;">
          <span style="font-size:15px;font-weight:700;color:#1b4332;">${year}</span>
          ${calViewToggleHTML()}
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">${legendItems}</div>
        </div>
        <button onclick="calNextYear()" style="background:#f0fdf4;border:none;color:#1b4332;border-radius:8px;padding:4px 12px;font-size:18px;font-weight:700;cursor:pointer;line-height:1;flex-shrink:0;">&#8250;</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px;">
        ${miniMonths.join("")}
      </div>
    </div>
    </div>`;
}

          <button onclick="doSaveCalEvent()" style="background:#1b4332;color:#fff;font-size:12px;font-weight:600;padding:7px 16px;border-radius:8px;border:none;cursor:pointer;">Save</button>

function closeCalModal() {
  _calModal = null;
  const el = document.getElementById("cal-modal");
  if (el) el.remove();
}

function calStartDateChanged() {
  const s = document.getElementById("cm-start").value;
  const eEl = document.getElementById("cm-end");
  if (!eEl.value || eEl.value < s) eEl.value = s;
}

function hasDateOverlap(memberName, startDate, endDate, excludeRowIndex) {
  return _calEvents.find(e =>
    e.memberName === memberName &&
    (excludeRowIndex === null || e.rowIndex !== excludeRowIndex) &&
    e.startDate <= endDate && e.endDate >= startDate
  );
}

function calModalError(msg) {
  const el = document.getElementById("cm-error");
  if (!el) return;
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
}

async function doSaveCalEvent() {
  const memberName = document.getElementById("cm-member").value;
  const startDate  = document.getElementById("cm-start").value;
  const endDate    = document.getElementById("cm-end").value;
  const notes      = document.getElementById("cm-notes").value;
  const m = _calModal;

  calModalError("");
  if (!memberName || !startDate || !endDate) { calModalError("Member and dates are required."); return; }
  if (endDate < startDate) { calModalError("End date cannot be before start date."); return; }

  const excludeRow = m.mode === "edit" ? m.rowIndex : null;
  const conflict = hasDateOverlap(memberName, startDate, endDate, excludeRow);
  if (conflict) {
    const who = conflict.memberName.split(" ")[0];
    calModalError(`${who} already has vacation from ${conflict.startDate} to ${conflict.endDate} that overlaps with these dates.`);
    return;
  }

  try {
    if (m.mode === "add") {
      await appendRow(CALENDAR_SHEET_ID, CALENDAR_SHEET_NAME, [nextEventId(_calEvents), memberName, notes, startDate, endDate]);
    } else {
      await updateRow(CALENDAR_SHEET_ID, CALENDAR_SHEET_NAME, m.rowIndex, [m.eventId, memberName, notes, startDate, endDate]);
    }
    closeCalModal();
    await reloadCalendarEvents();
    showToast("Saved ✓");
  } catch(e) { alert("Save failed: " + e.message); }
}

async function doDeleteCalEvent(rowIndex) {
  if (!confirm("Delete this vacation?")) return;
  try {
    await deleteRowProxy(CALENDAR_SHEET_ID, CALENDAR_SHEET_NAME, rowIndex);
    closeCalModal();
    await reloadCalendarEvents();
    showToast("Deleted");
  } catch(e) { alert("Delete failed: " + e.message); }
}

async function doSaveUser(isEdit) {
  const name  = document.getElementById("um-name").value.trim();
  const pin   = document.getElementById("um-pin").value.trim();
  const role  = document.getElementById("um-role").value;
  const title = document.getElementById("um-title").value.trim();
  const team  = [...document.querySelectorAll(".um-team-cb:checked")].map(cb => cb.value).join(",");
  const email = document.getElementById("um-email").value.trim();
  const phone = document.getElementById("um-phone").value.trim();
  const errEl = document.getElementById("um-error");
  const btnEl = document.getElementById("um-save-btn");

  errEl.textContent = "";
  if (!name) { errEl.textContent = "Name is required."; return; }
  if (!isEdit && !pin) { errEl.textContent = "PIN is required for new users."; return; }
  if (pin && !/^\d{4}$/.test(pin)) { errEl.textContent = "PIN must be exactly 4 digits."; return; }

  btnEl.disabled = true; btnEl.textContent = "Saving…";
  try {
    if (isEdit) {
      const result = await proxyCall({ action: "updateUser", sheetId: CALENDAR_SHEET_ID,
        name, newPin: pin, role, title, team, email, phone });
      if (!result || !result.ok) throw new Error(result?.error || "Update failed");
      // Update _configRows in memory
      window._configRows = (window._configRows||[]).map(r =>
        r[0] === name ? [r[0], r[1], role, email, phone, title, team] : r
      );
    } else {
      if ((window._configRows||[]).some(r => r[0] === name)) {
        errEl.textContent = "A user with this name already exists.";
        btnEl.disabled = false; btnEl.textContent = "Add User"; return;
      }
      await appendRow(CALENDAR_SHEET_ID, CONFIG_SHEET_NAME, [name, pin, role, email, phone, title, team]);
      window._configRows = [...(window._configRows||[]), [name, "", role, email, phone, title, team]];
      // Update login name cache
      setCachedLoginNames((window._configRows||[]).filter(r=>r[0]).map(r=>r[0]));
    }
    _closeUserModal();
    loadActivityLog(); // refresh activity tab to show updated user list
    showToast(isEdit ? "User updated ✓" : "User added ✓");
  } catch(e) {
    errEl.textContent = "Failed: " + e.message;
    btnEl.disabled = false; btnEl.textContent = isEdit ? "Save Changes" : "Add User";
  }
}

async function doRemoveUser(name) {
  if (!confirm(`Remove "${name}" from the team?\n\nThis deletes them from the Config sheet. Their tasks and archived tasks will remain.`)) return;
  try {
    const result = await proxyCall({ action: "deleteUser", sheetId: CALENDAR_SHEET_ID, name });
    if (!result || !result.ok) throw new Error(result?.error || "Delete failed");
    window._configRows = (window._configRows||[]).filter(r => r[0] !== name);
    setCachedLoginNames((window._configRows||[]).filter(r=>r[0]).map(r=>r[0]));
    loadActivityLog();
    showToast(`${name.split(" ")[0]} removed ✓`);
  } catch(e) { alert("Remove failed: " + e.message); }
}

async function _fetchIP() {
  try {
    const r = await fetch("https://api.ipify.org?format=json");
    return (await r.json()).ip || "Unknown";
  } catch { return "Unknown"; }
}

async function logLoginActivity() {
  try {
    const now = new Date();
    const ts  = `${now.toLocaleDateString("en-US")} ${now.toLocaleTimeString("en-US", {hour:"2-digit",minute:"2-digit",second:"2-digit"})}`;
    const ip  = await _fetchIP();
    await appendRow(CALENDAR_SHEET_ID, LOGIN_LOG_SHEET_NAME, [ts, SESSION.name, SESSION.role, ip, "Success"]);
  } catch { /* silent — don't block login flow */ }
}

async function logLoginFailure(name) {
  try {
    const now  = new Date();
    const ts   = `${now.toLocaleDateString("en-US")} ${now.toLocaleTimeString("en-US", {hour:"2-digit",minute:"2-digit",second:"2-digit"})}`;
    const ip   = await _fetchIP();
    const role = (window._configRows || []).find(r => r[1] === name)?.[2] || "";
    await appendRow(CALENDAR_SHEET_ID, LOGIN_LOG_SHEET_NAME, [ts, name, role, ip, "Failure"]);

function renderActivity() {
  document.getElementById("app").innerHTML = shellHTML("Manager", SESSION.name, tabBarHTML() + `<div id="activity-main"></div>`);
  if (_actLoaded) {
    const cached = _sGet(ACT_CACHE_KEY);
    if (cached) renderActivityTable(cached);
    _bgRefreshActivity();
  } else {
    document.getElementById("activity-main").innerHTML = `<div class="spinner"></div>`;
    loadActivityLog();
  }
}

async function loadActivityLog() {
  const cached = _sGet(ACT_CACHE_KEY);
  if (cached) {
    _actLoaded = true;
    renderActivityTable(cached);
  }
  try {
    const [logRows, statusRows] = await Promise.all([
      readSheet(CALENDAR_SHEET_ID, LOGIN_LOG_SHEET_NAME).catch(() => []),
      readSheet(CALENDAR_SHEET_ID, ACCOUNT_STATUS_SHEET_NAME).catch(() => [])
    ]);
    window._accountStatus = rowsToAccountStatus(statusRows);
    _sSet(ACT_CACHE_KEY, logRows);
    if (JSON.stringify(logRows) !== JSON.stringify(cached)) {
      renderActivityTable(logRows);
    }
    _actLoaded = true;
  } catch(e) {
    if (!cached) {
      const el = document.getElementById("activity-main");
      if (el) el.innerHTML = `<div style="color:#dc2626;padding:16px;">Failed to load activity: ${e.message}</div>`;
    }
  }
}

async function _bgRefreshActivity() {
  try {
    const [logRows, statusRows] = await Promise.all([
      readSheet(CALENDAR_SHEET_ID, LOGIN_LOG_SHEET_NAME).catch(() => []),
      readSheet(CALENDAR_SHEET_ID, ACCOUNT_STATUS_SHEET_NAME).catch(() => [])
    ]);
    window._accountStatus = rowsToAccountStatus(statusRows);
    const prev = _sGet(ACT_CACHE_KEY);
    _sSet(ACT_CACHE_KEY, logRows);
    if (JSON.stringify(logRows) !== JSON.stringify(prev)) renderActivityTable(logRows);
  } catch {}
}

async function refreshLoginHistory() {
  const btn = document.getElementById("act-refresh-btn");
  if (btn) { btn.disabled = true; btn.textContent = "↻ Loading…"; }
  _sDel(ACT_CACHE_KEY);
  _actLoaded = false;
  await loadActivityLog();
}

async function unlockAccount(name) {
  await resetAccountStatus(name); // updates _accountStatus in-memory immediately
  showToast(`${name.split(" ")[0]}'s account unlocked`);
  const cached = _sGet(ACT_CACHE_KEY);
  if (cached) renderActivityTable(cached); // instant re-render with updated status
  _sDel(ACT_CACHE_KEY); _actLoaded = false;
  loadActivityLog(); // background sync
}

async function lockAccount(name) {
  const s      = (window._accountStatus || {})[name];
  const failed = 0; // manual lock — reset attempts so it's distinguished from auto-lockout
  lsSetUser(name, { failed, locked: true });
  if (!window._accountStatus) window._accountStatus = {};
  window._accountStatus[name] = { ...(s || { rowIndex: null }), failed, locked: true };
  showToast(`${name.split(" ")[0]}'s account locked`);
  const cached = _sGet(ACT_CACHE_KEY);
  if (cached) renderActivityTable(cached); // instant re-render
  try {
    if (s?.rowIndex) {
      await updateRow(CALENDAR_SHEET_ID, ACCOUNT_STATUS_SHEET_NAME, s.rowIndex, [name, String(failed), "TRUE"]);
    } else {
      await appendRow(CALENDAR_SHEET_ID, ACCOUNT_STATUS_SHEET_NAME, [name, String(failed), "TRUE"]);
      const rows = await readSheet(CALENDAR_SHEET_ID, ACCOUNT_STATUS_SHEET_NAME);
      window._accountStatus = rowsToAccountStatus(rows);
    }
  } catch {}
  _sDel(ACT_CACHE_KEY); _actLoaded = false;
  loadActivityLog();
}

  const el = document.getElementById("activity-main");

  const dataRows = logRows.length > 1 ? logRows.slice(1).reverse() : [];

  const logDates = dataRows.map(r => r[0] ? new Date(r[0]) : null).filter(d => d && !isNaN(d));
  const earliestDate = logDates.length ? logDates.reduce((a,b) => a<b?a:b) : new Date();
  const purgeFromDefault = _toInputDate(earliestDate);
  const purgeTodayDefault = _toInputDate(new Date());
  const purgeHTML = `

        🗑 Purge
      </button>
      <span id="purge-status" style="font-size:12px;color:#9ca3af;"></span>
    </div>`;

  const logHTML = `
    <div style="background:#fff;border-radius:14px;border:1px solid #d1fae5;overflow:hidden;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #d1fae5;">
        <span style="font-size:14px;font-weight:700;color:#1b4332;">Login History</span>
        <div style="display:flex;align-items:center;gap:12px;">
          <span style="font-size:12px;color:#9ca3af;">${dataRows.length} record${dataRows.length!==1?"s":""}</span>
          <button id="act-refresh-btn" onclick="refreshLoginHistory()"
            style="font-size:12px;font-weight:600;padding:5px 12px;border-radius:8px;border:1.5px solid #d1fae5;background:#f0fdf4;color:#1b4332;cursor:pointer;">
            ↻ Refresh
          </button>
        </div>
      </div>
      ${dataRows.length === 0
        ? `<div style="padding:3rem;text-align:center;color:#9ca3af;">No login activity recorded yet.</div>`
        : `<div style="overflow-x:auto;">
            <table style="width:100%;font-size:13px;">
              <thead><tr style="background:#f0fdf4;">
                ${["Timestamp","Name","Role","Status","IP Address"].map(h=>`<th style="padding:10px 14px;font-weight:600;color:#1b4332;border-bottom:2px solid #d1fae5;white-space:nowrap;text-align:left;">${h}</th>`).join("")}
              </tr></thead>
              <tbody>${dataRows.map((r,i) => {
                const isFail = (r[4]||"").toLowerCase() === "failure";
                const rowBg  = isFail ? "#fff5f5" : (i%2===0?"#fff":"#fafafa");
                const statusBadge = isFail
                  ? `<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;">Failed</span>`
                  : `<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#dcfce7;color:#16a34a;border:1px solid #86efac;">Success</span>`;
                return `<tr style="background:${rowBg};border-bottom:1px solid #f0fdf4;">
                  <td style="padding:9px 14px;white-space:nowrap;color:#374151;font-size:12px;">${formatTimestamp(r[0])}</td>
                  <td style="padding:9px 14px;font-weight:600;color:${isFail?"#dc2626":"#1b4332"};">${r[1]||""}</td>
                  <td style="padding:9px 14px;">${r[2] ? roleBadge(r[2]) : '<span style="color:#d1d5db;">—</span>'}</td>
                  <td style="padding:9px 14px;">${statusBadge}</td>
                  <td style="padding:9px 14px;color:#6b7280;font-family:monospace;font-size:11px;">${r[3]||""}</td>
                </tr>`;
              }).join("")}
              </tbody>
            </table>
          </div>`}
    </div>`;

  const usersHTML = renderUsersPanel();
  const teamsHTML = renderTeamsPanel();
  el.innerHTML = teamsHTML + usersHTML + purgeHTML + logHTML;
}

function roleBadge(role) {
  const s = role === "Manager" ? "background:#dbeafe;color:#1e40af" : "background:#dcfce7;color:#166534";
  return `<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;${s}">${role}</span>`;
}

async function purgeActivityLog() {
  const fromEl   = document.getElementById("purge-from");
  const toEl     = document.getElementById("purge-to");
  const statusEl = document.getElementById("purge-status");

  if (!fromEl?.value || !toEl?.value) {
    if (statusEl) statusEl.textContent = "Select a date range.";
    return;
  }

  const fromDate = new Date(fromEl.value + "T00:00:00");
  const toDate   = new Date(toEl.value   + "T23:59:59");

  if (fromDate > toDate) {
    if (statusEl) statusEl.textContent = "From date must be before To date.";
    return;
  }

  if (statusEl) statusEl.textContent = "Scanning…";
  let rows;
  try {
    rows = await readSheet(CALENDAR_SHEET_ID, LOGIN_LOG_SHEET_NAME);
  } catch(e) {
    if (statusEl) statusEl.textContent = "Failed to load records.";
    alert("Purge error: " + e.message);
    return;
  }

  if (!rows || rows.length < 2) {
    if (statusEl) statusEl.textContent = "No records to purge.";
    return;
  }

  const toDelete = [];
  rows.slice(1).forEach((r, i) => {
    const raw = r[0];
    if (!raw) return;
    const dt = new Date(raw);
    if (!isNaN(dt) && dt >= fromDate && dt <= toDate) toDelete.push(i + 2);
  });

  if (!toDelete.length) {
    if (statusEl) statusEl.textContent = "";
    alert(`No login records found between ${fromEl.value} and ${toEl.value}.`);
    return;
  }

  if (!confirm(`Delete ${toDelete.length} login record${toDelete.length !== 1 ? "s" : ""} from ${fromEl.value} to ${toEl.value}?`)) {
    if (statusEl) statusEl.textContent = "";
    return;
  }

  if (statusEl) statusEl.textContent = "Deleting…";
  try {
    toDelete.sort((a, b) => b - a);
    await batchDeleteRowProxy(CALENDAR_SHEET_ID, LOGIN_LOG_SHEET_NAME, toDelete);
    _sDel(ACT_CACHE_KEY); _actLoaded = false;
    await loadActivityLog();
    showToast(`Purged ${toDelete.length} record${toDelete.length !== 1 ? "s" : ""} ✓`);
  } catch(e) {
    if (statusEl) statusEl.textContent = "Purge failed.";
    alert("Purge failed: " + e.message);
  }
}

// ── TEAM LINKS ─────────────────────────────────────────────────────────────────
let _allLinks    = [];
let _linkModal   = null;

const LINKS_CACHE_KEY = "tmgr_links";
let _linksLoaded = false;
let _linksFilterTeam = "All";
let _linksSearch    = "";
let _linksDragging  = null;
const LINKS_ORDER_KEY = "tmgr_links_order";

function rowsToLinks(rows) {
  if (rows.length < 2) return [];
  return rows.slice(1).map((r, i) => ({
    rowIndex: i + 2,
    linkId: r[0] || "",
    team:   r[1] || "All",
    title:  r[2] || "",
    url:    r[3] || "",
    desc:   r[4] || ""
  })).filter(l => l.title && l.url);
}

function renderLinks() {
  document.getElementById("app").innerHTML = shellHTML(SESSION.role, SESSION.name,
    tabBarHTML() + `<div id="links-main"></div>`);
  if (_linksLoaded) {
    renderLinksView();
    _bgRefreshLinks();
  } else {
    document.getElementById("links-main").innerHTML = `<div class="spinner"></div>`;
    loadTeamLinks();
  }
}

async function loadTeamLinks() {
  const cached = _sGet(LINKS_CACHE_KEY);
  if (cached) {
    _allLinks   = cached;
    _linksLoaded = true;
    renderLinksView();
  }
  try {
    const rows  = await readSheet(CALENDAR_SHEET_ID, TEAM_LINKS_SHEET_NAME);
    const fresh = rowsToLinks(rows);
    _sSet(LINKS_CACHE_KEY, fresh);
    if (JSON.stringify(fresh) !== JSON.stringify(_allLinks)) {
      _allLinks = fresh;
      renderLinksView();
    }
    _linksLoaded = true;
  } catch {
    _allLinks = cached || [];
    _linksLoaded = true;
    renderLinksView();
  }
}

async function _bgRefreshLinks() {
  try {
    const rows  = await readSheet(CALENDAR_SHEET_ID, TEAM_LINKS_SHEET_NAME);
    const fresh = rowsToLinks(rows);
    _sSet(LINKS_CACHE_KEY, fresh);
    if (JSON.stringify(fresh) !== JSON.stringify(_allLinks)) {
      _allLinks = fresh;
      renderLinksView();
    }
  } catch {}
}

function _getLinksOrder() {
  try { return JSON.parse(localStorage.getItem(LINKS_ORDER_KEY) || "[]"); } catch { return []; }
}

function setLinksFilter(team) {
  _linksFilterTeam = team;
  _linksSearch = "";
  renderLinksView();
}

function linksSearch(q) {
  _linksSearch = q.toLowerCase();
  renderLinksView();
  // restore cursor after innerHTML re-render
  const inp = document.getElementById("links-search-input");
  if (inp && document.activeElement !== inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}

function onLinkDragStart(e, id) {
  _linksDragging = id;
  e.dataTransfer.effectAllowed = "move";
  e.currentTarget.style.opacity = "0.4";
}
function onLinkDragEnd(e) {
  e.currentTarget.style.opacity = "";
  document.querySelectorAll("tr[data-lid]").forEach(r => r.style.borderTop = "");
}
function onLinkDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  document.querySelectorAll("tr[data-lid]").forEach(r => r.style.borderTop = "");
  e.currentTarget.style.borderTop = "2px solid #1b4332";
}
function onLinkDrop(e, targetId) {
  e.preventDefault();
  document.querySelectorAll("tr[data-lid]").forEach(r => r.style.borderTop = "");
  if (!_linksDragging || _linksDragging === targetId) { _linksDragging = null; return; }
  const isManager = SESSION.role === "Manager";
  const myTeams = SESSION.teams || [];
  const accessible = isManager
    ? [..._allLinks]
    : _allLinks.filter(l => l.team === "All" || myTeams.includes(l.team));
  const prev = _getLinksOrder();
  const ordered   = prev.filter(id => accessible.some(l => l.linkId === id));
  const unordered = accessible.filter(l => !prev.includes(l.linkId)).map(l => l.linkId);
  const full = [...ordered, ...unordered];
  const fi = full.indexOf(_linksDragging), ti = full.indexOf(targetId);
  if (fi !== -1 && ti !== -1) { full.splice(fi, 1); full.splice(ti, 0, _linksDragging); }
  localStorage.setItem(LINKS_ORDER_KEY, JSON.stringify(full));
  _linksDragging = null;
  renderLinksView();
}

function renderLinksView() {
  const el = document.getElementById("links-main");
  if (!el) return;
  const isManager = SESSION.role === "Manager";
  const myTeams   = SESSION.teams || [];

  // all links accessible to this user, applying custom order or alphabetical fallback
  let accessible = isManager
    ? [..._allLinks]
    : _allLinks.filter(l => l.team === "All" || myTeams.includes(l.team));

  const savedOrder = _getLinksOrder();
  if (savedOrder.length) {
    accessible.sort((a, b) => {
      const ai = savedOrder.indexOf(a.linkId), bi = savedOrder.indexOf(b.linkId);
      if (ai === -1 && bi === -1) return a.team.localeCompare(b.team) || a.title.localeCompare(b.title);
      if (ai === -1) return 1; if (bi === -1) return -1;
      return ai - bi;
    });
  } else {
    accessible.sort((a,b) => a.team.localeCompare(b.team) || a.title.localeCompare(b.title));
  }

  // unique teams present in accessible links (excluding "All" from chip list)
  const teamSet = [...new Set(accessible.map(l => l.team).filter(t => t !== "All"))].sort();
  const showChips = teamSet.length > 1;

  // apply team filter
  const teamFiltered = (_linksFilterTeam !== "All" && showChips)
    ? accessible.filter(l => l.team === _linksFilterTeam || l.team === "All")
    : accessible;

  // apply search filter
  const q = _linksSearch.trim().toLowerCase();
  const visible = q
    ? teamFiltered.filter(l =>
        l.title.toLowerCase().includes(q) ||
        (l.desc && l.desc.toLowerCase().includes(q)) ||
        l.team.toLowerCase().includes(q))
    : teamFiltered;

  // drag only active when not searching (search is a temporary view)
  const canDrag = isManager && !q;

  const addBtn = isManager
    ? `<button onclick="openLinkModal('add')" style="padding:8px 16px;border-radius:8px;background:#1b4332;color:#fff;font-size:13px;font-weight:600;border:none;white-space:nowrap;">+ Add Link</button>`
    : "";

  const searchBox = `<div style="position:relative;flex:1;max-width:280px;">
    <span style="position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:13px;color:#9ca3af;pointer-events:none;">&#128269;</span>
    <input id="links-search-input" type="text" value="${_linksSearch.replace(/"/g,'&quot;')}"
      oninput="linksSearch(this.value)"
      placeholder="Search links…"
      style="width:100%;box-sizing:border-box;padding:7px 10px 7px 30px;border-radius:20px;border:1.5px solid #d1fae5;font-size:12px;outline:none;"/>
  </div>`;

  const filterChips = showChips ? `
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;">
      ${[{t:"All",label:"All"}, ...teamSet.map(t=>({t,label:t}))].map(({t,label}) => {
        const active = _linksFilterTeam === t;
        const tc = t === "All" ? {bg:"#1b4332",color:"#fff",border:"#1b4332"} : teamColor(t);
        const bg = active ? tc.bg : "#f9fafb";
        const fg = active ? tc.color : "#374151";
        const border = active ? tc.border : "#e5e7eb";
        return `<button onclick="setLinksFilter('${t}')"
          style="padding:5px 14px;border-radius:999px;font-size:12px;font-weight:600;border:1.5px solid ${border};background:${bg};color:${fg};cursor:pointer;">${label}</button>`;
      }).join("")}
    </div>` : "";

  const topBar = `${filterChips}
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      ${searchBox}
      <div style="flex:1;"></div>
      ${addBtn}
    </div>`;

  if (!accessible.length) {
    el.innerHTML = topBar + `<div style="text-align:center;padding:3rem;color:#9ca3af;">No links yet${isManager?"":" for your team"}.</div>`;
    return;
  }

  const dragHandleTh = canDrag ? `<th style="width:24px;padding:8px 4px;border-bottom:2px solid #d1fae5;"></th>` : "";

  const rows = visible.map((l, i) => {
    const tc = teamColor(l.team);
    const teamCell = `<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:${tc.bg};color:${tc.color};border:1px solid ${tc.border};white-space:nowrap;">${l.team}</span>`;
    const rowBg = i % 2 === 0 ? "#fff" : "#fafafa";
    const dragAttrs = canDrag
      ? `draggable="true" data-lid="${l.linkId}"
         ondragstart="onLinkDragStart(event,'${l.linkId}')"
         ondragend="onLinkDragEnd(event)"
         ondragover="onLinkDragOver(event)"
         ondrop="onLinkDrop(event,'${l.linkId}')"` : "";
    const dragCell = canDrag
      ? `<td style="padding:8px 4px;text-align:center;cursor:grab;color:#c4c9d0;user-select:none;font-size:14px;" title="Drag to reorder">⠿</td>`
      : "";
    return `<tr ${dragAttrs} style="background:${rowBg};border-bottom:1px solid #f3f4f6;">
      ${dragCell}
      <td style="padding:8px 10px;white-space:nowrap;">${teamCell}</td>
      <td style="padding:8px 12px;">
        <div style="font-size:13px;font-weight:600;color:#1b4332;">${l.title}</div>
        ${l.desc ? `<div style="font-size:11px;color:#9ca3af;margin-top:1px;">${l.desc}</div>` : ""}
      </td>
      <td style="padding:8px 10px;white-space:nowrap;">
        <a href="${l.url}" target="_blank" rel="noopener"
          style="font-size:11px;font-weight:600;color:#1b4332;background:#f0fdf4;border:1px solid #d1fae5;padding:4px 10px;border-radius:6px;text-decoration:none;">
          Open →
        </a>
      </td>
      ${isManager ? `<td style="padding:8px 10px;white-space:nowrap;">
        <button onclick="openLinkModal('edit',${l.rowIndex})" style="background:#f0fdf4;color:#1b4332;font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;border:none;cursor:pointer;">Edit</button>
        <button onclick="deleteLink(${l.rowIndex})" style="background:#fff1f2;color:#dc2626;font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;border:none;cursor:pointer;margin-left:4px;">Del</button>
      </td>` : ""}
    </tr>`;
  }).join("");

  el.innerHTML = topBar + `
    <div style="background:#fff;border-radius:14px;border:1px solid #d1fae5;overflow:hidden;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #d1fae5;background:#f9fafb;">
        <span style="font-size:13px;font-weight:700;color:#1b4332;">Links</span>
        <span style="font-size:12px;color:#9ca3af;">${visible.length} link${visible.length!==1?"s":""}</span>
      </div>
      <div style="overflow-x:auto;">
        <table style="width:100%;font-size:13px;border-collapse:collapse;">
          <thead>
            <tr style="background:#f0fdf4;">
              ${dragHandleTh}
              <th style="padding:8px 10px;font-weight:600;color:#1b4332;border-bottom:2px solid #d1fae5;text-align:left;white-space:nowrap;">Team</th>
              <th style="padding:8px 12px;font-weight:600;color:#1b4332;border-bottom:2px solid #d1fae5;text-align:left;">Title / Description</th>
              <th style="padding:8px 10px;border-bottom:2px solid #d1fae5;"></th>
              ${isManager ? `<th style="padding:8px 10px;font-weight:600;color:#1b4332;border-bottom:2px solid #d1fae5;text-align:left;">Actions</th>` : ""}
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;

  if (q) {
    const inp = document.getElementById("links-search-input");
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }
}

function openLinkModal(mode, rowIndex) {
  const existing = mode === "edit" ? _allLinks.find(l => l.rowIndex === rowIndex) : null;
  _linkModal = existing ? { mode:"edit", ...existing } : { mode:"add", linkId:"", team:"All", title:"", url:"", desc:"", rowIndex:null };
  renderLinkModal();
}

  const teams   = ["All", ...getTeamNames()];

  document.body.insertAdjacentHTML("beforeend", `

      style="position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:1000;">
      <div onclick="event.stopPropagation()"

        <div style="font-size:15px;font-weight:700;color:#1b4332;margin-bottom:16px;">${isEdit?"Edit":"Add"} Link</div>

        <label style="font-size:11px;font-weight:700;color:#6b7280;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;">Title *</label>
        <input id="lm-title" value="${m.title.replace(/"/g,"&quot;")}" placeholder="e.g. Workday Training Guide"
          style="${F} margin-bottom:14px;"/>

        <label style="font-size:11px;font-weight:700;color:#6b7280;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;">URL *</label>
        <input id="lm-url" type="url" value="${m.url.replace(/"/g,"&quot;")}" placeholder="https://..."
          style="${F} margin-bottom:14px;"/>

        <label style="font-size:11px;font-weight:700;color:#6b7280;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;">Description</label>
        <input id="lm-desc" value="${(m.desc||"").replace(/"/g,"&quot;")}" placeholder="Optional description"

          <div style="flex:1;"></div>
          <button onclick="closeLinkModal()" style="background:#fff;color:#374151;font-size:12px;font-weight:600;padding:7px 16px;border-radius:8px;border:1.5px solid #e5e7eb;cursor:pointer;">Cancel</button>
          <button onclick="doSaveLink()" style="background:#1b4332;color:#fff;font-size:12px;font-weight:600;padding:7px 16px;border-radius:8px;border:none;cursor:pointer;">Save</button>
        </div>

  document.getElementById("lm-title").focus();
}

function closeLinkModal() {
  _linkModal = null;
  const el = document.getElementById("link-modal");
  if (el) el.remove();
}

function nextLinkId(links) {
  const nums = links.map(l => parseInt((l.linkId||"").replace("LNK-",""),10)).filter(n=>!isNaN(n));
  return "LNK-" + String((nums.length ? Math.max(...nums) : 0) + 1).padStart(3,"0");
}

async function doSaveLink() {
  const team  = document.getElementById("lm-team").value;
  const title = document.getElementById("lm-title").value.trim();
  const url   = document.getElementById("lm-url").value.trim();
  const desc  = document.getElementById("lm-desc").value.trim();
  const m     = _linkModal;
  const errEl = document.getElementById("lm-error");
  if (!title) { errEl.textContent = "Title is required."; return; }
  if (!url)   { errEl.textContent = "URL is required."; return; }
  try {
    if (m.mode === "add") {
      await appendRow(CALENDAR_SHEET_ID, TEAM_LINKS_SHEET_NAME, [nextLinkId(_allLinks), team, title, url, desc]);
    } else {
      await updateRow(CALENDAR_SHEET_ID, TEAM_LINKS_SHEET_NAME, m.rowIndex, [m.linkId, team, title, url, desc]);
    }
    closeLinkModal();
    _sDel(LINKS_CACHE_KEY); _linksLoaded = false;
    await loadTeamLinks();
    showToast("Saved ✓");
  } catch(e) { errEl.textContent = "Save failed: " + e.message; }
}

async function deleteLink(rowIndex) {
  const l = _allLinks.find(l => l.rowIndex === rowIndex);
  if (!l || !confirm(`Delete "${l.title}"?`)) return;
  closeLinkModal();
  try {
    await deleteRowProxy(CALENDAR_SHEET_ID, TEAM_LINKS_SHEET_NAME, rowIndex);
    _sDel(LINKS_CACHE_KEY); _linksLoaded = false;
    await loadTeamLinks();
    showToast("Deleted");
  } catch(e) { alert("Delete failed: " + e.message); }
}

        <input id="cp-confirm" type="password" maxlength="4" placeholder="••••" style="${F} margin-bottom:14px;"
          onkeydown="if(event.key==='Enter')doChangePin()"/>

        <div id="cp-error" style="color:#dc2626;font-size:12px;min-height:16px;margin-bottom:12px;"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button onclick="closeChangePinModal()" style="background:#fff;color:#374151;font-size:12px;font-weight:600;padding:7px 16px;border-radius:8px;border:1.5px solid #e5e7eb;cursor:pointer;">Cancel</button>
          <button id="cp-save-btn" onclick="doChangePin()" style="background:#1b4332;color:#fff;font-size:12px;font-weight:600;padding:7px 16px;border-radius:8px;border:none;cursor:pointer;">Update PIN</button>
        </div>
      </div>
    </div>`);
  document.getElementById("cp-current").focus();
}

function closeChangePinModal() {
  const el = document.getElementById("change-pin-modal");
  if (el) el.remove();
}

async function doChangePin() {
  const current  = document.getElementById("cp-current").value.trim();
  const newPin   = document.getElementById("cp-new").value.trim();
  const confirm  = document.getElementById("cp-confirm").value.trim();
  const errEl    = document.getElementById("cp-error");
  const btnEl    = document.getElementById("cp-save-btn");

  errEl.textContent = "";

  if (!/^\d{4}$/.test(newPin)) {
    errEl.textContent = "New PIN must be exactly 4 digits."; return;
  }
  if (newPin !== confirm) {
    errEl.textContent = "New PIN and confirmation do not match."; return;
  }
  if (newPin === current) {
    errEl.textContent = "New PIN must be different from the current PIN."; return;
  }

  btnEl.disabled = true; btnEl.textContent = "Saving…";
  try {
    const result = await proxyCall({ action: "changePin", sheetId: CALENDAR_SHEET_ID, name: SESSION.name, currentPin: current, newPin });
    if (!result || !result.ok) {
      errEl.textContent = (result && result.error) || "Current PIN is incorrect.";
      btnEl.disabled = false; btnEl.textContent = "Update PIN";
      return;
    }
    closeChangePinModal();
    showToast("PIN updated ✓");
  } catch(e) {
    errEl.textContent = "Failed to update PIN: " + e.message;
    btnEl.disabled = false; btnEl.textContent = "Update PIN";
  }
}
