// ── PROXY HELPERS ──────────────────────────────────────────────────────────────
async function proxyCall(params) {
  const url        = PROXY_URL + "?" + new URLSearchParams(params).toString();
  const controller = new AbortController();
  const timer      = setTimeout(() => controller.abort(), 20000); // 20s timeout
  try {
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok) throw new Error("Proxy error: " + res.status);
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    return json.data;
  } catch(e) {
    clearTimeout(timer);
    if (e.name === "AbortError") throw new Error("Request timed out — Google Apps Script may be cold-starting. Please try again.");
    throw e;
  }
}
const readConfig = () => readSheet(CALENDAR_SHEET_ID, CONFIG_SHEET_NAME);
const readSheet  = (sheetId, sheetName) => proxyCall({ action: "getTasks", sheetId, sheetName });
const appendRow  = (sheetId, sheetName, values) => proxyCall({ action: "appendRow", sheetId, sheetName, values: JSON.stringify(values) });
const updateRow  = (sheetId, sheetName, rowIndex, values) => proxyCall({ action: "updateRow", sheetId, sheetName, rowIndex, values: JSON.stringify(values) });
const deleteRowProxy = (sheetId, sheetName, rowIndex) => proxyCall({ action: "deleteRow", sheetId, sheetName, rowIndex });

// ── UTILS ──────────────────────────────────────────────────────────────────────
function rowsToTasks(rows) {
  if (rows.length < 2) return [];
  return rows.slice(1).map((r, i) => ({
    rowIndex: i + 2,
    taskId: r[0]||"", assignedTo: r[1]||"", task: r[2]||"",
    dueDate: r[3]||"", priority: r[4]||"Medium",
    status: r[5]||"Not Started", notes: r[6]||"", url: r[7]||""
  }));
}
function normalizeUrl(url) {
  if (!url) return "";
  return /^https?:\/\//i.test(url) ? url : "https://" + url;
}
function notesCellHTML(notes, uid) {
  if (!notes) return "";
  const safe = notes.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  if (notes.length <= 120) return `<div style="word-break:break-word;overflow-wrap:anywhere;font-size:12px;color:#6b7280;">${safe}</div>`;
  const shortSafe = safe.slice(0, 120);
  const restSafe  = safe.slice(120);
  return `<div style="font-size:12px;color:#6b7280;word-break:break-word;overflow-wrap:anywhere;">
    <span id="ns-${uid}">${shortSafe}<span id="nr-${uid}" style="display:none;">${restSafe}</span>
      <button class="notes-toggle" id="nb-${uid}"
        onclick="(function(id){var r=document.getElementById('nr-'+id),b=document.getElementById('nb-'+id),e=r.style.display==='none';r.style.display=e?'inline':'none';b.textContent=e?'▴ less':'▾ more';}('${uid}'))">▾ more</button>
    </span>
  </div>`;
}
function parseDate(d) {
  if (!d) return null;
  if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(d)) {
    const [m,dy,y] = d.split("/");
    return new Date(+y, +m-1, +dy);
  }
  if (/^\d{4}-\d{2}-\d{2}T/.test(d)) {
    const dt = new Date(d);
    return isNaN(dt) ? null : new Date(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate());
  }
  if (/^\d{4}-\d{2}-\d{2}$/.test(d)) {
    const [y,m,dy] = d.split("-");
    return new Date(+y, +m-1, +dy);
  }
  return null;
}
function isOverdue(d) {
  const due = parseDate(d); if (!due) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return due < today;
}
function formatTimestamp(ts) {
  if (!ts) return "";
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  let dt;
  if (/^\d{4}-\d{2}-\d{2}T/.test(String(ts))) {
    dt = new Date(ts);
  } else {
    dt = new Date(ts);
    if (isNaN(dt)) return ts;
  }
  const d   = String(dt.getDate()).padStart(2,"0");
  const mon = MON[dt.getMonth()];
  const y   = dt.getFullYear();
  const h   = String(dt.getHours()).padStart(2,"0");
  const min = String(dt.getMinutes()).padStart(2,"0");
  return `${d}-${mon}-${y} ${h}:${min}`;
}
function formatDueDate(d) {
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const dt = parseDate(d); if (!dt) return d||"";
  return `${String(dt.getDate()).padStart(2,"0")}-${MON[dt.getMonth()]}-${dt.getFullYear()}`;
}
function dueDaysBadge(d, status) {
  if (!d || status === "Completed") return "";
  const dt = parseDate(d); if (!dt) return "";
  dt.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((dt - today) / 86400000);
  if (diff === 0) return `<div style="font-size:10px;font-weight:700;color:#f59e0b;margin-top:2px;">Due today</div>`;
  if (diff < 0)  return `<div style="font-size:10px;font-weight:700;color:#dc2626;margin-top:2px;">${diff} days</div>`;
  return `<div style="font-size:10px;font-weight:700;color:#16a34a;margin-top:2px;">+${diff} days</div>`;
}
function nextTaskId(tasks) {
  const nums = tasks.map(t => parseInt(t.taskId.replace("TSK-",""),10)).filter(n=>!isNaN(n));
  const max = nums.length ? Math.max(...nums) : 0;
  return "TSK-" + String(max+1).padStart(3,"0");
}

// ── LOCKOUT HELPERS (localStorage = primary, sheet = secondary/sync) ──────────
const LS_KEY = "tmgr_lockout";
function lsGetAll()               { try { return JSON.parse(localStorage.getItem(LS_KEY)||"{}"); } catch { return {}; } }
function lsSetUser(name, data)    { try { const a=lsGetAll(); a[name]=data; localStorage.setItem(LS_KEY,JSON.stringify(a)); } catch {} }
function lsClearUser(name)        { try { const a=lsGetAll(); delete a[name]; localStorage.setItem(LS_KEY,JSON.stringify(a)); } catch {} }

function rowsToAccountStatus(rows) {
  const out = {};
  if (rows.length < 2) return out;
  rows.slice(1).forEach((r, i) => {
    if (!r[0]) return;
    out[r[0]] = {
      rowIndex: i + 2,
      failed:   parseInt(r[1]) || 0,
      locked:   String(r[2]).toUpperCase() === "TRUE"
    };
  });
  return out;
}

async function loadLoginData() {
  try {
    const [configRows, statusRows] = await Promise.all([
      readConfig(),
      readSheet(CALENDAR_SHEET_ID, ACCOUNT_STATUS_SHEET_NAME).catch(() => [])
    ]);
    const data = configRows.slice(1).filter(r => r[0]);
    window._configRows = data;
    const sheetStatus  = rowsToAccountStatus(statusRows);
    const lsStatus     = lsGetAll();
    // Merge: locked in EITHER source → locked
    window._accountStatus = sheetStatus;
    Object.entries(lsStatus).forEach(([name, ls]) => {
      const s = window._accountStatus[name] || { rowIndex: null, failed: 0 };
      window._accountStatus[name] = {
        ...s,
        failed: Math.max(s.failed, ls.failed || 0),
        locked: s.locked || ls.locked || false
      };
    });
    const names = data.map(r => r[0]);
    document.getElementById("login-body").innerHTML = `
      <label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:6px;">Your Name</label>
      <select id="sel-name" style="width:100%;padding:10px 12px;border-radius:8px;margin-bottom:16px;border:1.5px solid #d1fae5;font-size:14px;color:#1b4332;background:#f0fdf4;outline:none;appearance:none;">
        <option value="">— Select your name —</option>
        ${names.map(n=>`<option value="${n}">${n}</option>`).join("")}
      </select>
      <label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:6px;">PIN</label>
      <input id="inp-pin" type="password" maxlength="4" placeholder="4-digit PIN"
        style="width:100%;padding:10px 12px;border-radius:8px;margin-bottom:20px;border:1.5px solid #d1fae5;font-size:18px;letter-spacing:8px;color:#1b4332;background:#f0fdf4;outline:none;"/>
      <div id="login-error"></div>
      <button id="btn-signin" onclick="doLogin()" style="width:100%;padding:12px;border-radius:10px;background:#1b4332;color:#fff;font-size:15px;font-weight:600;border:none;">Sign In</button>`;
    document.getElementById("inp-pin").addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });
  } catch(e) {
    document.getElementById("login-body").innerHTML = `<div style="background:#fee2e2;color:#991b1b;padding:12px;border-radius:8px;">Could not load config: ${e.message}</div>`;
  }
}

async function doLogin() {
  const name  = document.getElementById("sel-name").value;
  const pin   = document.getElementById("inp-pin").value;
  const errEl = document.getElementById("login-error");
  const btnEl = document.getElementById("btn-signin");

  if (!name) { errEl.innerHTML = errorBox("Please select your name."); return; }

  const acct = window._accountStatus[name];
  if (acct && acct.locked) {
    errEl.innerHTML = errorBox("Your account is locked after too many failed attempts. Please contact your manager.");
    if (btnEl) { btnEl.disabled = true; btnEl.style.opacity = "0.5"; }
    return;
  }

  const row = window._configRows.find(r => r[0] === name);
  if (!row || String(row[1]).trim() !== String(pin).trim()) {
    if (btnEl) { btnEl.disabled = true; btnEl.style.opacity = "0.5"; btnEl.textContent = "Checking…"; }
    const result = await incrementFailedAttempts(name);
    if (btnEl) { btnEl.disabled = false; btnEl.style.opacity = "1"; btnEl.textContent = "Sign In"; }

    if (result.locked) {
      errEl.innerHTML = errorBox("Account locked after 3 failed attempts. Please contact your manager.");
      if (btnEl) { btnEl.disabled = true; btnEl.style.opacity = "0.5"; }
    } else {
      const left = 3 - result.failed;
      errEl.innerHTML = errorBox(`Invalid PIN. ${left} attempt${left!==1?"s":""} remaining before lockout.`);
    }
    return;
  }

  const role = row[2];
  const parseTeams = v => (v||"").split(",").map(t=>t.trim()).filter(Boolean);
  if (role === "Manager") {
    const memberRows = window._configRows.filter(r => r[2] === "Member");
    const teams = [...new Set(window._configRows.flatMap(r => parseTeams(r[6])))];
    SESSION = { name, role, memberRows, teams };
  } else {
    SESSION = { name, role, teams: parseTeams(row[6]) };
  }
  resetAccountStatus(name);
  render();
  logLoginActivity();
}

async function incrementFailedAttempts(name) {
  const s         = window._accountStatus[name];
  const newFailed = (s ? s.failed : 0) + 1;
  const isLocked  = newFailed >= 3;

  // 1. Write to localStorage immediately (survives refresh, guaranteed)
  lsSetUser(name, { failed: newFailed, locked: isLocked });

  // 2. Update in-memory state
  window._accountStatus[name] = { ...(s||{ rowIndex: null }), failed: newFailed, locked: isLocked };

  // 3. Sync to sheet in background (for cross-device / Manager visibility)
  try {
    if (s && s.rowIndex) {
      await updateRow(CALENDAR_SHEET_ID, ACCOUNT_STATUS_SHEET_NAME, s.rowIndex, [name, String(newFailed), isLocked ? "TRUE" : "FALSE"]);
    } else {
      await appendRow(CALENDAR_SHEET_ID, ACCOUNT_STATUS_SHEET_NAME, [name, String(newFailed), isLocked ? "TRUE" : "FALSE"]);
      const rows = await readSheet(CALENDAR_SHEET_ID, ACCOUNT_STATUS_SHEET_NAME);
      window._accountStatus = rowsToAccountStatus(rows);
      lsSetUser(name, { failed: newFailed, locked: isLocked }); // re-apply after re-read
    }
  } catch { /* sheet sync failed — localStorage still holds the lock */ }

  return { failed: newFailed, locked: isLocked };
}

async function resetAccountStatus(name) {
  // 1. Clear localStorage immediately
  lsClearUser(name);

  // 2. Update in-memory
  if (window._accountStatus[name]) {
    window._accountStatus[name] = { ...window._accountStatus[name], failed: 0, locked: false };
  }

  // 3. Sync to sheet
  const s = window._accountStatus[name];
  try {
    if (s && s.rowIndex) {
      await updateRow(CALENDAR_SHEET_ID, ACCOUNT_STATUS_SHEET_NAME, s.rowIndex, [name, "0", "FALSE"]);
    } else {
      await appendRow(CALENDAR_SHEET_ID, ACCOUNT_STATUS_SHEET_NAME, [name, "0", "FALSE"]);
    }
  } catch { /* sheet sync failed — localStorage already cleared */ }
}

function _sGet(k)    { try { return JSON.parse(sessionStorage.getItem(k) || "null"); } catch { return null; } }
function _sSet(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch {} }
function _sDel(k)    { try { sessionStorage.removeItem(k); } catch {} }

const TASKS_TTL_MS = 60 * 60 * 1000; // 1 hour
function _tasksCacheKey() { return "tmgr_tasks_" + (SESSION ? SESSION.name : ""); }
function getCachedTasks() {
  try {
    const item = JSON.parse(localStorage.getItem(_tasksCacheKey()) || "null");
    if (!item) return null;
    if (Date.now() - item.ts > TASKS_TTL_MS) { localStorage.removeItem(_tasksCacheKey()); return null; }
    return item.data;
  } catch { return null; }
}
function setCachedTasks(tasks) {
  try { localStorage.setItem(_tasksCacheKey(), JSON.stringify({ ts: Date.now(), data: tasks })); } catch {}
}
function clearTasksCache() { try { localStorage.removeItem(_tasksCacheKey()); } catch {} }

const CAL_CACHE_KEY = "tmgr_cal";
const ACT_CACHE_KEY = "tmgr_act";

function renderMember() {

  if (_activeTab === "links")      { renderLinks();        return; }
  if (_activeTab === "events")     { renderTeamEvents();   return; }
  if (_activeTab === "directory")  { renderDirectory();    return; }
  document.getElementById("app").innerHTML = shellHTML("Member", SESSION.name, tabBarHTML() + `<div id="member-main"></div>`);
  if (_memberTasks.length > 0) {
    renderMemberTable();
    _bgRefreshMemberTasks();
  } else {
    const cached = getCachedTasks();
    if (cached) {
      _memberTasks = cached.filter(t => t.assignedTo === SESSION.name);
      renderMemberTable();
      _bgRefreshMemberTasks();
    } else {
      document.getElementById("member-main").innerHTML = `<div class="spinner"></div>`;
      loadMemberTasks();
    }
  }
}

async function loadMemberTasks() {
  const cached = getCachedTasks();
  if (cached) {
    _memberTasks = cached.filter(t => t.assignedTo === SESSION.name);
    _memberEditingTask = null;
    renderMemberTable();
  }
  try {
    const rows = await readSheet(CALENDAR_SHEET_ID, TASKS_SHEET_NAME);
    const all  = rowsToTasks(rows);
    setCachedTasks(all);
    const fresh = all.filter(t => t.assignedTo === SESSION.name);
    if (JSON.stringify(fresh) !== JSON.stringify(_memberTasks)) {
      _memberTasks = fresh;
      _memberEditingTask = null;
      renderMemberTable();
    }
  } catch(e) {
    if (!cached) document.getElementById("member-main").innerHTML = `<div style="background:#fee2e2;color:#991b1b;padding:16px 20px;border-radius:12px;margin:16px 0;">
      <div style="font-weight:600;margin-bottom:6px;">Failed to load tasks</div>
      <div style="font-size:12px;margin-bottom:12px;">${e.message}</div>
      <button onclick="loadMemberTasks()" style="background:#991b1b;color:#fff;font-size:12px;font-weight:600;padding:6px 14px;border-radius:7px;border:none;cursor:pointer;">Retry</button>
    </div>`;
  }
}

async function _bgRefreshMemberTasks() {
  try {
    const rows  = await readSheet(CALENDAR_SHEET_ID, TASKS_SHEET_NAME);
    const all   = rowsToTasks(rows);
    setCachedTasks(all);
    const fresh = all.filter(t => t.assignedTo === SESSION.name);
    if (JSON.stringify(fresh) !== JSON.stringify(_memberTasks)) {
      _memberTasks = fresh;
      renderMemberTable();
    }
  } catch {}
}

function renderMemberTable() {
  const tasks = _memberTasks;
  const total = tasks.length;
  const done  = tasks.filter(t => t.status === "Completed").length;
  const inProg = tasks.filter(t => t.status === "In Progress").length;

  const statsHTML = `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;">
      ${[["Total Tasks",total,"#1b4332"],["In Progress",inProg,"#1e40af"],["Completed",done,"#166534"]]
        .map(([l,v,c])=>`<div style="background:#fff;border-radius:12px;padding:1rem 1.25rem;border:1px solid #d1fae5;text-align:center;">
          <div style="font-size:28px;font-weight:700;color:${c};">${v}</div>
          <div style="font-size:12px;color:#6b7280;margin-top:2px;">${l}</div></div>`).join("")}
    </div>`;

  const addBtn = `<button onclick="openAddTaskModal()" style="padding:9px 18px;border-radius:8px;background:#1b4332;color:#fff;font-size:13px;font-weight:600;border:none;margin-bottom:16px;">+ Add Task</button>`;

  const bodyRows = tasks.length === 0
    ? `<tr><td colspan="7" style="text-align:center;padding:3rem;color:#9ca3af;">No tasks yet.</td></tr>`
    : tasks.map(t => {
        const ov = isOverdue(t.dueDate) && t.status !== "Completed";
        return `<tr style="background:${ov?"#fff1f2":"#fff"};border-bottom:1px solid #f0fdf4;">
          <td style="padding:10px 12px;color:#6b7280;white-space:nowrap;">${t.taskId}</td>
          <td style="padding:10px 12px;max-width:220px;">${t.task}</td>
          <td style="padding:10px 12px;white-space:nowrap;">
            <div style="color:${ov?"#dc2626":"#374151"};font-weight:${ov?600:400};font-size:12px;">${formatDueDate(t.dueDate)}</div>
            ${dueDaysBadge(t.dueDate, t.status)}
          </td>
          <td style="padding:10px 12px;">${priorityBadge(t.priority)}</td>
          <td style="padding:10px 12px;">${statusBadge(t.status)}</td>
          <td style="padding:10px 12px;max-width:220px;">${notesCellHTML(t.notes, t.rowIndex)}</td>
          <td style="padding:10px 12px;white-space:nowrap;">
            ${t.url ? `<a href="${normalizeUrl(t.url)}" target="_blank" rel="noopener" style="font-size:11px;font-weight:600;color:#1b4332;background:#f0fdf4;border:1px solid #d1fae5;padding:3px 9px;border-radius:5px;text-decoration:none;">🔗 Open</a>` : `<span style="color:#e5e7eb;font-size:11px;">—</span>`}
          </td>
          <td style="padding:10px 12px;white-space:nowrap;">
            <button onclick="openEditTaskModal(${t.rowIndex})" style="background:#f0fdf4;color:#1b4332;font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;border:none;">Edit</button>
            <button onclick="memberDeleteTask(${t.rowIndex})" style="background:#fff1f2;color:#dc2626;font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;border:none;margin-left:6px;">Delete</button>
          </td></tr>`;
      }).join("");

  document.getElementById("member-main").innerHTML = statsHTML + addBtn + `
    <div style="overflow-x:auto;">
      <table style="font-size:13px;">
        <thead><tr style="background:#f0fdf4;">
          ${["Task ID","Task","Due Date","Priority","Status","Notes","URL","Actions"].map(h=>`<th style="padding:10px 12px;font-weight:600;color:#1b4332;border-bottom:2px solid #d1fae5;white-space:nowrap;">${h}</th>`).join("")}
        </tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>`;
}


async function memberDeleteTask(rowIndex) {
  const t = _memberTasks.find(t => t.rowIndex === rowIndex);
  if (!t || !confirm(`Delete "${t.task}"?`)) return;
  try {
    await deleteRowProxy(CALENDAR_SHEET_ID, TASKS_SHEET_NAME, rowIndex);
    await loadMemberTasks();
    showToast("Deleted");
  } catch(e) { alert("Delete failed: " + e.message); }
}

async function memberAddTask() {
  const task     = document.getElementById("at-task").value.trim();
  const dueDate  = document.getElementById("at-dueDate").value;
  const priority = document.getElementById("at-priority").value;
  const status   = document.getElementById("at-status").value;
  const notes    = document.getElementById("at-notes").value;
  const url      = document.getElementById("at-url").value.trim();
  if (!task) { document.getElementById("at-error").textContent = "Task description is required."; return; }
  try {
    const allRows = await readSheet(CALENDAR_SHEET_ID, TASKS_SHEET_NAME);
    const taskId  = nextTaskId(rowsToTasks(allRows));
    await appendRow(CALENDAR_SHEET_ID, TASKS_SHEET_NAME, [taskId, SESSION.name, task, dueDate, priority, status, notes, url]);
    closeAddTaskModal();
    await loadMemberTasks();
    showToast("Task added ✓");
  } catch(e) { alert("Failed to add task: " + e.message); }
}

// ── MANAGER VIEW ───────────────────────────────────────────────────────────────
let _allTasks = [];
let _filterMember = "All";
let _editingTask = null;
let _addTaskMembers = new Set();
let _selectedTaskRows = new Set();

function renderManager() {
  if (_activeTab === "calendar")   { renderCalendar();     return; }
  if (_activeTab === "activity")   { renderActivity();     return; }
  if (_activeTab === "links")      { renderLinks();        return; }
  if (_activeTab === "events")     { renderTeamEvents();   return; }
  if (_activeTab === "directory")  { renderDirectory();    return; }
  document.getElementById("app").innerHTML = shellHTML("Manager", SESSION.name, tabBarHTML() + `<div id="manager-main"></div>`);
  if (_allTasks.length > 0) {
    renderManagerTable();
    _bgRefreshAllTasks();
  } else {
    const cached = getCachedTasks();
    if (cached) {
      _allTasks = cached;
      _filterMember = "All";
      renderManagerTable();
      _bgRefreshAllTasks();
    } else {
      document.getElementById("manager-main").innerHTML = `<div class="spinner"></div>`;
      loadAllTasks();
    }
  }
}

async function loadAllTasks() {
  const cached = getCachedTasks();
  if (cached) {
    _allTasks = cached;
    _filterMember = "All";
    _editingTask = null;
    renderManagerTable();
  }
  try {
    const rows  = await readSheet(CALENDAR_SHEET_ID, TASKS_SHEET_NAME);
    const fresh = rowsToTasks(rows);
    setCachedTasks(fresh);
    if (JSON.stringify(fresh) !== JSON.stringify(_allTasks)) {
      _allTasks = fresh;
      _filterMember = "All";
      _editingTask = null;
      renderManagerTable();
    }
  } catch(e) {
    if (!cached) document.getElementById("manager-main").innerHTML = `<div style="background:#fee2e2;color:#991b1b;padding:16px 20px;border-radius:12px;margin:16px 0;">
      <div style="font-weight:600;margin-bottom:6px;">Failed to load tasks</div>
      <div style="font-size:12px;margin-bottom:12px;">${e.message}</div>
      <button onclick="loadAllTasks()" style="background:#991b1b;color:#fff;font-size:12px;font-weight:600;padding:6px 14px;border-radius:7px;border:none;cursor:pointer;">Retry</button>
    </div>`;
  }
}

async function _bgRefreshAllTasks() {
  try {
    const rows  = await readSheet(CALENDAR_SHEET_ID, TASKS_SHEET_NAME);
    const fresh = rowsToTasks(rows);
    setCachedTasks(fresh);
    if (JSON.stringify(fresh) !== JSON.stringify(_allTasks)) {
      _allTasks = fresh;
      _selectedTaskRows.clear();
      renderManagerTable();
    }
  } catch {}
}

function renderManagerTable(showAddForm) {
  const memberNames = SESSION.memberRows.map(r => r[0]);
  const filtered = _filterMember === "All" ? _allTasks : _allTasks.filter(t => t.assignedTo === _filterMember);

  const filterBtns = memberNames.map(n => {
    const active = _filterMember === n;
    const count = _allTasks.filter(t => t.assignedTo === n).length;
    return `<button onclick="setFilter('${n}')"
      style="padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;
      border:${active?"2px solid #1b4332":"1.5px solid #d1fae5"};
      background:${active?"#1b4332":"#f0fdf4"};
      color:${active?"#fff":"#1b4332"};">${n.split(" ")[0]} (${count})</button>`;
  }).join("");
  const clearBtn = _filterMember !== "All"
    ? `<button onclick="setFilter('All')" style="padding:6px 14px;border-radius:999px;font-size:12px;border:1.5px solid #fca5a5;background:#fff1f2;color:#991b1b;font-weight:600;">✕ Clear filter</button>`
    : "";

  const deleteSelBtn = _selectedTaskRows.size > 0
    ? `<button onclick="deleteSelectedTasks()" style="padding:9px 18px;border-radius:8px;background:#dc2626;color:#fff;font-size:13px;font-weight:600;border:none;margin-bottom:20px;margin-left:8px;">Delete Selected (${_selectedTaskRows.size})</button>`
    : "";
  const addBtn = `<div style="display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;">
    <button onclick="openAddTaskModal()" style="padding:9px 18px;border-radius:8px;background:#1b4332;color:#fff;font-size:13px;font-weight:600;border:none;">+ Add Task</button>
    ${deleteSelBtn}
  </div>`;

  const IS = "font-size:13px;padding:6px 10px;border-radius:6px;border:1.5px solid #d1fae5;width:100%;";
  const allChecked = filtered.length > 0 && filtered.every(t => _selectedTaskRows.has(t.rowIndex));
  const bodyRows = filtered.length === 0
    ? `<tr><td colspan="10" style="text-align:center;padding:3rem;color:#9ca3af;">No tasks found.</td></tr>`
    : filtered.map(t => {
        const ov      = isOverdue(t.dueDate) && t.status !== "Completed";
        const checked = _selectedTaskRows.has(t.rowIndex);
        const ri      = t.rowIndex;
        return `<tr style="background:${checked?"#f0fdf4":ov?"#fff1f2":"#fff"};border-bottom:1px solid #f0fdf4;">
          <td style="padding:10px 12px;text-align:center;">
            <input type="checkbox" ${checked?"checked":""} onchange="toggleTaskSelect(${ri})" style="width:15px;height:15px;cursor:pointer;accent-color:#1b4332;"/>
          </td>
          <td style="padding:10px 12px;color:#6b7280;white-space:nowrap;">${t.taskId}</td>
          <td style="padding:10px 12px;white-space:nowrap;font-weight:500;color:#1b4332;">${t.assignedTo.split(" ")[0]}</td>
          <td style="padding:10px 12px;max-width:200px;">${t.task}</td>
          <td style="padding:10px 12px;white-space:nowrap;">
            <div style="color:${ov?"#dc2626":"#374151"};font-weight:${ov?600:400};font-size:12px;">${formatDueDate(t.dueDate)}</div>
            ${dueDaysBadge(t.dueDate, t.status)}
          </td>
          <td style="padding:10px 12px;">${priorityBadge(t.priority)}</td>
          <td style="padding:10px 12px;">${statusBadge(t.status)}</td>
          <td style="padding:10px 12px;max-width:220px;">${notesCellHTML(t.notes, t.rowIndex)}</td>
          <td style="padding:10px 12px;white-space:nowrap;">
            ${t.url ? `<a href="${normalizeUrl(t.url)}" target="_blank" rel="noopener" style="font-size:11px;font-weight:600;color:#1b4332;background:#f0fdf4;border:1px solid #d1fae5;padding:3px 9px;border-radius:5px;text-decoration:none;">🔗 Open</a>` : `<span style="color:#e5e7eb;font-size:11px;">—</span>`}
          </td>
          <td style="padding:10px 12px;white-space:nowrap;">
            <button onclick="openEditTaskModal(${ri})" style="background:#f0fdf4;color:#1b4332;font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;border:none;">Edit</button>
            <button onclick="doDelete(${ri})" style="background:#fff1f2;color:#dc2626;font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;border:none;margin-left:6px;">Delete</button>
          </td></tr>`;
      }).join("");

  document.getElementById("manager-main").innerHTML = `
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">${filterBtns}${clearBtn}</div>
    <div>${addBtn}</div>
    <div style="overflow-x:auto;">
      <table style="font-size:13px;">
        <thead><tr style="background:#f0fdf4;">
          <th style="padding:10px 12px;border-bottom:2px solid #d1fae5;text-align:center;">
            <input type="checkbox" ${allChecked?"checked":""} onchange="toggleSelectAll()" style="width:15px;height:15px;cursor:pointer;accent-color:#1b4332;" title="Select all"/>
          </th>
          ${["Task ID","Assigned To","Task","Due Date","Priority","Status","Notes","URL","Actions"]
            .map(h=>`<th style="padding:10px 12px;font-weight:600;color:#1b4332;border-bottom:2px solid #d1fae5;white-space:nowrap;">${h}</th>`).join("")}
        </tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>`;
}

function setFilter(name) {
  _filterMember = name;
  _selectedTaskRows.clear();
  renderManagerTable();
}

function toggleTaskSelect(rowIndex) {
  if (_selectedTaskRows.has(rowIndex)) _selectedTaskRows.delete(rowIndex);
  else _selectedTaskRows.add(rowIndex);
  renderManagerTable();
}

function toggleSelectAll() {
  const filtered = _filterMember === "All" ? _allTasks : _allTasks.filter(t => t.assignedTo === _filterMember);
  const allChecked = filtered.every(t => _selectedTaskRows.has(t.rowIndex));
  if (allChecked) filtered.forEach(t => _selectedTaskRows.delete(t.rowIndex));
  else filtered.forEach(t => _selectedTaskRows.add(t.rowIndex));
  renderManagerTable();
}

async function deleteSelectedTasks() {
  const rows = [..._selectedTaskRows].sort((a, b) => b - a);
  if (!rows.length) return;
  const names = rows.map(ri => _allTasks.find(t => t.rowIndex === ri)?.task).filter(Boolean);
  if (!confirm(`Delete ${rows.length} task${rows.length > 1 ? "s" : ""}?\n\n${names.slice(0,5).join("\n")}${names.length > 5 ? `\n…and ${names.length-5} more` : ""}`)) return;
  try {
    for (const rowIndex of rows) {
      await deleteRowProxy(CALENDAR_SHEET_ID, TASKS_SHEET_NAME, rowIndex);
    }
    _selectedTaskRows.clear();
    await reloadAllTasks();
    showToast(`${rows.length} task${rows.length > 1 ? "s" : ""} deleted`);
  } catch(e) { alert("Delete failed: " + e.message); }
}

function toggleAddTaskMember(name) {
  if (_addTaskMembers.has(name)) _addTaskMembers.delete(name);
  else _addTaskMembers.add(name);
  renderAddTaskModal();
}

function toggleAllMembers() {
  const memberNames = SESSION.memberRows.map(r => r[0]);
  if (memberNames.every(n => _addTaskMembers.has(n))) _addTaskMembers.clear();
  else memberNames.forEach(n => _addTaskMembers.add(n));
  renderAddTaskModal();
}

async function reloadAllTasks() {
  const rows = await readSheet(CALENDAR_SHEET_ID, TASKS_SHEET_NAME);
  _allTasks = rowsToTasks(rows);
  setCachedTasks(_allTasks);
  _selectedTaskRows.clear();
  renderManagerTable();
}

async function doDelete(rowIndex) {
  const t = _allTasks.find(t => t.rowIndex === rowIndex);
  if (!t || !confirm(`Delete task "${t.task}"?`)) return;
  try {
    await deleteRowProxy(CALENDAR_SHEET_ID, TASKS_SHEET_NAME, rowIndex);
    await reloadAllTasks();
  } catch(e) { alert("Delete failed: " + e.message); }
}

async function doAddTask() {
  const selected = [..._addTaskMembers];
  const task     = document.getElementById("at-task").value.trim();
  const dueDate  = document.getElementById("at-dueDate").value;
  const priority = document.getElementById("at-priority").value;
  const status   = document.getElementById("at-status").value;
  const notes    = document.getElementById("at-notes").value;
  const url      = document.getElementById("at-url").value.trim();
  if (!selected.length) { document.getElementById("at-error").textContent = "Please select at least one team member."; return; }
  if (!task) { document.getElementById("at-error").textContent = "Task description is required."; return; }
  try {
    let base = _allTasks.slice();
    for (const name of selected) {
      const taskId = nextTaskId(base);
      await appendRow(CALENDAR_SHEET_ID, TASKS_SHEET_NAME, [taskId, name, task, dueDate, priority, status, notes, url]);
      base.push({ taskId });
    }
    closeAddTaskModal();
    await reloadAllTasks();
    showToast(`Task added for ${selected.length} member${selected.length > 1 ? "s" : ""} ✓`);
  } catch(e) { alert("Failed to add task: " + e.message); }
}

// ── EDIT TASK MODAL ────────────────────────────────────────────────────────────

  const isManager = SESSION.role === "Manager";
  const task = isManager
    ? _allTasks.find(t => t.rowIndex === rowIndex)

  _editTaskModal = { ...task };
  renderEditTaskModal();
}

}

async function doSaveEditModal() {
  const t          = _editTaskModal;
  const assignedTo = document.getElementById("et-assignedTo").value;
  const task       = document.getElementById("et-task").value.trim();
  const dueDate    = document.getElementById("et-dueDate").value;
  const priority   = document.getElementById("et-priority").value;
  const status     = document.getElementById("et-status").value;
  const notes      = document.getElementById("et-notes").value;
  const url        = document.getElementById("et-url").value.trim();

function tabBarHTML() {
  const tabs = [["tasks","Tasks"],["calendar","Absence Calendar"],["links","Links"]];
  if (SESSION.role === "Manager" || (SESSION.teams||[]).length > 0) tabs.push(["events","Business Calendar"]);
  tabs.push(["directory","Directory"]);
  if (SESSION.role === "Manager") tabs.push(["activity","Activity"]);
  return `<div style="display:flex;gap:4px;margin-bottom:24px;background:#fff;border-radius:10px;padding:4px;border:1px solid #d1fae5;width:fit-content;">` +
    tabs.map(([id,label]) => {
      const a = _activeTab === id;
      return `<button onclick="switchTab('${id}')" style="padding:7px 22px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;background:${a?"#1b4332":"transparent"};color:${a?"#fff":"#6b7280"};">${label}</button>`;
    }).join("") + `</div>`;
}

function switchTab(tab) {
  _activeTab = tab;
  if (tab === "calendar") _calView = "month";
  if (tab === "events")   _teamCalView = "month";
  render();
}

function normDate(d) {
  if (!d) return "";
  if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
  const m = String(d).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return `${m[3]}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`;
  const dt = new Date(d);
  if (!isNaN(dt)) return dt.toISOString().slice(0, 10);
  return d;
}

function rowsToEvents(rows) {
  if (rows.length < 2) return [];
  return rows.slice(1).map((r, i) => ({
    rowIndex:   i + 2,
    eventId:    r[0] || "",
    memberName: r[1] || "",
    notes:      r[2] || "",
    startDate:  normDate(r[3]),
    endDate:    normDate(r[4])
  })).filter(e => e.startDate && e.endDate);
}

function nextEventId(events) {
  const nums = events.map(e => parseInt((e.eventId||"").replace("VAC-",""), 10)).filter(n => !isNaN(n));
  return "VAC-" + String((nums.length ? Math.max(...nums) : 0) + 1).padStart(3, "0");
}

function teamColor(t) {
  if (!t || t === "All") return { bg:"#f1f5f9", color:"#475569", border:"#e2e8f0" };
  const palette = ["#dbeafe|#1e40af|#bfdbfe","#dcfce7|#166534|#bbf7d0","#fef9c3|#854d0e|#fde68a",
                   "#fce7f3|#9d174d|#fbcfe8","#ede9fe|#6d28d9|#ddd6fe"];
  let h = 0; for (const c of t) h = ((h<<5)-h+c.charCodeAt(0))|0;
  const [bg,color,border] = palette[Math.abs(h)%palette.length].split("|");
  return { bg, color, border };
}
function memberColor(name) {
  const palette = ["#3b82f6","#f59e0b","#ef4444","#8b5cf6","#06b6d4","#ec4899","#10b981","#f97316"];
  let h = 0;
  for (const c of (name || "")) h = ((h << 5) - h + c.charCodeAt(0)) | 0;
  return palette[Math.abs(h) % palette.length];
}

function renderCalendar() {
  const role = SESSION.role;
  document.getElementById("app").innerHTML = shellHTML(role, SESSION.name, tabBarHTML() + `<div id="cal-main"></div>`);
  if (_calLoaded) {
    _calView === "year" ? renderYearView() : renderCalendarGrid();
    _bgRefreshCal();
  } else {
    document.getElementById("cal-main").innerHTML = `<div class="spinner"></div>`;
    loadCalendarEvents();
  }
}

async function loadCalendarEvents() {
  const cached = _sGet(CAL_CACHE_KEY);
  if (cached) {
    _calEvents = cached;
    _calLoaded = true;
    _calView === "year" ? renderYearView() : renderCalendarGrid();
  }
  try {
    const rows  = await readSheet(CALENDAR_SHEET_ID, CALENDAR_SHEET_NAME);
    const fresh = rowsToEvents(rows);
    _sSet(CAL_CACHE_KEY, fresh);
    if (JSON.stringify(fresh) !== JSON.stringify(_calEvents)) {
      _calEvents = fresh;
      _calView === "year" ? renderYearView() : renderCalendarGrid();
    }
    _calLoaded = true;
  } catch(e) {
    if (!cached) {
      const el = document.getElementById("cal-main");
      if (el) el.innerHTML = `<div style="color:#dc2626;padding:16px;">Failed to load calendar: ${e.message}</div>`;
    }
  }
}

async function reloadCalendarEvents() {
  const rows  = await readSheet(CALENDAR_SHEET_ID, CALENDAR_SHEET_NAME);
  _calEvents  = rowsToEvents(rows);
  _sSet(CAL_CACHE_KEY, _calEvents);
  _calLoaded  = true;
  _calView === "year" ? renderYearView() : renderCalendarGrid();
}

async function _bgRefreshCal() {
  try {
    const rows  = await readSheet(CALENDAR_SHEET_ID, CALENDAR_SHEET_NAME);
    const fresh = rowsToEvents(rows);
    _sSet(CAL_CACHE_KEY, fresh);
    if (JSON.stringify(fresh) !== JSON.stringify(_calEvents)) {
      _calEvents = fresh;
      _calView === "year" ? renderYearView() : renderCalendarGrid();
    }
  } catch {}
}

function renderCalendarGrid() {
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DAYS   = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const year = _calYear, month = _calMonth;
  const firstDay    = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const td = new Date();
  const todayStr  = `${td.getFullYear()}-${String(td.getMonth()+1).padStart(2,"0")}-${String(td.getDate()).padStart(2,"0")}`;
  const mStart    = `${year}-${String(month+1).padStart(2,"0")}-01`;
  const mEnd      = `${year}-${String(month+1).padStart(2,"0")}-${String(daysInMonth).padStart(2,"0")}`;
  const monthEvts = _calEvents.filter(e => e.endDate >= mStart && e.startDate <= mEnd);

  const cells = Array(firstDay).fill(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const dayHeaders = DAYS.map(d =>
    `<div style="text-align:center;font-size:10px;font-weight:700;color:#9ca3af;padding:5px 2px;letter-spacing:0.4px;">${d}</div>`
  ).join("");

  const rowsHTML = [];
  for (let r = 0; r < cells.length; r += 7) {
    const rowCells = cells.slice(r, r+7).map(day => {
      if (!day) return `<div style="min-height:68px;background:#fafafa;border-right:1px solid #f3f4f6;"></div>`;
      const ds = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      const isToday = ds === todayStr;
      const dayEvts = monthEvts.filter(e => e.startDate <= ds && e.endDate >= ds);
      const chips = dayEvts.map(e => {
        const bg    = memberColor(e.memberName);
        const first = e.memberName.split(" ")[0];
        const label = e.notes ? `${first} · ${e.notes}` : first;
        return `<div onclick="event.stopPropagation();openCalEditModal(${e.rowIndex})"
          title="${e.memberName}: ${formatDueDate(e.startDate)} – ${formatDueDate(e.endDate)}${e.notes ? ' | '+e.notes : ''}"
          style="background:${bg};color:#fff;font-size:9px;font-weight:600;padding:1px 4px;border-radius:3px;margin-top:2px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${label}</div>`;
      }).join("");
      const bgNorm = isToday ? "#f0fdf4" : "#fff";
      const bgHov  = isToday ? "#d1fae5" : "#f9fafb";
      return `<div onclick="openCalAddModal('${ds}')"
        style="min-height:68px;padding:3px 4px;border-right:1px solid #f3f4f6;background:${bgNorm};cursor:pointer;"
        onmouseover="this.style.background='${bgHov}'" onmouseout="this.style.background='${bgNorm}'">
        <div style="font-size:11px;font-weight:${isToday?700:500};width:19px;height:19px;display:flex;align-items:center;justify-content:center;border-radius:50%;${isToday?"background:#1b4332;color:#fff;":"color:#374151;"}">${day}</div>
        ${chips}
      </div>`;
    }).join("");
    rowsHTML.push(`<div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid #f3f4f6;">${rowCells}</div>`);
  }

  const allNames = _calEvents.length
    ? [...new Set(_calEvents.map(e => e.memberName))].filter(Boolean)
    : (SESSION.role === "Manager" ? [SESSION.name, ...SESSION.memberRows.map(r => r[0])] : [SESSION.name]);
  const legendItems = allNames.map(n =>
    `<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#6b7280;white-space:nowrap;">
      <div style="width:7px;height:7px;border-radius:50%;background:${memberColor(n)};flex-shrink:0;"></div>${n.split(" ")[0]}
    </div>`
  ).join("");

  const el = document.getElementById("cal-main");
  if (el) el.innerHTML = `
    <div style="overflow-x:auto;">
    <div style="background:#fff;border-radius:16px;border:1px solid #d1fae5;overflow:hidden;min-width:560px;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #d1fae5;gap:6px;">
        <button onclick="calPrevMonth()" style="background:#f0fdf4;border:none;color:#1b4332;border-radius:8px;padding:4px 12px;font-size:18px;font-weight:700;cursor:pointer;line-height:1;flex-shrink:0;">&#8249;</button>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;flex:1;">
          <span style="font-size:15px;font-weight:700;color:#1b4332;">${MONTHS[month]} ${year}</span>
          ${calViewToggleHTML()}
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">${legendItems}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
          <button onclick="openCalAddModal(null)" style="background:#1b4332;color:#fff;font-size:11px;font-weight:600;padding:5px 10px;border-radius:8px;border:none;cursor:pointer;">+ Add</button>
          <button onclick="calNextMonth()" style="background:#f0fdf4;border:none;color:#1b4332;border-radius:8px;padding:4px 12px;font-size:18px;font-weight:700;cursor:pointer;line-height:1;">&#8250;</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);background:#f9fafb;border-bottom:1px solid #f3f4f6;">${dayHeaders}</div>
      ${rowsHTML.join("")}
    </div>
    </div>`;
}

function calPrevMonth() {
  if (_calMonth === 0) { _calMonth = 11; _calYear--; } else _calMonth--;
  renderCalendarGrid();
}
function calNextMonth() {
  if (_calMonth === 11) { _calMonth = 0; _calYear++; } else _calMonth++;
  renderCalendarGrid();
}
function calPrevYear() { _calYear--; renderYearView(); }
function calNextYear() { _calYear++; renderYearView(); }

function setCalView(view) {
  _calView = view;
  view === "year" ? renderYearView() : renderCalendarGrid();
}

function switchToMonth(monthIndex) {
  _calMonth = monthIndex;
  setCalView("month");
}

function calViewToggleHTML() {
  return `<div style="display:flex;background:#f0fdf4;border-radius:7px;padding:2px;border:1px solid #d1fae5;">
    <button onclick="setCalView('month')" style="padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;border:none;cursor:pointer;background:${_calView==='month'?'#1b4332':'transparent'};color:${_calView==='month'?'#fff':'#6b7280'};">Month</button>
    <button onclick="setCalView('year')"  style="padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;border:none;cursor:pointer;background:${_calView==='year'?'#1b4332':'transparent'};color:${_calView==='year'?'#fff':'#6b7280'};">Year</button>
  </div>`;
}

function renderYearView() {
  const MONTHS  = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DAYS    = ["S","M","T","W","T","F","S"];
  const year    = _calYear;
  const td      = new Date();
  const todayStr = `${td.getFullYear()}-${String(td.getMonth()+1).padStart(2,"0")}-${String(td.getDate()).padStart(2,"0")}`;
  const yStart  = `${year}-01-01`, yEnd = `${year}-12-31`;
  const yEvts   = _calEvents.filter(e => e.endDate >= yStart && e.startDate <= yEnd);

  const allNames = yEvts.length
    ? [...new Set(yEvts.map(e => e.memberName))].filter(Boolean)
    : (SESSION.role === "Manager" ? [SESSION.name, ...SESSION.memberRows.map(r => r[0])] : [SESSION.name]);
  const legendItems = allNames.map(n =>
    `<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#6b7280;white-space:nowrap;">
      <div style="width:7px;height:7px;border-radius:50%;background:${memberColor(n)};flex-shrink:0;"></div>${n.split(" ")[0]}
    </div>`
  ).join("");

  const miniMonths = MONTHS.map((mName, mi) => {
    const mn       = mi + 1;
    const dim      = new Date(year, mn, 0).getDate();
    const fd       = new Date(year, mi, 1).getDay();
    const mStart   = `${year}-${String(mn).padStart(2,"0")}-01`;
    const mEnd     = `${year}-${String(mn).padStart(2,"0")}-${String(dim).padStart(2,"0")}`;
    const mEvts    = yEvts.filter(e => e.endDate >= mStart && e.startDate <= mEnd);

    const cells = Array(fd).fill(null);
    for (let d = 1; d <= dim; d++) cells.push(d);
    while (cells.length % 7 !== 0) cells.push(null);

    const hdr = DAYS.map(d => `<div style="text-align:center;font-size:7px;font-weight:700;color:#9ca3af;">${d}</div>`).join("");

    let gridRows = "";
    for (let r = 0; r < cells.length; r += 7) {
      const rowCells = cells.slice(r, r+7).map(day => {
        if (!day) return `<div style="height:18px;"></div>`;
        const ds      = `${year}-${String(mn).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
        const isToday = ds === todayStr;
        const dayEvts = mEvts.filter(e => e.startDate <= ds && e.endDate >= ds);
        const hasPTO  = dayEvts.length > 0;

        let cellBg = "transparent", numColor = "#374151", numBg = "transparent";
        if (isToday)     { numBg = "#1b4332"; numColor = "#fff"; }
        else if (hasPTO) { cellBg = memberColor(dayEvts[0].memberName) + "28"; numColor = "#111"; }

        const dots = hasPTO
          ? `<div style="display:flex;gap:1px;justify-content:center;">${
              dayEvts.slice(0,3).map(e => `<div style="width:3px;height:3px;border-radius:50%;background:${memberColor(e.memberName)};"></div>`).join("")
            }</div>`
          : "";

        const tip = hasPTO ? ` title="${dayEvts.map(e=>e.memberName.split(' ')[0]).join(', ')}"` : "";
        return `<div${tip} style="height:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:${cellBg};border-radius:2px;">
          <div style="font-size:8px;font-weight:${isToday?700:400};color:${numColor};background:${numBg};border-radius:50%;width:13px;height:13px;display:flex;align-items:center;justify-content:center;">${day}</div>
          ${dots}
        </div>`;
      }).join("");

function closeCalModal() {
  _calModal = null;
  const el = document.getElementById("cal-modal");
  if (el) el.remove();
}

function calStartDateChanged() {
  const s = document.getElementById("cm-start").value;
  const eEl = document.getElementById("cm-end");
  if (!eEl.value || eEl.value < s) eEl.value = s;
}

function hasDateOverlap(memberName, startDate, endDate, excludeRowIndex) {
  return _calEvents.find(e =>
    e.memberName === memberName &&
    (excludeRowIndex === null || e.rowIndex !== excludeRowIndex) &&
    e.startDate <= endDate && e.endDate >= startDate
  );
}

function calModalError(msg) {
  const el = document.getElementById("cm-error");
  if (!el) return;
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
}

async function doSaveCalEvent() {
  const memberName = document.getElementById("cm-member").value;
  const startDate  = document.getElementById("cm-start").value;
  const endDate    = document.getElementById("cm-end").value;
  const notes      = document.getElementById("cm-notes").value;
  const m = _calModal;

  calModalError("");
  if (!memberName || !startDate || !endDate) { calModalError("Member and dates are required."); return; }
  if (endDate < startDate) { calModalError("End date cannot be before start date."); return; }

  const excludeRow = m.mode === "edit" ? m.rowIndex : null;
  const conflict = hasDateOverlap(memberName, startDate, endDate, excludeRow);
  if (conflict) {
    const who = conflict.memberName.split(" ")[0];
    calModalError(`${who} already has vacation from ${conflict.startDate} to ${conflict.endDate} that overlaps with these dates.`);
    return;
  }

  try {
    if (m.mode === "add") {
      await appendRow(CALENDAR_SHEET_ID, CALENDAR_SHEET_NAME, [nextEventId(_calEvents), memberName, notes, startDate, endDate]);
    } else {
      await updateRow(CALENDAR_SHEET_ID, CALENDAR_SHEET_NAME, m.rowIndex, [m.eventId, memberName, notes, startDate, endDate]);
    }
    closeCalModal();
    await reloadCalendarEvents();
    showToast("Saved ✓");
  } catch(e) { alert("Save failed: " + e.message); }
}

async function doDeleteCalEvent(rowIndex) {
  if (!confirm("Delete this vacation?")) return;
  try {
    await deleteRowProxy(CALENDAR_SHEET_ID, CALENDAR_SHEET_NAME, rowIndex);
    closeCalModal();
    await reloadCalendarEvents();
    showToast("Deleted");
  } catch(e) { alert("Delete failed: " + e.message); }
}

async function logLoginActivity() {

    const ts  = `${now.toLocaleDateString("en-US")} ${now.toLocaleTimeString("en-US", {hour:"2-digit",minute:"2-digit",second:"2-digit"})}`;
    let ip = "";
    try {
      const r = await fetch("https://api.ipify.org?format=json");
      ip = (await r.json()).ip || "";
    } catch { ip = "Unknown"; }
    await appendRow(CALENDAR_SHEET_ID, LOGIN_LOG_SHEET_NAME, [ts, SESSION.name, SESSION.role, ip]);
  } catch { /* silent — don't block login flow */ }
}

async function loadActivityLog() {
  const cached = _sGet(ACT_CACHE_KEY);
  if (cached) {
    _actLoaded = true;
    renderActivityTable(cached);
  }
  try {
    const [logRows, statusRows] = await Promise.all([
      readSheet(CALENDAR_SHEET_ID, LOGIN_LOG_SHEET_NAME).catch(() => []),
      readSheet(CALENDAR_SHEET_ID, ACCOUNT_STATUS_SHEET_NAME).catch(() => [])
    ]);
    window._accountStatus = rowsToAccountStatus(statusRows);
    _sSet(ACT_CACHE_KEY, logRows);
    if (JSON.stringify(logRows) !== JSON.stringify(cached)) {
      renderActivityTable(logRows);
    }
    _actLoaded = true;
  } catch(e) {
    if (!cached) {
      const el = document.getElementById("activity-main");
      if (el) el.innerHTML = `<div style="color:#dc2626;padding:16px;">Failed to load activity: ${e.message}</div>`;
    }
  }
}

async function _bgRefreshActivity() {
  try {
    const [logRows, statusRows] = await Promise.all([
      readSheet(CALENDAR_SHEET_ID, LOGIN_LOG_SHEET_NAME).catch(() => []),
      readSheet(CALENDAR_SHEET_ID, ACCOUNT_STATUS_SHEET_NAME).catch(() => [])
    ]);
    window._accountStatus = rowsToAccountStatus(statusRows);
    const prev = _sGet(ACT_CACHE_KEY);

function roleBadge(role) {
  const s = role === "Manager" ? "background:#dbeafe;color:#1e40af" : "background:#dcfce7;color:#166534";
  return `<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;${s}">${role}</span>`;
}

async function purgeActivityLog() {
  const daysEl  = document.getElementById("purge-days");
  const statusEl = document.getElementById("purge-status");
  const days    = parseInt(daysEl?.value);
  if (!days || days < 1) { if (statusEl) statusEl.textContent = "Enter a valid number of days."; return; }
  if (!confirm(`Permanently delete all login records older than ${days} day${days!==1?"s":""}?`)) return;

  if (statusEl) statusEl.textContent = "Working…";
  try {
    const rows = await readSheet(CALENDAR_SHEET_ID, LOGIN_LOG_SHEET_NAME);
    if (rows.length < 2) { if (statusEl) statusEl.textContent = "No records to purge."; return; }

    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - days);
    cutoff.setHours(0, 0, 0, 0);

    const toDelete = [];
    rows.slice(1).forEach((r, i) => {
      const dt = r[0] ? new Date(r[0]) : null;
      if (dt && !isNaN(dt) && dt < cutoff) toDelete.push(i + 2);
    });

    if (!toDelete.length) {
      if (statusEl) statusEl.textContent = `No records older than ${days} days found.`;
      return;
    }

    toDelete.sort((a, b) => b - a);
    for (const rowIndex of toDelete) {
      await deleteRowProxy(CALENDAR_SHEET_ID, LOGIN_LOG_SHEET_NAME, rowIndex);
    }

    _sDel(ACT_CACHE_KEY); _actLoaded = false;
    await loadActivityLog();
    showToast(`Purged ${toDelete.length} record${toDelete.length!==1?"s":""} ✓`);
  } catch(e) { alert("Purge failed: " + e.message); }
}

async function doSaveLink() {
  const team  = document.getElementById("lm-team").value;
  const title = document.getElementById("lm-title").value.trim();
  const url   = document.getElementById("lm-url").value.trim();
  const desc  = document.getElementById("lm-desc").value.trim();

  if (!title) { errEl.textContent = "Title is required."; return; }
  if (!url)   { errEl.textContent = "URL is required."; return; }

    if (m.mode === "add") {
      await appendRow(CALENDAR_SHEET_ID, TEAM_LINKS_SHEET_NAME, [nextLinkId(_allLinks), team, title, url, desc]);

async function deleteLink(rowIndex) {
  const l = _allLinks.find(l => l.rowIndex === rowIndex);

  try {

          <button id="cp-save-btn" onclick="doChangePin()" style="background:#1b4332;color:#fff;font-size:12px;font-weight:600;padding:7px 16px;border-radius:8px;border:none;cursor:pointer;">Update PIN</button>
        </div>

function closeChangePinModal() {
  const el = document.getElementById("change-pin-modal");
  if (el) el.remove();
}

async function doChangePin() {
  const current  = document.getElementById("cp-current").value.trim();
  const newPin   = document.getElementById("cp-new").value.trim();
  const confirm  = document.getElementById("cp-confirm").value.trim();
  const errEl    = document.getElementById("cp-error");
  const btnEl    = document.getElementById("cp-save-btn");

  errEl.textContent = "";

  const configRow = window._configRows.find(r => r[0] === SESSION.name);
  if (!configRow || String(configRow[1]).trim() !== current) {
    errEl.textContent = "Current PIN is incorrect."; return;
  }
  if (!/^\d{4}$/.test(newPin)) {
    errEl.textContent = "New PIN must be exactly 4 digits."; return;
  }
  if (newPin !== confirm) {
    errEl.textContent = "New PIN and confirmation do not match."; return;
  }
  if (newPin === current) {
    errEl.textContent = "New PIN must be different from the current PIN."; return;
  }

  btnEl.disabled = true; btnEl.textContent = "Saving…";
  try {
    const rows = await readSheet(CALENDAR_SHEET_ID, CONFIG_SHEET_NAME);
    const idx  = rows.slice(1).findIndex(r => r[0] === SESSION.name);
    if (idx < 0) throw new Error("User not found in Config.");
    const sheetRow = idx + 2;
    const existing = rows[idx + 1];
    await updateRow(CALENDAR_SHEET_ID, CONFIG_SHEET_NAME, sheetRow,
      [existing[0], newPin, existing[2]]);
    window._configRows = window._configRows.map(r =>
      r[0] === SESSION.name ? [r[0], newPin, r[2], r[3]] : r
    );
    closeChangePinModal();
    showToast("PIN updated ✓");
  } catch(e) {
    errEl.textContent = "Failed to update PIN: " + e.message;
    btnEl.disabled = false; btnEl.textContent = "Update PIN";
  }
}

function rowsToTeamEvents(rows) {
  if (rows.length < 2) return [];
  return rows.slice(1).map((r, i) => ({
    rowIndex: i + 2,
    eventId:  r[0] || "",
    team:     r[1] || "",
    title:    r[2] || "",
    startDate: normDate(r[3]),
    endDate:   normDate(r[4]),
    desc:     r[5] || ""
  })).filter(e => e.team && e.title && e.startDate && e.endDate);
}

function nextTeamEventId(events) {
  const nums = events.map(e => parseInt((e.eventId||"").replace("EVT-",""),10)).filter(n=>!isNaN(n));
  return "EVT-" + String((nums.length ? Math.max(...nums) : 0) + 1).padStart(3,"0");
}

function renderTeamEvents() {
  document.getElementById("app").innerHTML = shellHTML(SESSION.role, SESSION.name,
    tabBarHTML() + `<div id="events-main"></div>`);
  const availTeams = SESSION.role === "Manager" ? (SESSION.teams||[]) : (SESSION.teams||[]);
  if (!_activeTeamCal) _activeTeamCal = SESSION.role === "Manager" ? "all" : (availTeams[0] || "");
  if (_teamEventsLoaded) {
    _teamCalView === "year" ? renderTEventsYearView() : renderTEventsGrid();
    _bgRefreshTeamEvents();
  } else {
    document.getElementById("events-main").innerHTML = `<div class="spinner"></div>`;
    loadTeamEvents();
  }
}

async function loadTeamEvents() {
  const cached = _sGet("tmgr_tevents");
  if (cached) {
    _teamEvents = cached; _teamEventsLoaded = true;
    _teamCalView === "year" ? renderTEventsYearView() : renderTEventsGrid();
  }
  try {
    const rows  = await readSheet(CALENDAR_SHEET_ID, TEAM_EVENTS_SHEET_NAME);
    const fresh = rowsToTeamEvents(rows);
    _sSet("tmgr_tevents", fresh);
    if (JSON.stringify(fresh) !== JSON.stringify(_teamEvents)) {
      _teamEvents = fresh;
      _teamCalView === "year" ? renderTEventsYearView() : renderTEventsGrid();
    }
    _teamEventsLoaded = true;
  } catch(e) {
    if (!cached) {
      _teamEvents = []; _teamEventsLoaded = true;
      _teamCalView === "year" ? renderTEventsYearView() : renderTEventsGrid();
    }
  }
}

async function _bgRefreshTeamEvents() {
  try {
    const rows  = await readSheet(CALENDAR_SHEET_ID, TEAM_EVENTS_SHEET_NAME);
    const fresh = rowsToTeamEvents(rows);
    _sSet("tmgr_tevents", fresh);
    if (JSON.stringify(fresh) !== JSON.stringify(_teamEvents)) {
      _teamEvents = fresh;
      _teamCalView === "year" ? renderTEventsYearView() : renderTEventsGrid();
    }
  } catch {}
}

async function reloadTeamEvents() {
  const rows = await readSheet(CALENDAR_SHEET_ID, TEAM_EVENTS_SHEET_NAME);
  _teamEvents = rowsToTeamEvents(rows);
  _sSet("tmgr_tevents", _teamEvents);
  _teamCalView === "year" ? renderTEventsYearView() : renderTEventsGrid();
}

function setActiveTeamCal(team) { _activeTeamCal = team; _teamCalView === "year" ? renderTEventsYearView() : renderTEventsGrid(); }
function teamCalPrevMonth() { if (_teamCalMonth===0){_teamCalMonth=11;_teamCalYear--;}else _teamCalMonth--; renderTEventsGrid(); }
function teamCalNextMonth() { if (_teamCalMonth===11){_teamCalMonth=0;_teamCalYear++;}else _teamCalMonth++; renderTEventsGrid(); }
function teamCalPrevYear()  { _teamCalYear--; renderTEventsYearView(); }
function teamCalNextYear()  { _teamCalYear++; renderTEventsYearView(); }
function setTeamCalView(v)  { _teamCalView=v; v==="year"?renderTEventsYearView():renderTEventsGrid(); }
function switchToTeamCalMonth(mi) { _teamCalMonth=mi; setTeamCalView("month"); }

function _tEventsTeamSwitcher(availTeams) {
  if (availTeams.length <= 1 && SESSION.role !== "Manager") return "";
  const buttons = [];
  if (SESSION.role === "Manager") {
    const on = _activeTeamCal === "all";
    buttons.push(`<button onclick="setActiveTeamCal('all')"
      style="padding:5px 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;
      border:${on?"2px solid #1b4332":"1.5px solid #d1fae5"};
      background:${on?"#1b4332":"#fff"};color:${on?"#fff":"#374151"};">All Teams</button>`);
  }
  availTeams.forEach(t => {
    const on = _activeTeamCal === t;
    buttons.push(`<button onclick="setActiveTeamCal('${t.replace(/'/g,"&#39;")}')"
      style="padding:5px 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;
      border:${on?"2px solid #1b4332":"1.5px solid #d1fae5"};
      background:${on?"#1b4332":"#fff"};color:${on?"#fff":"#374151"};">${t}</button>`);
  });
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">${buttons.join("")}</div>`;
}

function _tEventsCalViewToggle() {
  return `<div style="display:flex;background:#f0fdf4;border-radius:7px;padding:2px;border:1px solid #d1fae5;">
    <button onclick="setTeamCalView('month')" style="padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;border:none;cursor:pointer;background:${_teamCalView==='month'?'#1b4332':'transparent'};color:${_teamCalView==='month'?'#fff':'#6b7280'};">Month</button>
    <button onclick="setTeamCalView('year')"  style="padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;border:none;cursor:pointer;background:${_teamCalView==='year'?'#1b4332':'transparent'};color:${_teamCalView==='year'?'#fff':'#6b7280'};">Year</button>
  </div>`;
}

function renderTEventsGrid() {
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DAYS   = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const year = _teamCalYear, month = _teamCalMonth;
  const firstDay = new Date(year, month, 1).getDay();
  const dim      = new Date(year, month+1, 0).getDate();
  const td = new Date();
  const todayStr = `${td.getFullYear()}-${String(td.getMonth()+1).padStart(2,"0")}-${String(td.getDate()).padStart(2,"0")}`;
  const mStart   = `${year}-${String(month+1).padStart(2,"0")}-01`;
  const mEnd     = `${year}-${String(month+1).padStart(2,"0")}-${String(dim).padStart(2,"0")}`;
  const showAll  = _activeTeamCal === "all";
  const mEvts    = _teamEvents.filter(e => (showAll || e.team === _activeTeamCal) && e.endDate >= mStart && e.startDate <= mEnd);

  const cells = Array(firstDay).fill(null);
  for (let d=1; d<=dim; d++) cells.push(d);
  while (cells.length%7!==0) cells.push(null);

  const dayHeaders = DAYS.map(d=>`<div style="text-align:center;font-size:10px;font-weight:700;color:#9ca3af;padding:5px 2px;">${d}</div>`).join("");

  const rowsHTML = [];
  for (let r=0; r<cells.length; r+=7) {
    const rowCells = cells.slice(r,r+7).map(day => {
      if (!day) return `<div style="min-height:80px;background:#fafafa;border-right:1px solid #f3f4f6;"></div>`;
      const ds = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      const isToday = ds===todayStr;
      const dayEvts = mEvts.filter(e => e.startDate<=ds && e.endDate>=ds);
      const chips   = dayEvts.map(e => {
        const bg    = showAll ? memberColor(e.team) : memberColor(e.title);
        const label = showAll ? `[${e.team}] ${e.title}` : e.title;
        return `<div onclick="event.stopPropagation();openTeamEventEditModal(${e.rowIndex})"
          title="${e.title}${e.desc?' | '+e.desc:''} (${e.team} · ${formatDueDate(e.startDate)} – ${formatDueDate(e.endDate)})"
          style="background:${bg};color:#fff;font-size:9px;font-weight:600;padding:2px 5px;border-radius:3px;margin-top:2px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${label}</div>`;
      }).join("");
      const bgN=isToday?"#f0fdf4":"#fff", bgH=isToday?"#d1fae5":"#f9fafb";
      return `<div onclick="openTeamEventAddModal('${ds}')"
        style="min-height:80px;padding:3px 4px;border-right:1px solid #f3f4f6;background:${bgN};cursor:pointer;"
        onmouseover="this.style.background='${bgH}'" onmouseout="this.style.background='${bgN}'">
        <div style="font-size:11px;font-weight:${isToday?700:500};width:19px;height:19px;display:flex;align-items:center;justify-content:center;border-radius:50%;${isToday?"background:#1b4332;color:#fff;":"color:#374151;"}">${day}</div>
        ${chips}
      </div>`;
    }).join("");
    rowsHTML.push(`<div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid #f3f4f6;">${rowCells}</div>`);
  }

  const legendItems = showAll
    ? [...new Set(mEvts.map(e=>e.team))].map(t=>`<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#6b7280;"><div style="width:8px;height:8px;border-radius:50%;background:${memberColor(t)};flex-shrink:0;"></div>${t}</div>`)
    : [...new Set(mEvts.map(e=>e.title))].map(t=>`<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#6b7280;"><div style="width:8px;height:8px;border-radius:50%;background:${memberColor(t)};flex-shrink:0;"></div>${t}</div>`);
  const legend = legendItems.length ? `
    <div style="display:flex;gap:12px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid #f3f4f6;">${legendItems.join("")}</div>` : "";

  const availTeams = SESSION.role==="Manager"?(SESSION.teams||[]):(SESSION.teams||[]);
  const el = document.getElementById("events-main");
  if (!el) return;
  el.innerHTML = _tEventsTeamSwitcher(availTeams) + `
    <div style="overflow-x:auto;">
    <div style="background:#fff;border-radius:16px;border:1px solid #d1fae5;overflow:hidden;min-width:560px;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #d1fae5;gap:6px;">
        <button onclick="teamCalPrevMonth()" style="background:#f0fdf4;border:none;color:#1b4332;border-radius:8px;padding:4px 12px;font-size:18px;font-weight:700;cursor:pointer;line-height:1;flex-shrink:0;">&#8249;</button>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;flex:1;">
          <span style="font-size:15px;font-weight:700;color:#1b4332;">${MONTHS[month]} ${year}</span>
          ${_tEventsCalViewToggle()}
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
          <button onclick="openTeamEventAddModal(null)" style="background:#1b4332;color:#fff;font-size:11px;font-weight:600;padding:5px 10px;border-radius:8px;border:none;cursor:pointer;">+ Add</button>
          <button onclick="teamCalNextMonth()" style="background:#f0fdf4;border:none;color:#1b4332;border-radius:8px;padding:4px 12px;font-size:18px;font-weight:700;cursor:pointer;line-height:1;">&#8250;</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);background:#f9fafb;border-bottom:1px solid #f3f4f6;">${dayHeaders}</div>
      ${rowsHTML.join("")}
      ${legend}
    </div></div>`;
}

function renderTEventsYearView() {
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DAYS = ["S","M","T","W","T","F","S"];
  const year = _teamCalYear;
  const td = new Date();
  const todayStr = `${td.getFullYear()}-${String(td.getMonth()+1).padStart(2,"0")}-${String(td.getDate()).padStart(2,"0")}`;
  const showAllY = _activeTeamCal === "all";
  const yEvts = _teamEvents.filter(e => (showAllY || e.team===_activeTeamCal) && e.endDate>=`${year}-01-01` && e.startDate<=`${year}-12-31`);

  const miniMonths = MONTHS.map((mName,mi) => {
    const mn  = mi+1;
    const dim = new Date(year,mn,0).getDate();
    const fd  = new Date(year,mi,1).getDay();
    const mStart = `${year}-${String(mn).padStart(2,"0")}-01`;
    const mEnd   = `${year}-${String(mn).padStart(2,"0")}-${String(dim).padStart(2,"0")}`;
    const mEvts  = yEvts.filter(e => e.endDate>=mStart && e.startDate<=mEnd);
    const cells  = Array(fd).fill(null);
    for (let d=1;d<=dim;d++) cells.push(d);
    while (cells.length%7!==0) cells.push(null);
    const hdr = DAYS.map(d=>`<div style="text-align:center;font-size:7px;font-weight:700;color:#9ca3af;">${d}</div>`).join("");
    let gridRows = "";
    for (let r=0;r<cells.length;r+=7) {
      gridRows += `<div style="display:grid;grid-template-columns:repeat(7,1fr);">` +
        cells.slice(r,r+7).map(day => {
          if (!day) return `<div style="height:18px;"></div>`;
          const ds = `${year}-${String(mn).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
          const isToday = ds===todayStr;
          const dayEvts = mEvts.filter(e=>e.startDate<=ds&&e.endDate>=ds);
          const hasPTO  = dayEvts.length>0;
          const _evtColor = e => showAllY ? memberColor(e.team) : memberColor(e.title);
          const bg = hasPTO ? _evtColor(dayEvts[0])+"28" : "transparent";
          const numBg  = isToday ? "#1b4332" : "transparent";
          const numCol = isToday ? "#fff" : "#374151";
          const dots = hasPTO ? `<div style="display:flex;gap:1px;justify-content:center;">${
            dayEvts.slice(0,3).map(e=>`<div style="width:3px;height:3px;border-radius:50%;background:${_evtColor(e)};"></div>`).join("")
          }</div>` : "";
          const tip = hasPTO ? ` title="${dayEvts.map(e=>e.title).join(", ")}"` : "";
          return `<div${tip} style="height:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:${bg};border-radius:2px;">
            <div style="font-size:8px;font-weight:${isToday?700:400};color:${numCol};background:${numBg};border-radius:50%;width:13px;height:13px;display:flex;align-items:center;justify-content:center;">${day}</div>
            ${dots}
          </div>`;
        }).join("") + `</div>`;
    }
    return `<div onclick="switchToTeamCalMonth(${mi})" title="View ${mName}"
      style="background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:8px 6px;cursor:pointer;"
      onmouseover="this.style.borderColor='#1b4332';this.style.background='#f0fdf4'"
      onmouseout="this.style.borderColor='#e5e7eb';this.style.background='#fff'">
      <div style="font-size:11px;font-weight:700;color:#1b4332;text-align:center;margin-bottom:5px;">${mName}</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px;">${hdr}</div>
      ${gridRows}
    </div>`;
  });

  const availTeams = SESSION.role==="Manager"?(SESSION.teams||[]):(SESSION.teams||[]);
  const el = document.getElementById("events-main");
  if (!el) return;
  el.innerHTML = _tEventsTeamSwitcher(availTeams) + `
    <div style="background:#fff;border-radius:16px;border:1px solid #d1fae5;overflow:hidden;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #d1fae5;gap:6px;">
        <button onclick="teamCalPrevYear()" style="background:#f0fdf4;border:none;color:#1b4332;border-radius:8px;padding:4px 12px;font-size:18px;font-weight:700;cursor:pointer;line-height:1;flex-shrink:0;">&#8249;</button>
        <div style="display:flex;align-items:center;gap:12px;">
          <span style="font-size:15px;font-weight:700;color:#1b4332;">${year}</span>
          ${_tEventsCalViewToggle()}
        </div>
        <button onclick="teamCalNextYear()" style="background:#f0fdf4;border:none;color:#1b4332;border-radius:8px;padding:4px 12px;font-size:18px;font-weight:700;cursor:pointer;line-height:1;flex-shrink:0;">&#8250;</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px;">
        ${miniMonths.join("")}
      </div>
    </div>`;
}

function openTeamEventAddModal(dateStr) {
  const teams = SESSION.role==="Manager" ? (SESSION.teams||[]) : (SESSION.teams||[]);
  _teamEventModal = { mode:"add", eventId:"", team: _activeTeamCal||teams[0]||"", title:"", startDate:dateStr||"", endDate:dateStr||"", desc:"" };
  renderTeamEventModal();
}
function openTeamEventEditModal(rowIndex) {
  const e = _teamEvents.find(e=>e.rowIndex===rowIndex);
  if (!e) return;
  _teamEventModal = { mode:"edit", ...e };
  renderTeamEventModal();
}

function renderTeamEventModal() {
  const ex = document.getElementById("tevt-modal"); if (ex) ex.remove();
  const m  = _teamEventModal; if (!m) return;
  const isEdit = m.mode==="edit";
  const F = "width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid #d1fae5;font-size:13px;";
  const availTeams = SESSION.role==="Manager" ? (SESSION.teams||[]) : (SESSION.teams||[]);
  const teamOpts = availTeams.map(t=>`<option value="${t}"${t===m.team?" selected":""}>${t}</option>`).join("");
  const canPickTeam = availTeams.length > 1;

  document.body.insertAdjacentHTML("beforeend", `
    <div id="tevt-modal" onclick="if(event.target===this)closeTeamEventModal()"
      style="position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:1000;">
      <div onclick="event.stopPropagation()"
        style="background:#fff;border-radius:16px;padding:1.5rem 1.75rem;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.25);max-height:90vh;overflow-y:auto;">
        <div style="font-size:15px;font-weight:700;color:#1b4332;margin-bottom:16px;">${isEdit?"Edit":"Add"} Event</div>

        <label style="font-size:11px;font-weight:700;color:#6b7280;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;">Team</label>
        <select id="tm-team" ${canPickTeam?"":"disabled"}
          style="${F} margin-bottom:14px;background:${canPickTeam?"#fff":"#f9fafb"};">${teamOpts}</select>

        <label style="font-size:11px;font-weight:700;color:#6b7280;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;">Title *</label>
        <input id="tm-title" value="${m.title.replace(/"/g,"&quot;")}" placeholder="e.g. Month End Close, Budget Review"
          style="${F} margin-bottom:14px;"/>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
          <div>
            <label style="font-size:11px;font-weight:700;color:#6b7280;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;">Start Date *</label>
            <input id="tm-start" type="date" value="${m.startDate}" onchange="tEvtStartChanged()" style="${F}"/>
          </div>
          <div>
            <label style="font-size:11px;font-weight:700;color:#6b7280;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;">End Date *</label>
            <input id="tm-end" type="date" value="${m.endDate}" style="${F}"/>
          </div>
        </div>

        <label style="font-size:11px;font-weight:700;color:#6b7280;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;">Description</label>
        <input id="tm-desc" value="${(m.desc||"").replace(/"/g,"&quot;")}" placeholder="Optional details"
          style="${F} margin-bottom:14px;"/>

        <div id="tm-error" style="color:#dc2626;font-size:12px;min-height:16px;margin-bottom:10px;"></div>
        <div style="display:flex;gap:8px;align-items:center;">
          ${isEdit?`<button onclick="doDeleteTeamEvent(${m.rowIndex})" style="background:#fff1f2;color:#dc2626;font-size:12px;font-weight:600;padding:7px 14px;border-radius:8px;border:1px solid #fca5a5;cursor:pointer;">Delete</button>`:""}
          <div style="flex:1;"></div>
          <button onclick="closeTeamEventModal()" style="background:#fff;color:#374151;font-size:12px;font-weight:600;padding:7px 16px;border-radius:8px;border:1.5px solid #e5e7eb;cursor:pointer;">Cancel</button>
          <button onclick="doSaveTeamEvent()" style="background:#1b4332;color:#fff;font-size:12px;font-weight:600;padding:7px 16px;border-radius:8px;border:none;cursor:pointer;">Save</button>
        </div>
      </div>
    </div>`);
  document.getElementById("tm-title").focus();
}

function tEvtStartChanged() {
  const s = document.getElementById("tm-start").value;
  const e = document.getElementById("tm-end");
  if (!e.value || e.value < s) e.value = s;
}

function closeTeamEventModal() {
  _teamEventModal = null;
  const el = document.getElementById("tevt-modal"); if (el) el.remove();
}

async function doSaveTeamEvent() {
  const team  = document.getElementById("tm-team").value;
  const title = document.getElementById("tm-title").value.trim();
  const start = document.getElementById("tm-start").value;
  const end   = document.getElementById("tm-end").value;
  const desc  = document.getElementById("tm-desc").value.trim();
  const m     = _teamEventModal;
  const errEl = document.getElementById("tm-error");
  if (!title) { errEl.textContent = "Title is required."; return; }
  if (!start || !end) { errEl.textContent = "Start and end dates are required."; return; }
  if (end < start) { errEl.textContent = "End date cannot be before start date."; return; }
  try {
    if (m.mode==="add") {
      await appendRow(CALENDAR_SHEET_ID, TEAM_EVENTS_SHEET_NAME, [nextTeamEventId(_teamEvents), team, title, start, end, desc]);
    } else {
      await updateRow(CALENDAR_SHEET_ID, TEAM_EVENTS_SHEET_NAME, m.rowIndex, [m.eventId, team, title, start, end, desc]);
    }
    closeTeamEventModal();
    await reloadTeamEvents();
    showToast("Saved ✓");
  } catch(e) { errEl.textContent = "Save failed: " + e.message; }
}

async function doDeleteTeamEvent(rowIndex) {
  if (!confirm("Delete this event?")) return;
  closeTeamEventModal();
  try {
    await deleteRowProxy(CALENDAR_SHEET_ID, TEAM_EVENTS_SHEET_NAME, rowIndex);
    await reloadTeamEvents();
    showToast("Deleted");
  } catch(e) { alert("Delete failed: " + e.message); }
}

// ── BOOT ───────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
