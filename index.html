<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Manager — cars.com</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f0fdf4; min-height: 100vh; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { width:32px;height:32px;border-radius:50%;border:3px solid #d1fae5;border-top-color:#1b4332;animation:spin 0.7s linear infinite;margin:3rem auto;display:block; }
  select, input { font-family: inherit; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; }
  button { font-family: inherit; cursor: pointer; }
  #toast { position:fixed; bottom:24px; right:24px; background:#1b4332; color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; font-weight:600; box-shadow:0 4px 16px rgba(0,0,0,0.18); opacity:0; pointer-events:none; transition:opacity 0.25s; z-index:9999; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
let _toastTimer;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

const PROXY_URL           = "https://script.google.com/macros/s/AKfycbz7r-TEanf7GsxPr4FG4QUyhg-US8noF8gi4Z6bT4luLQQ3LLRuNbcwXr6CojuLwpm9ug/exec";
const CALENDAR_SHEET_ID   = "1UjIACDMDZNcYCaVmxUP-6DF2zeP4QMxuU0e74Kr6Ugc";
const CALENDAR_SHEET_NAME = "Vacations";

// ── PROXY HELPERS ──────────────────────────────────────────────────────────────
async function proxyCall(params) {
  const url = PROXY_URL + "?" + new URLSearchParams(params).toString();
  const res = await fetch(url);
  if (!res.ok) throw new Error("Proxy error: " + res.status);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json.data;
}
const readConfig = () => proxyCall({ action: "getConfig" });
const readSheet  = (sheetId, sheetName) => proxyCall({ action: "getTasks", sheetId, sheetName });
const appendRow  = (sheetId, sheetName, values) => proxyCall({ action: "appendRow", sheetId, sheetName, values: JSON.stringify(values) });
const updateRow  = (sheetId, sheetName, rowIndex, values) => proxyCall({ action: "updateRow", sheetId, sheetName, rowIndex, values: JSON.stringify(values) });
const deleteRowProxy = (sheetId, sheetName, rowIndex) => proxyCall({ action: "deleteRow", sheetId, sheetName, rowIndex });

// ── UTILS ──────────────────────────────────────────────────────────────────────
function rowsToTasks(rows, sheetId) {
  if (rows.length < 2) return [];
  return rows.slice(1).map((r, i) => ({
    rowIndex: i + 2, sheetId,
    taskId: r[0]||"", assignedTo: r[1]||"", task: r[2]||"",
    dueDate: r[3]||"", priority: r[4]||"Medium",
    status: r[5]||"Not Started", notes: r[6]||""
  }));
}
function isOverdue(d) {
  if (!d) return false;
  const [m,dy,y] = d.split("/");
  const due = new Date(y, m-1, dy);
  const today = new Date(); today.setHours(0,0,0,0);
  return due < today;
}
function nextTaskId(tasks) {
  const nums = tasks.map(t => parseInt(t.taskId.replace("TSK-",""),10)).filter(n=>!isNaN(n));
  const max = nums.length ? Math.max(...nums) : 0;
  return "TSK-" + String(max+1).padStart(3,"0");
}
function priorityBadge(p) {
  const map = { High:"background:#fee2e2;color:#991b1b", Medium:"background:#fef9c3;color:#854d0e", Low:"background:#dcfce7;color:#166534" };
  return `<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;${map[p]||map.Medium}">${p}</span>`;
}
function statusBadge(s) {
  const map = { "Not Started":"background:#f1f5f9;color:#475569","In Progress":"background:#dbeafe;color:#1e40af","Completed":"background:#dcfce7;color:#166534" };
  return `<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;${map[s]||map["Not Started"]}">${s}</span>`;
}
const LOGO = `<svg width="36" height="36" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="40" height="40" rx="10" fill="#1b4332"/>
  <circle cx="15" cy="14" r="4" fill="#52b788"/>
  <circle cx="25" cy="14" r="4" fill="#95d5b2"/>
  <path d="M7 30c0-4.418 3.582-8 8-8s8 3.582 8 8" stroke="#52b788" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M21 28.5c1.2-3.8 4.6-6.5 8.5-6.5" stroke="#95d5b2" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M29.5 22c3.314 0 6 2.686 6 6" stroke="#95d5b2" stroke-width="2.2" stroke-linecap="round" fill="none"/>
</svg>`;

// ── APP STATE ──────────────────────────────────────────────────────────────────
let SESSION    = null;
let _activeTab = "tasks";
let _calEvents = [], _calYear = new Date().getFullYear(), _calMonth = new Date().getMonth(), _calModal = null;

function render() {
  if (!SESSION) renderLogin();
  else if (SESSION.role === "Manager") renderManager();
  else renderMember();
}

// ── LOGIN ──────────────────────────────────────────────────────────────────────
function renderLogin() {
  document.getElementById("app").innerHTML = `
    <div style="min-height:100vh;background:#f0fdf4;display:flex;align-items:center;justify-content:center;">
      <div style="background:#fff;border-radius:16px;padding:2.5rem 2rem;box-shadow:0 4px 24px rgba(27,67,50,0.10);width:100%;max-width:380px;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:1.75rem;">
          ${LOGO.replace('width="36"','width="44"').replace('height="36"','height="44"')}
          <div>
            <div style="font-size:22px;font-weight:700;color:#1b4332;letter-spacing:-0.5px;">Team Manager</div>
            <div style="font-size:13px;color:#6b7280;">cars.com</div>
          </div>
        </div>
        <div id="login-body"><div class="spinner"></div></div>
      </div>
    </div>`;
  loadLoginData();
}

async function loadLoginData() {
  try {
    const rows = await readConfig();
    const data = rows.slice(1).filter(r => r[0]);
    window._configRows = data;
    const names = data.map(r => r[0]);
    document.getElementById("login-body").innerHTML = `
      <label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:6px;">Your Name</label>
      <select id="sel-name" style="width:100%;padding:10px 12px;border-radius:8px;margin-bottom:16px;border:1.5px solid #d1fae5;font-size:14px;color:#1b4332;background:#f0fdf4;outline:none;appearance:none;">
        <option value="">— Select your name —</option>
        ${names.map(n=>`<option value="${n}">${n}</option>`).join("")}
      </select>
      <label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:6px;">PIN</label>
      <input id="inp-pin" type="password" maxlength="4" placeholder="4-digit PIN"
        style="width:100%;padding:10px 12px;border-radius:8px;margin-bottom:20px;border:1.5px solid #d1fae5;font-size:18px;letter-spacing:8px;color:#1b4332;background:#f0fdf4;outline:none;"/>
      <div id="login-error"></div>
      <button onclick="doLogin()" style="width:100%;padding:12px;border-radius:10px;background:#1b4332;color:#fff;font-size:15px;font-weight:600;border:none;">Sign In</button>`;
    document.getElementById("inp-pin").addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });
  } catch(e) {
    document.getElementById("login-body").innerHTML = `<div style="background:#fee2e2;color:#991b1b;padding:12px;border-radius:8px;">Could not load config: ${e.message}</div>`;
  }
}

function doLogin() {
  const name = document.getElementById("sel-name").value;
  const pin  = document.getElementById("inp-pin").value;
  const errEl = document.getElementById("login-error");
  if (!name) { errEl.innerHTML = errorBox("Please select your name."); return; }
  const row = window._configRows.find(r => r[0] === name);
  if (!row || String(row[1]).trim() !== String(pin).trim()) { errEl.innerHTML = errorBox("Invalid PIN. Please try again."); return; }
  const role = row[2];
  const sheetId = row[3] || "";
  if (role === "Manager") {
    const memberRows = window._configRows.filter(r => r[2] === "Member");
    SESSION = { name, role, memberRows };
  } else {
    SESSION = { name, role, sheetId };
  }
  render();
}

function errorBox(msg) {
  return `<div style="background:#fee2e2;color:#991b1b;font-size:13px;padding:8px 12px;border-radius:8px;margin-bottom:16px;">${msg}</div>`;
}

// ── APP SHELL ──────────────────────────────────────────────────────────────────
function shellHTML(roleLabel, userName, mainContent) {
  return `
    <div style="min-height:100vh;background:#f0fdf4;">
      <header style="background:#1b4332;color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;box-shadow:0 2px 12px rgba(27,67,50,0.18);">
        <div style="display:flex;align-items:center;gap:12px;">
          ${LOGO}
          <span style="font-size:18px;font-weight:700;letter-spacing:-0.3px;">Team Manager</span>
          <span style="background:#52b788;color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;margin-left:4px;">${roleLabel}</span>
        </div>
        <div style="display:flex;align-items:center;gap:16px;">
          <span style="font-size:13px;color:#95d5b2;">${userName}</span>
          <button onclick="refreshView()" style="background:rgba(255,255,255,0.1);border:none;color:#fff;border-radius:8px;padding:5px 10px;font-size:16px;">↻</button>
          <button onclick="signOut()" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);color:#fff;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;">Sign Out</button>
        </div>
      </header>
      <main style="max-width:1200px;margin:0 auto;padding:24px 20px;">${mainContent}</main>
    </div>`;
}

function signOut() { SESSION = null; _activeTab = "tasks"; render(); }
function refreshView() { render(); }

// ── MEMBER VIEW ────────────────────────────────────────────────────────────────
let _memberTasks = [];

function renderMember() {
  if (_activeTab === "calendar") { renderCalendar(); return; }
  const sheetName = "Tasks_" + SESSION.name.split(" ")[0];
  document.getElementById("app").innerHTML = shellHTML("Member", SESSION.name, tabBarHTML() + `<div id="member-main"><div class="spinner"></div></div>`);
  loadMemberTasks(sheetName);
}

async function loadMemberTasks(sheetName) {
  try {
    const rows = await readSheet(SESSION.sheetId, sheetName);
    _memberTasks = rowsToTasks(rows, SESSION.sheetId);
    renderMemberTable(sheetName);
  } catch(e) {
    document.getElementById("member-main").innerHTML = `<div style="color:#dc2626;padding:16px;">Failed to load tasks: ${e.message}</div>`;
  }
}

function renderMemberTable(sheetName) {
  const tasks = _memberTasks;
  const total = tasks.length;
  const done = tasks.filter(t=>t.status==="Completed").length;
  const inProg = tasks.filter(t=>t.status==="In Progress").length;

  const statsHTML = `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;">
      ${[["Total Tasks",total,"#1b4332"],["In Progress",inProg,"#1e40af"],["Completed",done,"#166534"]]
        .map(([l,v,c])=>`<div style="background:#fff;border-radius:12px;padding:1rem 1.25rem;border:1px solid #d1fae5;text-align:center;">
          <div style="font-size:28px;font-weight:700;color:${c};">${v}</div>
          <div style="font-size:12px;color:#6b7280;margin-top:2px;">${l}</div></div>`).join("")}
    </div>`;

  const bodyRows = tasks.length === 0
    ? `<tr><td colspan="7" style="text-align:center;padding:3rem;color:#9ca3af;">No tasks assigned yet.</td></tr>`
    : tasks.map(t => {
        const ov = isOverdue(t.dueDate) && t.status !== "Completed";
        return `<tr style="background:${ov?"#fff1f2":"#fff"};border-bottom:1px solid #f0fdf4;">
          <td style="padding:10px 12px;color:#6b7280;white-space:nowrap;">${t.taskId}</td>
          <td style="padding:10px 12px;max-width:220px;">${t.task}</td>
          <td style="padding:10px 12px;white-space:nowrap;color:${ov?"#dc2626":"#374151"};font-weight:${ov?600:400};">${t.dueDate}${ov?" ⚠":""}</td>
          <td style="padding:10px 12px;">${priorityBadge(t.priority)}</td>
          <td style="padding:10px 12px;">
            <select onchange="memberUpdateField(${t.rowIndex},'status',this.value,'${sheetName}')"
              style="font-size:12px;padding:4px 8px;border-radius:6px;border:1.5px solid #d1fae5;">
              ${["Not Started","In Progress","Completed"].map(s=>`<option${s===t.status?" selected":""}>${s}</option>`).join("")}
            </select>
          </td>
          <td style="padding:10px 12px;max-width:180px;">
            <input value="${(t.notes||"").replace(/"/g,"&quot;")}" onblur="memberUpdateField(${t.rowIndex},'notes',this.value,'${sheetName}')"
              style="font-size:12px;padding:4px 8px;border-radius:6px;border:1.5px solid #d1fae5;width:100%;"/>
          </td>
          <td style="padding:10px 12px;">
            <button onclick="memberSaveRow(${t.rowIndex},'${sheetName}')"
              style="background:#1b4332;color:#fff;font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;border:none;">Save</button>
          </td>
        </tr>`;
      }).join("");

  document.getElementById("member-main").innerHTML = statsHTML + `
    <div style="overflow-x:auto;">
      <table style="font-size:13px;">
        <thead><tr style="background:#f0fdf4;">
          ${["Task ID","Task","Due Date","Priority","Status","Notes",""].map(h=>`<th style="padding:10px 12px;font-weight:600;color:#1b4332;border-bottom:2px solid #d1fae5;white-space:nowrap;">${h}</th>`).join("")}
        </tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>`;
}

function memberUpdateField(rowIndex, field, value, sheetName) {
  const t = _memberTasks.find(t => t.rowIndex === rowIndex);
  if (t) t[field] = value;
}

async function memberSaveRow(rowIndex, sheetName) {
  const t = _memberTasks.find(t => t.rowIndex === rowIndex);
  if (!t) return;
  try {
    await updateRow(SESSION.sheetId, sheetName, rowIndex,
      [t.taskId, t.assignedTo, t.task, t.dueDate, t.priority, t.status, t.notes]);
    showToast("Saved ✓");
  } catch(e) { alert("Save failed: " + e.message); }
}

// ── MANAGER VIEW ───────────────────────────────────────────────────────────────
let _allTasks = [];
let _filterMember = "All";
let _editingTask = null;

function renderManager() {
  if (_activeTab === "calendar") { renderCalendar(); return; }
  document.getElementById("app").innerHTML = shellHTML("Manager", SESSION.name, tabBarHTML() + `<div id="manager-main"><div class="spinner"></div></div>`);
  loadAllTasks();
}

async function loadAllTasks() {
  try {
    const results = await Promise.all(SESSION.memberRows.map(async r => {
      const sheetId = r[3];
      const firstName = r[0].split(" ")[0];
      const sheetName = "Tasks_" + firstName;
      try {
        const rows = await readSheet(sheetId, sheetName);
        return rowsToTasks(rows, sheetId).map(t => ({...t, sheetName, firstName}));
      } catch { return []; }
    }));
    _allTasks = results.flat();
    _filterMember = "All";
    _editingTask = null;
    renderManagerTable();
  } catch(e) {
    document.getElementById("manager-main").innerHTML = `<div style="color:#dc2626;padding:16px;">Failed to load tasks: ${e.message}</div>`;
  }
}

function renderManagerTable(showAddForm) {
  const memberNames = SESSION.memberRows.map(r => r[0]);
  const filtered = _filterMember === "All" ? _allTasks : _allTasks.filter(t => t.assignedTo === _filterMember);

  const filterBtns = memberNames.map(n => {
    const active = _filterMember === n;
    const count = _allTasks.filter(t => t.assignedTo === n).length;
    return `<button onclick="setFilter('${n}')"
      style="padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;
      border:${active?"2px solid #1b4332":"1.5px solid #d1fae5"};
      background:${active?"#1b4332":"#f0fdf4"};
      color:${active?"#fff":"#1b4332"};">${n.split(" ")[0]} (${count})</button>`;
  }).join("");
  const clearBtn = _filterMember !== "All"
    ? `<button onclick="setFilter('All')" style="padding:6px 14px;border-radius:999px;font-size:12px;border:1.5px solid #fca5a5;background:#fff1f2;color:#991b1b;font-weight:600;">✕ Clear filter</button>`
    : "";

  const addForm = showAddForm ? `
    <div style="background:#f0fdf4;border:1.5px solid #d1fae5;border-radius:12px;padding:1rem 1.25rem;margin-bottom:8px;">
      <div style="font-size:14px;font-weight:700;color:#1b4332;margin-bottom:12px;">New Task</div>
      <div style="display:grid;grid-template-columns:1fr 2fr 1fr 1fr 1fr;gap:10px;margin-bottom:10px;">
        <div><label style="font-size:11px;font-weight:600;color:#6b7280;display:block;margin-bottom:3px;">Assign To *</label>
          <select id="nt-assignedTo" style="font-size:13px;padding:6px 10px;border-radius:6px;border:1.5px solid #d1fae5;width:100%;">
            <option value="">—</option>${memberNames.map(n=>`<option>${n}</option>`).join("")}
          </select></div>
        <div><label style="font-size:11px;font-weight:600;color:#6b7280;display:block;margin-bottom:3px;">Task *</label>
          <input id="nt-task" placeholder="Task description" style="font-size:13px;padding:6px 10px;border-radius:6px;border:1.5px solid #d1fae5;width:100%;"/></div>
        <div><label style="font-size:11px;font-weight:600;color:#6b7280;display:block;margin-bottom:3px;">Due Date</label>
          <input id="nt-dueDate" placeholder="MM/DD/YYYY" style="font-size:13px;padding:6px 10px;border-radius:6px;border:1.5px solid #d1fae5;width:100%;"/></div>
        <div><label style="font-size:11px;font-weight:600;color:#6b7280;display:block;margin-bottom:3px;">Priority</label>
          <select id="nt-priority" style="font-size:13px;padding:6px 10px;border-radius:6px;border:1.5px solid #d1fae5;width:100%;">
            <option>High</option><option selected>Medium</option><option>Low</option></select></div>
        <div><label style="font-size:11px;font-weight:600;color:#6b7280;display:block;margin-bottom:3px;">Status</label>
          <select id="nt-status" style="font-size:13px;padding:6px 10px;border-radius:6px;border:1.5px solid #d1fae5;width:100%;">
            <option selected>Not Started</option><option>In Progress</option><option>Completed</option></select></div>
      </div>
      <div style="margin-bottom:12px;"><label style="font-size:11px;font-weight:600;color:#6b7280;display:block;margin-bottom:3px;">Notes</label>
        <input id="nt-notes" placeholder="Optional notes" style="font-size:13px;padding:6px 10px;border-radius:6px;border:1.5px solid #d1fae5;width:100%;"/></div>
      <div style="display:flex;gap:8px;">
        <button onclick="doAddTask()" style="background:#1b4332;color:#fff;font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;border:none;">Add Task</button>
        <button onclick="renderManagerTable(false)" style="background:#fff;color:#1b4332;font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;border:1px solid #d1fae5;">Cancel</button>
      </div>
    </div>` : `<button onclick="renderManagerTable(true)" style="padding:9px 18px;border-radius:8px;background:#1b4332;color:#fff;font-size:13px;font-weight:600;border:none;margin-bottom:20px;">+ Add Task</button>`;

  const IS = "font-size:13px;padding:6px 10px;border-radius:6px;border:1.5px solid #d1fae5;width:100%;";
  const bodyRows = filtered.length === 0
    ? `<tr><td colspan="8" style="text-align:center;padding:3rem;color:#9ca3af;">No tasks found.</td></tr>`
    : filtered.map(t => {
        const ov = isOverdue(t.dueDate) && t.status !== "Completed";
        const isEdit = _editingTask && _editingTask.rowIndex === t.rowIndex && _editingTask.sheetId === t.sheetId;
        if (isEdit) {
          const e = _editingTask;
          return `<tr style="background:#f0fdf4;border-bottom:1px solid #d1fae5;">
            <td style="padding:8px 12px;color:#6b7280;white-space:nowrap;">${t.taskId}</td>
            <td style="padding:8px 12px;white-space:nowrap;font-weight:500;color:#1b4332;">${t.assignedTo.split(" ")[0]}</td>
            <td style="padding:8px 12px;"><input value="${e.task.replace(/"/g,"&quot;")}" oninput="_editingTask.task=this.value" style="${IS}"/></td>
            <td style="padding:8px 12px;"><input value="${e.dueDate}" oninput="_editingTask.dueDate=this.value" placeholder="MM/DD/YYYY" style="${IS} width:110px;"/></td>
            <td style="padding:8px 12px;"><select onchange="_editingTask.priority=this.value" style="${IS}">
              ${["High","Medium","Low"].map(v=>`<option${v===e.priority?" selected":""}>${v}</option>`).join("")}</select></td>
            <td style="padding:8px 12px;"><select onchange="_editingTask.status=this.value" style="${IS}">
              ${["Not Started","In Progress","Completed"].map(v=>`<option${v===e.status?" selected":""}>${v}</option>`).join("")}</select></td>
            <td style="padding:8px 12px;"><input value="${(e.notes||"").replace(/"/g,"&quot;")}" oninput="_editingTask.notes=this.value" style="${IS}"/></td>
            <td style="padding:8px 12px;white-space:nowrap;">
              <button onclick="doSaveEdit()" style="background:#1b4332;color:#fff;font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;border:none;">Save</button>
              <button onclick="_editingTask=null;renderManagerTable()" style="background:#fff;color:#1b4332;font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;border:1px solid #d1fae5;margin-left:6px;">Cancel</button>
            </td></tr>`;
        }
        const ri = t.rowIndex, si = t.sheetId, sn = t.sheetName;
        return `<tr style="background:${ov?"#fff1f2":"#fff"};border-bottom:1px solid #f0fdf4;">
          <td style="padding:10px 12px;color:#6b7280;white-space:nowrap;">${t.taskId}</td>
          <td style="padding:10px 12px;white-space:nowrap;font-weight:500;color:#1b4332;">${t.assignedTo.split(" ")[0]}</td>
          <td style="padding:10px 12px;max-width:200px;">${t.task}</td>
          <td style="padding:10px 12px;white-space:nowrap;color:${ov?"#dc2626":"#374151"};font-weight:${ov?600:400};">${t.dueDate}${ov?" ⚠":""}</td>
          <td style="padding:10px 12px;">${priorityBadge(t.priority)}</td>
          <td style="padding:10px 12px;">${statusBadge(t.status)}</td>
          <td style="padding:10px 12px;max-width:160px;color:#6b7280;">${t.notes||""}</td>
          <td style="padding:10px 12px;white-space:nowrap;">
            <button onclick="startEdit(${ri},'${si}')" style="background:#f0fdf4;color:#1b4332;font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;border:none;">Edit</button>
            <button onclick="doDelete(${ri},'${si}','${sn}')" style="background:#fff1f2;color:#dc2626;font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;border:none;margin-left:6px;">Delete</button>
          </td></tr>`;
      }).join("");

  document.getElementById("manager-main").innerHTML = `
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">${filterBtns}${clearBtn}</div>
    <div style="margin-bottom:20px;">${addForm}</div>
    <div style="overflow-x:auto;">
      <table style="font-size:13px;">
        <thead><tr style="background:#f0fdf4;">
          ${["Task ID","Assigned To","Task","Due Date","Priority","Status","Notes","Actions"]
            .map(h=>`<th style="padding:10px 12px;font-weight:600;color:#1b4332;border-bottom:2px solid #d1fae5;white-space:nowrap;">${h}</th>`).join("")}
        </tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>`;
}

function setFilter(name) {
  _filterMember = name;
  renderManagerTable();
}

function startEdit(rowIndex, sheetId) {
  _editingTask = {..._allTasks.find(t => t.rowIndex === rowIndex && t.sheetId === sheetId)};
  renderManagerTable();
}

async function reloadMemberTasks(sheetId, sheetName, firstName) {
  const rows = await readSheet(sheetId, sheetName);
  const updated = rowsToTasks(rows, sheetId).map(t => ({...t, sheetName, firstName}));
  _allTasks = _allTasks.filter(t => t.sheetId !== sheetId).concat(updated);
  renderManagerTable();
}

async function doSaveEdit() {
  const e = _editingTask;
  if (!e) return;
  try {
    await updateRow(e.sheetId, e.sheetName, e.rowIndex,
      [e.taskId, e.assignedTo, e.task, e.dueDate, e.priority, e.status, e.notes]);
    _editingTask = null;
    await reloadMemberTasks(e.sheetId, e.sheetName, e.firstName);
    showToast("Saved ✓");
  } catch(err) { alert("Save failed: " + err.message); }
}

async function doDelete(rowIndex, sheetId, sheetName) {
  const t = _allTasks.find(t => t.rowIndex === rowIndex && t.sheetId === sheetId);
  if (!t || !confirm(`Delete task "${t.task}"?`)) return;
  try {
    await deleteRowProxy(sheetId, sheetName, rowIndex);
    await reloadMemberTasks(sheetId, sheetName, t.firstName);
  } catch(e) { alert("Delete failed: " + e.message); }
}

async function doAddTask() {
  const assignedTo = document.getElementById("nt-assignedTo").value;
  const task       = document.getElementById("nt-task").value;
  const dueDate    = document.getElementById("nt-dueDate").value;
  const priority   = document.getElementById("nt-priority").value;
  const status     = document.getElementById("nt-status").value;
  const notes      = document.getElementById("nt-notes").value;
  if (!assignedTo || !task) { alert("Assigned To and Task are required."); return; }
  const member = SESSION.memberRows.find(r => r[0] === assignedTo);
  if (!member) { alert("Member not found."); return; }
  const sheetId   = member[3];
  const sheetName = "Tasks_" + assignedTo.split(" ")[0];
  const memberTasks = _allTasks.filter(t => t.assignedTo === assignedTo);
  const taskId = nextTaskId(memberTasks.length ? memberTasks : _allTasks);
  try {
    await appendRow(sheetId, sheetName, [taskId, assignedTo, task, dueDate, priority, status, notes]);
    await reloadMemberTasks(sheetId, sheetName, assignedTo.split(" ")[0]);
  } catch(e) { alert("Failed to add task: " + e.message); }
}

// ── CALENDAR ───────────────────────────────────────────────────────────────────
function tabBarHTML() {
  return `<div style="display:flex;gap:4px;margin-bottom:24px;background:#fff;border-radius:10px;padding:4px;border:1px solid #d1fae5;width:fit-content;">` +
    [["tasks","Tasks"],["calendar","Calendar"]].map(([id,label]) => {
      const a = _activeTab === id;
      return `<button onclick="switchTab('${id}')" style="padding:7px 22px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;background:${a?"#1b4332":"transparent"};color:${a?"#fff":"#6b7280"};">${label}</button>`;
    }).join("") + `</div>`;
}

function switchTab(tab) { _activeTab = tab; render(); }

function rowsToEvents(rows) {
  if (rows.length < 2) return [];
  return rows.slice(1).map((r, i) => ({
    rowIndex: i + 2,
    eventId:    r[0] || "",
    memberName: r[1] || "",
    startDate:  r[2] || "",
    endDate:    r[3] || "",
    notes:      r[4] || ""
  })).filter(e => e.startDate && e.endDate);
}

function nextEventId(events) {
  const nums = events.map(e => parseInt((e.eventId||"").replace("VAC-",""), 10)).filter(n => !isNaN(n));
  return "VAC-" + String((nums.length ? Math.max(...nums) : 0) + 1).padStart(3, "0");
}

function memberColor(name) {
  const palette = ["#3b82f6","#f59e0b","#ef4444","#8b5cf6","#06b6d4","#ec4899","#10b981","#f97316"];
  let h = 0;
  for (const c of (name || "")) h = ((h << 5) - h + c.charCodeAt(0)) | 0;
  return palette[Math.abs(h) % palette.length];
}

function renderCalendar() {
  const role = SESSION.role;
  document.getElementById("app").innerHTML = shellHTML(role, SESSION.name, tabBarHTML() + `<div id="cal-main"><div class="spinner"></div></div>`);
  loadCalendarEvents();
}

async function loadCalendarEvents() {
  try {
    const rows = await readSheet(CALENDAR_SHEET_ID, CALENDAR_SHEET_NAME);
    _calEvents = rowsToEvents(rows);
    renderCalendarGrid();
  } catch(e) {
    const el = document.getElementById("cal-main");
    if (el) el.innerHTML = `<div style="color:#dc2626;padding:16px;">Failed to load calendar: ${e.message}</div>`;
  }
}

async function reloadCalendarEvents() {
  const rows = await readSheet(CALENDAR_SHEET_ID, CALENDAR_SHEET_NAME);
  _calEvents = rowsToEvents(rows);
  renderCalendarGrid();
}

function renderCalendarGrid() {
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DAYS   = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const year = _calYear, month = _calMonth;
  const firstDay    = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const td = new Date();
  const todayStr  = `${td.getFullYear()}-${String(td.getMonth()+1).padStart(2,"0")}-${String(td.getDate()).padStart(2,"0")}`;
  const mStart    = `${year}-${String(month+1).padStart(2,"0")}-01`;
  const mEnd      = `${year}-${String(month+1).padStart(2,"0")}-${String(daysInMonth).padStart(2,"0")}`;
  const monthEvts = _calEvents.filter(e => e.endDate >= mStart && e.startDate <= mEnd);

  const cells = Array(firstDay).fill(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const dayHeaders = DAYS.map(d =>
    `<div style="text-align:center;font-size:11px;font-weight:700;color:#9ca3af;padding:8px 4px;letter-spacing:0.5px;">${d}</div>`
  ).join("");

  const rowsHTML = [];
  for (let r = 0; r < cells.length; r += 7) {
    const rowCells = cells.slice(r, r+7).map(day => {
      if (!day) return `<div style="min-height:90px;background:#fafafa;border-right:1px solid #f3f4f6;"></div>`;
      const ds = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      const isToday = ds === todayStr;
      const dayEvts = monthEvts.filter(e => e.startDate <= ds && e.endDate >= ds);
      const chips = dayEvts.map(e => {
        const bg    = memberColor(e.memberName);
        const first = e.memberName.split(" ")[0];
        const label = (e.startDate === ds) ? (e.notes ? `${first} · ${e.notes}` : first) : first;
        return `<div onclick="event.stopPropagation();openCalEditModal(${e.rowIndex})"
          title="${e.memberName}: ${e.startDate} – ${e.endDate}${e.notes ? ' | '+e.notes : ''}"
          style="background:${bg};color:#fff;font-size:10px;font-weight:600;padding:2px 5px;border-radius:3px;margin-top:2px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${label}</div>`;
      }).join("");
      const bgNorm = isToday ? "#f0fdf4" : "#fff";
      const bgHov  = isToday ? "#d1fae5" : "#f9fafb";
      return `<div onclick="openCalAddModal('${ds}')"
        style="min-height:90px;padding:5px;border-right:1px solid #f3f4f6;background:${bgNorm};cursor:pointer;"
        onmouseover="this.style.background='${bgHov}'" onmouseout="this.style.background='${bgNorm}'">
        <div style="font-size:12px;font-weight:${isToday?700:500};width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;${isToday?"background:#1b4332;color:#fff;":"color:#374151;"}">${day}</div>
        ${chips}
      </div>`;
    }).join("");
    rowsHTML.push(`<div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid #f3f4f6;">${rowCells}</div>`);
  }

  const allNames = _calEvents.length
    ? [...new Set(_calEvents.map(e => e.memberName))].filter(Boolean)
    : (SESSION.role === "Manager" ? SESSION.memberRows.map(r => r[0]) : [SESSION.name]);
  const legend = allNames.length ? `
    <div style="display:flex;gap:14px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid #f3f4f6;">
      ${allNames.map(n => `<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:#6b7280;">
        <div style="width:10px;height:10px;border-radius:50%;background:${memberColor(n)};flex-shrink:0;"></div>${n.split(" ")[0]}
      </div>`).join("")}
    </div>` : "";

  const el = document.getElementById("cal-main");
  if (el) el.innerHTML = `
    <div style="background:#fff;border-radius:16px;border:1px solid #d1fae5;overflow:hidden;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #d1fae5;">
        <button onclick="calPrevMonth()" style="background:#f0fdf4;border:none;color:#1b4332;border-radius:8px;padding:6px 14px;font-size:20px;font-weight:700;cursor:pointer;line-height:1;">&#8249;</button>
        <div style="display:flex;align-items:center;gap:14px;">
          <span style="font-size:17px;font-weight:700;color:#1b4332;">${MONTHS[month]} ${year}</span>
          <button onclick="openCalAddModal(null)" style="background:#1b4332;color:#fff;font-size:12px;font-weight:600;padding:6px 14px;border-radius:8px;border:none;cursor:pointer;">+ Add Vacation</button>
        </div>
        <button onclick="calNextMonth()" style="background:#f0fdf4;border:none;color:#1b4332;border-radius:8px;padding:6px 14px;font-size:20px;font-weight:700;cursor:pointer;line-height:1;">&#8250;</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);background:#f9fafb;border-bottom:1px solid #f3f4f6;">${dayHeaders}</div>
      ${rowsHTML.join("")}
      ${legend}
    </div>`;
}

function calPrevMonth() {
  if (_calMonth === 0) { _calMonth = 11; _calYear--; } else _calMonth--;
  renderCalendarGrid();
}
function calNextMonth() {
  if (_calMonth === 11) { _calMonth = 0; _calYear++; } else _calMonth++;
  renderCalendarGrid();
}

function openCalAddModal(dateStr) {
  _calModal = { mode:"add", eventId:"", memberName: SESSION.role==="Member" ? SESSION.name : "", startDate: dateStr||"", endDate: dateStr||"", notes:"", rowIndex: null };
  renderCalModal();
}
function openCalEditModal(rowIndex) {
  const e = _calEvents.find(e => e.rowIndex === rowIndex);
  if (!e) return;
  _calModal = { mode:"edit", ...e };
  renderCalModal();
}

function renderCalModal() {
  const existing = document.getElementById("cal-modal");
  if (existing) existing.remove();
  const m = _calModal;
  if (!m) return;
  const isEdit       = m.mode === "edit";
  const canPickMember = SESSION.role === "Manager";
  const memberOpts   = canPickMember
    ? SESSION.memberRows.map(r => `<option value="${r[0]}"${r[0]===m.memberName?" selected":""}>${r[0]}</option>`).join("")
    : `<option value="${SESSION.name}">${SESSION.name}</option>`;

  document.body.insertAdjacentHTML("beforeend", `
    <div id="cal-modal" onclick="if(event.target===this)closeCalModal()"
      style="position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:1000;">
      <div onclick="event.stopPropagation()"
        style="background:#fff;border-radius:16px;padding:1.5rem 1.75rem;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.25);">
        <div style="font-size:15px;font-weight:700;color:#1b4332;margin-bottom:16px;">${isEdit?"Edit":"Add"} Vacation</div>

        <label style="font-size:11px;font-weight:700;color:#6b7280;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;">Member</label>
        <select id="cm-member" ${canPickMember?"":"disabled"}
          style="width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid #d1fae5;font-size:13px;margin-bottom:14px;background:${canPickMember?"#fff":"#f9fafb"};">${memberOpts}</select>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
          <div>
            <label style="font-size:11px;font-weight:700;color:#6b7280;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;">Start Date</label>
            <input id="cm-start" type="date" value="${m.startDate}"
              style="width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid #d1fae5;font-size:13px;"/>
          </div>
          <div>
            <label style="font-size:11px;font-weight:700;color:#6b7280;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;">End Date</label>
            <input id="cm-end" type="date" value="${m.endDate}"
              style="width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid #d1fae5;font-size:13px;"/>
          </div>
        </div>

        <label style="font-size:11px;font-weight:700;color:#6b7280;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;">Notes</label>
        <input id="cm-notes" value="${(m.notes||"").replace(/"/g,"&quot;")}" placeholder="e.g. Beach trip, Out of office…"
          style="width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid #d1fae5;font-size:13px;margin-bottom:18px;"/>

        <div style="display:flex;gap:8px;align-items:center;">
          ${isEdit?`<button onclick="doDeleteCalEvent(${m.rowIndex})" style="background:#fff1f2;color:#dc2626;font-size:12px;font-weight:600;padding:7px 14px;border-radius:8px;border:1px solid #fca5a5;cursor:pointer;">Delete</button>`:""}
          <div style="flex:1;"></div>
          <button onclick="closeCalModal()" style="background:#fff;color:#374151;font-size:12px;font-weight:600;padding:7px 16px;border-radius:8px;border:1.5px solid #e5e7eb;cursor:pointer;">Cancel</button>
          <button onclick="doSaveCalEvent()" style="background:#1b4332;color:#fff;font-size:12px;font-weight:600;padding:7px 16px;border-radius:8px;border:none;cursor:pointer;">Save</button>
        </div>
      </div>
    </div>`);
}

function closeCalModal() {
  _calModal = null;
  const el = document.getElementById("cal-modal");
  if (el) el.remove();
}

async function doSaveCalEvent() {
  const memberName = document.getElementById("cm-member").value;
  const startDate  = document.getElementById("cm-start").value;
  const endDate    = document.getElementById("cm-end").value;
  const notes      = document.getElementById("cm-notes").value;
  const m = _calModal;
  if (!memberName || !startDate || !endDate) { showToast("Member and dates are required."); return; }
  if (endDate < startDate) { showToast("End date cannot be before start date."); return; }
  try {
    if (m.mode === "add") {
      await appendRow(CALENDAR_SHEET_ID, CALENDAR_SHEET_NAME, [nextEventId(_calEvents), memberName, startDate, endDate, notes]);
    } else {
      await updateRow(CALENDAR_SHEET_ID, CALENDAR_SHEET_NAME, m.rowIndex, [m.eventId, memberName, startDate, endDate, notes]);
    }
    closeCalModal();
    await reloadCalendarEvents();
    showToast("Saved ✓");
  } catch(e) { alert("Save failed: " + e.message); }
}

async function doDeleteCalEvent(rowIndex) {
  if (!confirm("Delete this vacation?")) return;
  try {
    await deleteRowProxy(CALENDAR_SHEET_ID, CALENDAR_SHEET_NAME, rowIndex);
    closeCalModal();
    await reloadCalendarEvents();
    showToast("Deleted");
  } catch(e) { alert("Delete failed: " + e.message); }
}

// ── BOOT ───────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
