// ── CONTACTS ───────────────────────────────────────────────────────────────────
let _contacts           = [];
let _contactModal       = null;
let _contactsFilterTeam = "All";

function setContactsFilter(team) {
  _contactsFilterTeam = team;
  renderContactsView();
}
let _cDragId      = null;

function rowsToContacts(rows) {
  if (!rows || rows.length < 2) return [];
  return rows.slice(1).map((r, i) => ({
    rowIndex:    i + 2,
    contactId:   r[0] || "",
    team:        r[1] || "All",
    vendor:      r[2] || "",
    contactName: r[3] || "",
    phone:       r[4] || "",
    email:       r[5] || "",
    url:         r[6] || "",
    notes:       r[7] || "",
    _expanded:   false,
  })).filter(c => c.vendor || c.contactName);
}

function nextContactId(contacts) {
  const max = (contacts || []).reduce((m, c) => Math.max(m, parseInt((c.contactId || "").replace(/\D/g,""))||0), 0);
  return "C" + String(max + 1).padStart(3, "0");
}

function _contactSortOrder() {
  try { return JSON.parse(localStorage.getItem("tmgr_contacts_order") || "null"); } catch { return null; }
}
function _saveContactSortOrder(ids) {
  try { localStorage.setItem("tmgr_contacts_order", JSON.stringify(ids)); } catch {}
}

function _visibleContacts() {
  const isManager = SESSION.role === "Manager";
  let list = isManager ? [..._contacts] : _contacts.filter(c => {
    const ct = (c.team || "").split(",").map(t => t.trim());
    return ct.includes("All") || (SESSION.teams || []).some(t => ct.includes(t));
  });
  const order = _contactSortOrder();
  if (order && order.length) {
    const map = new Map(order.map((id, i) => [id, i]));
    list.sort((a, b) => (map.has(a.contactId) ? map.get(a.contactId) : 9999) - (map.has(b.contactId) ? map.get(b.contactId) : 9999));
  }
  return list;
}

function renderContacts() {
  document.getElementById("app").innerHTML = shellHTML(SESSION.role, SESSION.name,
    tabBarHTML() + `<div id="contacts-main"></div>`);
  if (_contactsLoaded) {
    renderContactsView();
    _bgRefreshContacts();
  } else {
    document.getElementById("contacts-main").innerHTML = `<div class="spinner"></div>`;
    loadContacts();
  }
}

async function loadContacts() {
  const cached = _sGet(CONTACTS_CACHE_KEY);
  if (cached) { _contacts = cached; _contactsLoaded = true; renderContactsView(); }
  try {
    const rows  = await readSheet(CALENDAR_SHEET_ID, CONTACTS_SHEET_NAME);
    const fresh = rowsToContacts(rows);
    _sSet(CONTACTS_CACHE_KEY, fresh);
    if (JSON.stringify(fresh) !== JSON.stringify(_contacts)) { _contacts = fresh; renderContactsView(); }
    _contactsLoaded = true;
  } catch(e) {
    if (!_contactsLoaded) {
      const el = document.getElementById("contacts-main");
      if (el) el.innerHTML = `<div style="color:#dc2626;padding:16px;">Failed to load contacts: ${e.message}</div>`;
    }
  }
}

async function _bgRefreshContacts() {
  try {
    const rows  = await readSheet(CALENDAR_SHEET_ID, CONTACTS_SHEET_NAME);
    const fresh = rowsToContacts(rows);
    const prev  = _sGet(CONTACTS_CACHE_KEY);
    _sSet(CONTACTS_CACHE_KEY, fresh);
    if (JSON.stringify(fresh) !== JSON.stringify(prev)) { _contacts = fresh; renderContactsView(); }
  } catch {}
}

function renderContactsView() {
  const el = document.getElementById("contacts-main");
  if (!el) return;
  const isManager = SESSION.role === "Manager";
  const allVisible = _visibleContacts();

  // unique teams across all accessible contacts
  const teamSet = [...new Set(allVisible.flatMap(c =>
    (c.team || "All").split(",").map(t => t.trim()).filter(t => t && t !== "All")
  ))].sort();
  const showChips = teamSet.length > 1;

  // apply active team filter
  const list = (showChips && _contactsFilterTeam !== "All")
    ? allVisible.filter(c => {
        const ct = (c.team || "All").split(",").map(t => t.trim());
        return ct.includes(_contactsFilterTeam) || ct.includes("All");
      })
    : allVisible;

  const addBtn = isManager
    ? `<button onclick="openAddContactModal()" style="background:#16a34a;color:#fff;font-size:13px;font-weight:600;padding:8px 18px;border-radius:10px;border:none;cursor:pointer;">+ Add Contact</button>`
    : "";

  const filterChips = showChips ? `
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;">
      ${[{t:"All",label:"All"}, ...teamSet.map(t=>({t,label:t}))].map(({t,label}) => {
        const active = _contactsFilterTeam === t;
        const tc = t === "All" ? {bg:"#1b4332",color:"#fff",border:"#1b4332"} : teamColor(t);
        const bg = active ? tc.bg : "#f9fafb";
        const fg = active ? tc.color : "#374151";
        const brd = active ? tc.border : "#e5e7eb";
        return `<button onclick="setContactsFilter('${t}')"
          style="padding:5px 14px;border-radius:999px;font-size:12px;font-weight:600;border:1.5px solid ${brd};background:${bg};color:${fg};cursor:pointer;">${label}</button>`;
      }).join("")}
    </div>` : "";

  const thS = "padding:10px 12px;font-weight:600;color:#1b4332;border-bottom:2px solid #d1fae5;text-align:left;white-space:nowrap;";
  const tableHTML = list.length === 0
    ? `<div style="padding:3rem;text-align:center;color:#9ca3af;font-size:14px;">No vendor contacts found.</div>`
    : `<div style="overflow-x:auto;"><table style="width:100%;font-size:13px;border-collapse:collapse;">
        <thead><tr style="background:#f0fdf4;">
          ${isManager ? `<th style="${thS}width:28px;"></th>` : ""}
          <th style="${thS}">Vendor</th>
          <th style="${thS}">Contact Name</th>
          <th style="${thS}">Team</th>
          <th style="${thS}">Phone</th>
          <th style="${thS}">Email</th>
          <th style="${thS}">URL</th>
          <th style="${thS}">Notes</th>
          ${isManager ? `<th style="${thS}width:100px;"></th>` : ""}
        </tr></thead>
        <tbody id="contacts-tbody">
          ${list.map((c, i) => _contactRowHTML(c, i, isManager)).join("")}
        </tbody>
      </table></div>`;

  el.innerHTML = `
    <div style="background:#fff;border-radius:16px;border:1px solid #d1fae5;padding:20px;margin:16px 0;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${showChips?"10":"16"}px;">
        <div>
          <span style="font-size:16px;font-weight:700;color:#1b4332;">Vendor Contacts</span>
          <span style="margin-left:10px;font-size:12px;color:#9ca3af;">${list.length} contact${list.length!==1?"s":""}</span>
        </div>
        ${addBtn}
      </div>
      ${filterChips}
      ${tableHTML}
    </div>`;
}

function _contactRowHTML(c, idx, isManager) {
  const bg  = idx % 2 === 0 ? "#fff" : "#fafafa";
  const td  = "padding:10px 12px;vertical-align:middle;border-bottom:1px solid #f0fdf4;";

  const drag = isManager
    ? `<td style="${td}cursor:grab;color:#d1d5db;text-align:center;user-select:none;"
         draggable="true"
         ondragstart="_cDragStart(event,'${c.contactId}')"
         ondragover="event.preventDefault();event.currentTarget.closest('tr').style.outline='2px solid #16a34a'"
         ondragleave="event.currentTarget.closest('tr').style.outline=''"
         ondrop="_cDrop(event,'${c.contactId}')">⠿</td>`
    : "";

  const phone = c.phone
    ? `<a href="tel:${escHtml(c.phone)}" style="color:#374151;text-decoration:none;white-space:nowrap;">${escHtml(c.phone)}</a>`
    : `<span style="color:#d1d5db;">—</span>`;

  const email = c.email
    ? `<a href="mailto:${escHtml(c.email)}" style="color:#1d4ed8;">${escHtml(c.email)}</a>`
    : `<span style="color:#d1d5db;">—</span>`;

  const urlShort = c.url ? c.url.replace(/^https?:\/\//,"").substring(0,28) + (c.url.length>35?"…":"") : "";
  const urlCell = `<div style="display:flex;align-items:center;gap:4px;flex-wrap:nowrap;">
    ${isManager ? `<button onclick="openUrlEditPopup('${c.contactId}')" title="Edit URL"
      style="background:none;border:none;cursor:pointer;font-size:14px;padding:2px 4px;color:#6b7280;line-height:1;">✏</button>` : ""}
    ${c.url ? `<a href="${escHtml(normalizeUrl(c.url))}" target="_blank" rel="noopener" title="Open in new window"
      style="font-size:15px;text-decoration:none;color:#16a34a;padding:2px 4px;line-height:1;">↗</a>
      <span style="font-size:11px;color:#6b7280;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
        title="${escHtml(c.url)}">${escHtml(urlShort)}</span>`
      : `<span style="color:#d1d5db;font-size:12px;">—</span>`}
  </div>`;

  const notesLong = c.notes.length > 60;
  const notesTxt  = (!c._expanded && notesLong) ? escHtml(c.notes.substring(0,60))+"…" : escHtml(c.notes);
  const notesCell = c.notes
    ? `<span>${notesTxt}</span>${notesLong
        ? `<button onclick="_toggleContactNotes('${c.contactId}')"
             style="background:none;border:none;cursor:pointer;font-size:11px;color:#16a34a;margin-left:4px;padding:0;white-space:nowrap;">
             ${c._expanded ? "▲ less" : "▼ more"}</button>` : ""}`
    : `<span style="color:#d1d5db;">—</span>`;

  const actions = isManager
    ? `<td style="${td}white-space:nowrap;">
        <button onclick="openEditContactModal('${c.contactId}')"
          style="font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid #d1fae5;background:#f0fdf4;color:#166534;cursor:pointer;margin-right:4px;">Edit</button>
        <button onclick="doDeleteContact('${c.contactId}',${c.rowIndex})"
          style="font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid #fca5a5;background:#fff1f2;color:#dc2626;cursor:pointer;">Del</button>
      </td>` : "";

  const tc = teamColor(c.team);
  const teamBadge = c.team
    ? `<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:${tc.bg};color:${tc.color};border:1px solid ${tc.border};">${escHtml(c.team)}</span>`
    : `<span style="color:#d1d5db;">—</span>`;

  return `<tr style="background:${bg};" data-contact-id="${c.contactId}">
    ${drag}
    <td style="${td}font-weight:600;color:#1b4332;">${escHtml(c.vendor)}</td>
    <td style="${td}">${escHtml(c.contactName)}</td>
    <td style="${td}">${teamBadge}</td>
    <td style="${td}">${phone}</td>
    <td style="${td}">${email}</td>
    <td style="${td}">${urlCell}</td>
    <td style="${td}max-width:200px;">${notesCell}</td>
    ${actions}
  </tr>`;
}

// Drag-and-drop reorder
function _cDragStart(event, contactId) {
  _cDragId = contactId;
  event.dataTransfer.effectAllowed = "move";
  event.stopPropagation();
}
function _cDrop(event, targetId) {
  event.preventDefault();
  event.currentTarget.closest("tr").style.outline = "";
  if (!_cDragId || _cDragId === targetId) { _cDragId = null; return; }
  const fi = _contacts.findIndex(c => c.contactId === _cDragId);
  const ti = _contacts.findIndex(c => c.contactId === targetId);
  if (fi === -1 || ti === -1) { _cDragId = null; return; }
  const [moved] = _contacts.splice(fi, 1);
  _contacts.splice(ti, 0, moved);
  _saveContactSortOrder(_contacts.map(c => c.contactId));
  _cDragId = null;
  const tbody = document.getElementById("contacts-tbody");
  if (tbody) {
    const isManager = SESSION.role === "Manager";
    tbody.innerHTML = _visibleContacts().map((c, i) => _contactRowHTML(c, i, isManager)).join("");
  }
}

// Expandable notes
function _toggleContactNotes(contactId) {
  const c = _contacts.find(x => x.contactId === contactId);
  if (!c) return;
  c._expanded = !c._expanded;
  const isManager = SESSION.role === "Manager";
  const row = document.querySelector(`[data-contact-id="${contactId}"]`);
  if (row) row.outerHTML = _contactRowHTML(c, _visibleContacts().findIndex(x => x.contactId === contactId), isManager);
}

function _cmTeamAllToggle() {
  const allCb = document.getElementById("cmt-all");
  document.querySelectorAll(".cmt-team").forEach(cb => {
    cb.disabled = allCb.checked;
    if (allCb.checked) cb.checked = false;
  });
}

function _closeContactModal() {
  document.getElementById("_contact-modal")?.remove();
  _contactModal = null;
}

async function doSaveContact(isEdit, contactId) {
  const allChecked = document.getElementById("cmt-all")?.checked;
  const teamVals   = allChecked
    ? ["All"]
    : [...document.querySelectorAll(".cmt-team:checked")].map(cb => cb.value);
  const team   = teamVals.length ? teamVals.join(", ") : "All";
  const vendor = (document.getElementById("cm-vendor")?.value || "").trim();
  const cname  = (document.getElementById("cm-cname")?.value  || "").trim();
  const phone  = (document.getElementById("cm-phone")?.value  || "").trim();
  const email  = (document.getElementById("cm-email")?.value  || "").trim();
  const url    = (document.getElementById("cm-url")?.value    || "").trim();
  const notes  = (document.getElementById("cm-notes")?.value  || "").trim();

  if (!vendor) { alert("Vendor name is required."); return; }
  _closeContactModal();

  try {
    if (isEdit) {
      const c = _contacts.find(x => x.contactId === contactId);
      await updateRow(CALENDAR_SHEET_ID, CONTACTS_SHEET_NAME, c.rowIndex,
        [c.contactId, team, vendor, cname, phone, email, url, notes]);
    } else {
      const newId = nextContactId(_contacts);
      await appendRow(CALENDAR_SHEET_ID, CONTACTS_SHEET_NAME, [newId, team, vendor, cname, phone, email, url, notes]);
    }
    _sDel(CONTACTS_CACHE_KEY); _contactsLoaded = false;
    await loadContacts();
    showToast(isEdit ? "Contact updated ✓" : "Contact added ✓");
  } catch(e) { alert("Save failed: " + e.message); }
}

async function doDeleteContact(contactId, rowIndex) {
  if (!confirm("Delete this contact?")) return;
  try {
    await deleteRowProxy(CALENDAR_SHEET_ID, CONTACTS_SHEET_NAME, rowIndex);
    _contacts = _contacts.filter(c => c.contactId !== contactId);
    renderContactsView();
    _sDel(CONTACTS_CACHE_KEY); _contactsLoaded = false;
    loadContacts();
    showToast("Contact deleted ✓");
  } catch(e) { alert("Delete failed: " + e.message); }
}

// ── COMMENTS ───────────────────────────────────────────────────────────────────
let _comments     = [];
let _commentModal = null;

function rowsToComments(rows) {
  if (!rows || rows.length < 2) return [];
  return rows.slice(1).map((r, i) => ({
    rowIndex:  i + 2,
    commentId: r[0] || "",
    taskId:    r[1] || "",
    author:    r[2] || "",
    timestamp: r[3] || "",
    text:      r[4] || "",
  })).filter(c => c.taskId && c.text);
}

function nextCommentId() {
  const max = _comments.reduce((m, c) => Math.max(m, parseInt((c.commentId||"").replace(/\D/g,""))||0), 0);
  return "CM" + String(max + 1).padStart(4, "0");
}

function _commentCount(taskId) {
  return _comments.filter(c => c.taskId === taskId).length;
}

function _initials(name) {
  return (name||"?").split(" ").map(w => w[0]).join("").substring(0, 2).toUpperCase();
}

function _authorColor(name) {
  const colors = ["#1b4332","#1e40af","#7c3aed","#b45309","#0f766e","#9d174d"];
  return colors[(name||"").charCodeAt(0) % colors.length];
}

async function loadComments() {
  const cached = _sGet(COMMENTS_CACHE_KEY);
  if (cached) { _comments = cached; _commentsLoaded = true; _refreshAllCommentBadges(); }
  try {
    const rows  = await readSheet(CALENDAR_SHEET_ID, COMMENTS_SHEET_NAME);
    const fresh = rowsToComments(rows);
    _sSet(COMMENTS_CACHE_KEY, fresh);
    _comments = fresh;
    _commentsLoaded = true;
    _refreshAllCommentBadges();
  } catch { _commentsLoaded = true; }
}

function _refreshAllCommentBadges() {
  const seen = new Set();
  _comments.forEach(c => {
    if (!seen.has(c.taskId)) { seen.add(c.taskId); _updateCommentBadge(c.taskId); }
  });
}

async function _bgRefreshComments() {
  try {
    const rows  = await readSheet(CALENDAR_SHEET_ID, COMMENTS_SHEET_NAME);
    const fresh = rowsToComments(rows);
    _sSet(COMMENTS_CACHE_KEY, fresh);
    _comments = fresh;
    if (_commentModal) {
      const taskId = _commentModal.dataset?.taskId;
      if (taskId) _refreshCommentsThread(taskId);
    }
  } catch {}
}

function _commentBtnHTML(taskId) {
  const count = _commentCount(taskId);
  return `<span id="cm-${taskId}"><button onclick="openCommentsModal('${taskId}')" title="View / add comments"
    style="background:${count>0?"#eff6ff":"#f9fafb"};color:${count>0?"#1d4ed8":"#6b7280"};font-size:11px;
           font-weight:600;padding:5px 10px;border-radius:6px;
           border:1px solid ${count>0?"#bfdbfe":"#e5e7eb"};cursor:pointer;white-space:nowrap;">
    💬${count>0?` ${count}`:""}
  </button></span>`;
}

function _updateCommentBadge(taskId) {
  const el = document.getElementById(`cm-${taskId}`);
  if (!el) return;
  const count = _commentCount(taskId);
  const btn = el.querySelector("button");
  if (!btn) return;
  btn.textContent = `💬${count > 0 ? ` ${count}` : ""}`;
  btn.style.background   = count > 0 ? "#eff6ff" : "#f9fafb";
  btn.style.color        = count > 0 ? "#1d4ed8" : "#6b7280";
  btn.style.borderColor  = count > 0 ? "#bfdbfe" : "#e5e7eb";
}

function _commentsThreadHTML(taskId) {
  const list = _comments.filter(c => c.taskId === taskId).sort((a, b) => {
    const da = new Date(a.timestamp), db = new Date(b.timestamp);
    return isNaN(da) || isNaN(db) ? 0 : db - da;
  });
  if (!list.length) return `<div style="text-align:center;color:#9ca3af;padding:32px 0;font-size:13px;">No comments yet. Be the first!</div>`;
  return list.map(c => {
    const isOwn = SESSION && SESSION.name === c.author;
    return `
    <div id="cm-row-${c.commentId}" style="display:flex;gap:10px;margin-bottom:16px;">
      <div style="flex-shrink:0;width:34px;height:34px;border-radius:999px;background:${_authorColor(c.author)};
           color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;">
        ${_initials(c.author)}
      </div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;">
          <span style="font-size:13px;font-weight:600;color:#1b4332;">${escHtml(c.author)}</span>
          <span style="font-size:11px;color:#9ca3af;">${formatTimestamp(c.timestamp)}</span>
          ${isOwn ? `
            <button onclick="doEditComment('${c.commentId}','${taskId}')"
              style="background:none;border:none;cursor:pointer;font-size:11px;color:#6b7280;padding:0 4px;
                     line-height:1;text-decoration:underline;text-underline-offset:2px;">Edit</button>
            <button onclick="doDeleteComment('${c.commentId}','${taskId}')"
              style="background:none;border:none;cursor:pointer;font-size:11px;color:#dc2626;padding:0 4px;
                     line-height:1;text-decoration:underline;text-underline-offset:2px;">Delete</button>
          ` : ""}
        </div>
        <div id="cm-text-${c.commentId}" style="font-size:13px;color:#374151;line-height:1.55;background:#f9fafb;border-radius:10px;
             padding:9px 13px;border:1px solid #f0fdf4;white-space:pre-wrap;word-break:break-word;">
          ${escHtml(c.text)}
        </div>
      </div>
    </div>`;
  }).join("");
}

        </div>
      </div>

}

function _refreshCommentsThread(taskId) {
  const el = document.getElementById("_cm-thread");
  if (!el) return;

function _closeCommentsModal() {

               border-radius:7px;border:none;cursor:pointer;">Save</button>
      <button onclick="_refreshCommentsThread('${taskId}')"
        style="background:#f3f4f6;color:#374151;font-size:12px;font-weight:600;padding:5px 14px;
               border-radius:7px;border:none;cursor:pointer;">Cancel</button>
    </div>`;
  document.getElementById(`cm-edit-input-${commentId}`)?.focus();
}

async function doSaveComment(commentId, taskId) {
  const input = document.getElementById(`cm-edit-input-${commentId}`);
  const newText = (input?.value || "").trim();
  if (!newText) return;
  const c = _comments.find(x => x.commentId === commentId);
  if (!c) return;
  c.text = newText;
  _sSet(COMMENTS_CACHE_KEY, _comments);
  _refreshCommentsThread(taskId);
  try {
    await updateRow(CALENDAR_SHEET_ID, COMMENTS_SHEET_NAME, c.rowIndex, [c.commentId, c.taskId, c.author, c.timestamp, newText]);
  } catch(e) {
    alert("Failed to save edit: " + e.message);
    loadComments();
  }
}

async function doDeleteComment(commentId, taskId) {
  if (!confirm("Delete this comment?")) return;
  const c = _comments.find(x => x.commentId === commentId);
  if (!c) return;
  _comments = _comments.filter(x => x.commentId !== commentId);
  _sSet(COMMENTS_CACHE_KEY, _comments);
  _refreshCommentsThread(taskId);
  _updateCommentBadge(taskId);
  try {
    await deleteRowProxy(CALENDAR_SHEET_ID, COMMENTS_SHEET_NAME, c.rowIndex);
    const rows = await readSheet(CALENDAR_SHEET_ID, COMMENTS_SHEET_NAME);
    _comments = rowsToComments(rows);
    _sSet(COMMENTS_CACHE_KEY, _comments);
    _refreshCommentsThread(taskId);
    _updateCommentBadge(taskId);
  } catch(e) {
    alert("Delete failed: " + e.message);
    loadComments();
  }
}

async function doAddComment(taskId) {
  const input   = document.getElementById("_cm-input");
  const sendBtn = document.getElementById("_cm-send");
  const text    = (input?.value || "").trim();
  if (!text) return;

  if (input)   { input.disabled = true; }
  if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = "…"; }

  try {
    const now = new Date();
    const ts  = `${now.toLocaleDateString("en-US")} ${now.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}`;
    const id  = nextCommentId();
    await appendRow(CALENDAR_SHEET_ID, COMMENTS_SHEET_NAME, [id, taskId, SESSION.name, ts, text]);

    _comments.push({ rowIndex: _comments.length + 2, commentId: id, taskId, author: SESSION.name, timestamp: ts, text });
    _sSet(COMMENTS_CACHE_KEY, _comments);

    if (input)   { input.value = ""; input.disabled = false; input.focus(); }
    if (sendBtn) { sendBtn.disabled = false; sendBtn.textContent = "Send"; }

    _refreshCommentsThread(taskId);
    _updateCommentBadge(taskId);
  } catch(e) {
    if (input)   { input.disabled = false; }
    if (sendBtn) { sendBtn.disabled = false; sendBtn.textContent = "Send"; }
    alert("Failed to save comment: " + e.message);
  }
}

// ── TEAMS ──────────────────────────────────────────────────────────────────────
function rowsToTeams(rows) {
  if (!rows || rows.length < 2) return [];
  return rows.slice(1).map((r, i) => ({ rowIndex: i + 2, teamId: r[0]||"", teamName: r[1]||"" })).filter(t => t.teamName);
}

async function loadTeams() {
  const cached = _sGet(TEAMS_CACHE_KEY);
  if (cached) { _teamsList = cached; _teamsLoaded = true; }
  try {
    const rows = await readSheet(CALENDAR_SHEET_ID, TEAMS_SHEET_NAME);
    _teamsList  = rowsToTeams(rows);
    _sSet(TEAMS_CACHE_KEY, _teamsList);
    _teamsLoaded = true;
  } catch { _teamsLoaded = true; }
}

// Central helper — always use this instead of deriving team names ad-hoc
function getTeamNames() {
  if (_teamsList.length > 0) return _teamsList.map(t => t.teamName);
  // Fallback: derive from Config rows (backward compatible if Teams sheet not set up yet)
  return [...new Set((window._configRows||[]).flatMap(r => (r[6]||"").split(",").map(t=>t.trim()).filter(Boolean)))].sort();
}

  const teams = getTeamNames();
  // Teams that exist in Config but not yet saved to Teams sheet

    return `
      <tr style="border-bottom:1px solid #f0fdf4;">

        <td style="padding:10px 14px;font-size:13px;color:#6b7280;">${memberCount} member${memberCount!==1?"s":""}</td>
        <td style="padding:10px 14px;">
          ${t ? `<button onclick="doDeleteTeam('${safeName}')"

        </td>

  return `
    <div style="background:#fff;border-radius:14px;border:1px solid #e5e7eb;padding:20px;margin-bottom:24px;">

      </div>
      ${importBanner}
      ${teams.length ? `
      <table style="width:100%;border-collapse:collapse;margin-bottom:14px;">
        <thead><tr style="background:#f9fafb;border-bottom:2px solid #d1fae5;">
          <th style="padding:8px 14px;text-align:left;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.05em;">Team Name</th>
          <th style="padding:8px 14px;text-align:left;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.05em;">Members</th>
          <th style="padding:8px 14px;"></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>` : `<div style="color:#9ca3af;font-size:13px;margin-bottom:14px;">No teams yet. Add your first team below.</div>`}

        <input id="new-team-name" placeholder="Team name (e.g. Peoplesoft)" maxlength="50"

          style="background:#1b4332;color:#fff;font-size:13px;font-weight:600;padding:8px 18px;border-radius:8px;border:none;cursor:pointer;white-space:nowrap;">+ Add Team</button>

async function doAddTeam() {
  const input = document.getElementById("new-team-name");
  const name  = (input?.value||"").trim();
  if (!name) { showToast("Enter a team name."); return; }
  if (getTeamNames().map(n=>n.toLowerCase()).includes(name.toLowerCase())) { showToast("Team already exists."); return; }
  const maxId = _teamsList.reduce((m, t) => Math.max(m, parseInt((t.teamId||"").replace(/\D/g,""))||0), 0);
  const id = "TM" + String(maxId + 1).padStart(4, "0");
  _teamsList.push({ rowIndex: 0, teamId: id, teamName: name });
  _sSet(TEAMS_CACHE_KEY, _teamsList);
  if (input) input.value = "";
  renderActivityTable(_sGet(ACT_CACHE_KEY)||[]);
  try {
    await appendRow(CALENDAR_SHEET_ID, TEAMS_SHEET_NAME, [id, name]);
    const rows = await readSheet(CALENDAR_SHEET_ID, TEAMS_SHEET_NAME);
    _teamsList = rowsToTeams(rows);
    _sSet(TEAMS_CACHE_KEY, _teamsList);
  } catch(e) {
    _teamsList = _teamsList.filter(t => t.teamId !== id);
    _sSet(TEAMS_CACHE_KEY, _teamsList);
    alert("Failed to add team: " + e.message);
  }
}

async function doDeleteTeam(name) {
  const memberCount = (window._configRows||[]).filter(r => (r[6]||"").split(",").map(t=>t.trim()).includes(name)).length;
  const warn = memberCount > 0 ? `\n\nWarning: ${memberCount} member(s) are currently assigned to this team.` : "";
  if (!confirm(`Remove team "${name}"?${warn}`)) return;
  const t = _teamsList.find(x => x.teamName === name);
  if (!t) return;
  _teamsList = _teamsList.filter(x => x.teamName !== name);
  _sSet(TEAMS_CACHE_KEY, _teamsList);
  renderActivityTable(_sGet(ACT_CACHE_KEY)||[]);
  try {
    await deleteRowProxy(CALENDAR_SHEET_ID, TEAMS_SHEET_NAME, t.rowIndex);
    const rows = await readSheet(CALENDAR_SHEET_ID, TEAMS_SHEET_NAME);
    _teamsList = rowsToTeams(rows);
    _sSet(TEAMS_CACHE_KEY, _teamsList);
  } catch(e) { alert("Delete failed: " + e.message); loadTeams(); }
}

async function doImportTeamsFromConfig() {
  const toImport = [...new Set((window._configRows||[]).flatMap(r => (r[6]||"").split(",").map(t=>t.trim()).filter(Boolean)))]
    .filter(n => !_teamsList.some(t => t.teamName === n))
    .sort();
  if (!toImport.length) { showToast("All existing teams are already in the master list."); return; }
  showToast(`Importing ${toImport.length} team${toImport.length!==1?"s":""}…`);
  let maxId = _teamsList.reduce((m, t) => Math.max(m, parseInt((t.teamId||"").replace(/\D/g,""))||0), 0);
  const newTeams = toImport.map(name => { maxId++; return { rowIndex: 0, teamId: "TM"+String(maxId).padStart(4,"0"), teamName: name }; });
  _teamsList.push(...newTeams);
  _sSet(TEAMS_CACHE_KEY, _teamsList);
  renderActivityTable(_sGet(ACT_CACHE_KEY)||[]);
  try {
    for (const t of newTeams) {
      await appendRow(CALENDAR_SHEET_ID, TEAMS_SHEET_NAME, [t.teamId, t.teamName]);
    }
    const rows = await readSheet(CALENDAR_SHEET_ID, TEAMS_SHEET_NAME);
    _teamsList = rowsToTeams(rows);
    _sSet(TEAMS_CACHE_KEY, _teamsList);
    renderActivityTable(_sGet(ACT_CACHE_KEY)||[]);
    showToast(`Imported: ${toImport.join(", ")} ✓`);
  } catch(e) {
    alert("Import failed: " + e.message);
    loadTeams();
  }
}

// ── ONBOARDING ─────────────────────────────────────────────────────────────────
function rowsToObTemplate(rows) {
  if (!rows || rows.length < 2) return [];
  return rows.slice(1).map((r, i) => ({
    rowIndex: i + 2, templateId: r[0]||"", team: r[1]||"", category: r[2]||"", item: r[3]||""
  })).filter(t => t.item);
}

function rowsToObStatus(rows) {
  if (!rows || rows.length < 2) return [];
  return rows.slice(1).map((r, i) => ({
    rowIndex: i + 2, statusId: r[0]||"", memberName: r[1]||"", team: r[2]||"",
    templateId: r[3]||"", category: r[4]||"", item: r[5]||"",
    status: r[6]||"Pending", completedDate: r[7]||""
  })).filter(s => s.memberName && s.item);
}

async function loadOnboarding() {
  const ct = _sGet(ONBOARDING_TMPL_KEY), cs = _sGet(ONBOARDING_STATUS_KEY);
  if (ct) _obTemplate = ct;
  if (cs) _obStatus   = cs;
  if (ct && cs) _obLoaded = true;
  try {
    const [tr, sr] = await Promise.all([
      readSheet(CALENDAR_SHEET_ID, ONBOARDING_TMPL_SHEET),
      readSheet(CALENDAR_SHEET_ID, ONBOARDING_STATUS_SHEET),
    ]);
    _obTemplate = rowsToObTemplate(tr);
    _obStatus   = rowsToObStatus(sr);
    _sSet(ONBOARDING_TMPL_KEY, _obTemplate);
    _sSet(ONBOARDING_STATUS_KEY, _obStatus);
    _obLoaded = true;
  } catch { _obLoaded = true; }
}

function renderOnboarding() {
  document.getElementById("app").innerHTML = shellHTML("Manager", SESSION.name, tabBarHTML() + `<div id="ob-main"></div>`);
  if (!_obLoaded) {
    document.getElementById("ob-main").innerHTML = `<div class="spinner"></div>`;
    loadOnboarding().then(_renderObContent);
  } else {
    _renderObContent();
    loadOnboarding().then(_renderObContent); // background refresh
  }
}

async function obToggleItem(statusId, memberName) {
  const s = _obStatus.find(x => x.statusId === statusId);
  if (!s) return;
  const newStatus = s.status === "Done" ? "Pending" : "Done";
  const now = new Date();
  const completedDate = newStatus === "Done"
    ? now.toLocaleDateString("en-US") : "";
  s.status = newStatus; s.completedDate = completedDate;
  _sSet(ONBOARDING_STATUS_KEY, _obStatus);
  const panel = document.getElementById("ob-right-panel");
  if (panel) panel.innerHTML = _renderObMemberChecklist(memberName);
  try {
    await updateRow(CALENDAR_SHEET_ID, ONBOARDING_STATUS_SHEET, s.rowIndex,
      [s.statusId, s.memberName, s.team, s.templateId, s.category, s.item, newStatus, completedDate]);
  } catch(e) {
    s.status = newStatus === "Done" ? "Pending" : "Done"; s.completedDate = "";
    _sSet(ONBOARDING_STATUS_KEY, _obStatus);
    showToast("Update failed: " + e.message);
  }
}

async function obInitializeMember(memberName) {
  const mc = (window._configRows||[]).find(r => r[0] === memberName);
  const memberTeams = (mc?.[6]||"").split(",").map(t=>t.trim()).filter(Boolean);
  const existing = new Set(_obStatus.filter(s => s.memberName === memberName).map(s => s.templateId));
  const toAdd = _obTemplate.filter(t => memberTeams.includes(t.team) && !existing.has(t.templateId));
  if (!toAdd.length) { showToast("All template items are already in this member's checklist."); return; }
  let maxId = _obStatus.reduce((m, s) => Math.max(m, parseInt((s.statusId||"").replace(/\D/g,""))||0), 0);
  const newItems = toAdd.map(t => {
    maxId++;
    return { rowIndex: 0, statusId: "OS"+String(maxId).padStart(4,"0"), memberName, team: t.team,
      templateId: t.templateId, category: t.category, item: t.item, status: "Pending", completedDate: "" };
  });
  _obStatus.push(...newItems);
  _sSet(ONBOARDING_STATUS_KEY, _obStatus);
  const panel = document.getElementById("ob-right-panel");
  if (panel) panel.innerHTML = _renderObMemberChecklist(memberName);
  showToast(`Adding ${newItems.length} item${newItems.length!==1?"s":""}…`);
  try {
    for (const item of newItems) {
      await appendRow(CALENDAR_SHEET_ID, ONBOARDING_STATUS_SHEET,
        [item.statusId, item.memberName, item.team, item.templateId, item.category, item.item, "Pending", ""]);
    }
    const rows = await readSheet(CALENDAR_SHEET_ID, ONBOARDING_STATUS_SHEET);
    _obStatus = rowsToObStatus(rows);
    _sSet(ONBOARDING_STATUS_KEY, _obStatus);
    if (panel) panel.innerHTML = _renderObMemberChecklist(memberName);
    showToast(`${newItems.length} item${newItems.length!==1?"s":""} added ✓`);
  } catch(e) {
    const ids = new Set(newItems.map(i => i.statusId));
    _obStatus = _obStatus.filter(s => !ids.has(s.statusId));
    _sSet(ONBOARDING_STATUS_KEY, _obStatus);
    if (panel) panel.innerHTML = _renderObMemberChecklist(memberName);
    alert("Failed to initialize: " + e.message);
  }
}

async function obSaveCustomItem(memberName) {
  const catEl  = document.getElementById("ob-add-cat");
  const itemEl = document.getElementById("ob-add-item");
  const cat  = (catEl?.value||"").trim();
  const item = (itemEl?.value||"").trim();
  if (!cat || !item) { showToast("Category and item are required."); return; }
  const mc = (window._configRows||[]).find(r => r[0] === memberName);
  const team = (mc?.[6]||"").split(",")[0]?.trim()||"";
  const maxId = _obStatus.reduce((m, s) => Math.max(m, parseInt((s.statusId||"").replace(/\D/g,""))||0), 0);
  const id = "OS" + String(maxId + 1).padStart(4, "0");
  const newItem = { rowIndex: 0, statusId: id, memberName, team, templateId: "custom", category: cat, item, status: "Pending", completedDate: "" };
  _obStatus.push(newItem);
  _sSet(ONBOARDING_STATUS_KEY, _obStatus);
  const panel = document.getElementById("ob-right-panel");
  if (panel) panel.innerHTML = _renderObMemberChecklist(memberName);
  try {
    await appendRow(CALENDAR_SHEET_ID, ONBOARDING_STATUS_SHEET, [id, memberName, team, "custom", cat, item, "Pending", ""]);
    const rows = await readSheet(CALENDAR_SHEET_ID, ONBOARDING_STATUS_SHEET);
    _obStatus = rowsToObStatus(rows);
    _sSet(ONBOARDING_STATUS_KEY, _obStatus);
    if (document.getElementById("ob-right-panel")) document.getElementById("ob-right-panel").innerHTML = _renderObMemberChecklist(memberName);
  } catch(e) {
    _obStatus = _obStatus.filter(s => s.statusId !== id);
    _sSet(ONBOARDING_STATUS_KEY, _obStatus);
    if (panel) panel.innerHTML = _renderObMemberChecklist(memberName);
    alert("Failed to save: " + e.message);
  }
}

async function obDeleteStatusItem(statusId, memberName) {
  const s = _obStatus.find(x => x.statusId === statusId);
  if (!s || !confirm(`Remove "${s.item}" from ${memberName.split(" ")[0]}'s checklist?`)) return;
  _obStatus = _obStatus.filter(x => x.statusId !== statusId);
  _sSet(ONBOARDING_STATUS_KEY, _obStatus);
  const panel = document.getElementById("ob-right-panel");
  if (panel) panel.innerHTML = _renderObMemberChecklist(memberName);
  try {
    await deleteRowProxy(CALENDAR_SHEET_ID, ONBOARDING_STATUS_SHEET, s.rowIndex);
    const rows = await readSheet(CALENDAR_SHEET_ID, ONBOARDING_STATUS_SHEET);
    _obStatus = rowsToObStatus(rows);
    _sSet(ONBOARDING_STATUS_KEY, _obStatus);
  } catch(e) { alert("Delete failed: " + e.message); loadOnboarding(); }
}

async function obAddTemplateItem() {
  const cat  = (document.getElementById("ob-new-cat")?.value||"").trim();
  const item = (document.getElementById("ob-new-item")?.value||"").trim();
  if (!cat || !item) { showToast("Category and item are required."); return; }
  if (!_obActiveTeam)  { showToast("Select a team first."); return; }
  const maxId = _obTemplate.reduce((m, t) => Math.max(m, parseInt((t.templateId||"").replace(/\D/g,""))||0), 0);
  const id = "OT" + String(maxId + 1).padStart(4, "0");
  const newItem = { rowIndex: 0, templateId: id, team: _obActiveTeam, category: cat, item };
  _obTemplate.push(newItem);
  _sSet(ONBOARDING_TMPL_KEY, _obTemplate);
  _renderObContent();
  try {
    await appendRow(CALENDAR_SHEET_ID, ONBOARDING_TMPL_SHEET, [id, _obActiveTeam, cat, item]);
    const rows = await readSheet(CALENDAR_SHEET_ID, ONBOARDING_TMPL_SHEET);
    _obTemplate = rowsToObTemplate(rows);
    _sSet(ONBOARDING_TMPL_KEY, _obTemplate);
  } catch(e) {
    _obTemplate = _obTemplate.filter(t => t.templateId !== id);
    _sSet(ONBOARDING_TMPL_KEY, _obTemplate);
    _renderObContent();
    alert("Failed to add: " + e.message);
  }
}

async function obDeleteTemplate(templateId) {
  const t = _obTemplate.find(x => x.templateId === templateId);
  if (!t || !confirm(`Delete template item "${t.item}"?`)) return;
  _obTemplate = _obTemplate.filter(x => x.templateId !== templateId);
  _sSet(ONBOARDING_TMPL_KEY, _obTemplate);
  _renderObContent();
  try {
    await deleteRowProxy(CALENDAR_SHEET_ID, ONBOARDING_TMPL_SHEET, t.rowIndex);
    const rows = await readSheet(CALENDAR_SHEET_ID, ONBOARDING_TMPL_SHEET);
    _obTemplate = rowsToObTemplate(rows);
    _sSet(ONBOARDING_TMPL_KEY, _obTemplate);
  } catch(e) {
    alert("Delete failed: " + e.message);
    loadOnboarding();
  }
}

// ── TEAM EVENTS CALENDAR ───────────────────────────────────────────────────────
function rowsToTeamEvents(rows) {
  if (rows.length < 2) return [];
  return rows.slice(1).map((r, i) => ({
    rowIndex: i + 2,
    eventId:  r[0] || "",
    team:     r[1] || "",
    title:    r[2] || "",
    startDate: normDate(r[3]),
    endDate:   normDate(r[4]),
    desc:     r[5] || ""
  })).filter(e => e.team && e.title && e.startDate && e.endDate);
}

function nextTeamEventId(events) {
  const nums = events.map(e => parseInt((e.eventId||"").replace("EVT-",""),10)).filter(n=>!isNaN(n));
  return "EVT-" + String((nums.length ? Math.max(...nums) : 0) + 1).padStart(3,"0");
}

function renderTeamEvents() {
  document.getElementById("app").innerHTML = shellHTML(SESSION.role, SESSION.name,
    tabBarHTML() + `<div id="events-main"></div>`);
  const availTeams = SESSION.role === "Manager" ? (SESSION.teams||[]) : (SESSION.teams||[]);
  if (!_activeTeamCal) _activeTeamCal = SESSION.role === "Manager" ? "all" : (availTeams[0] || "");
  if (_teamEventsLoaded) {
    _teamCalView === "year" ? renderTEventsYearView() : renderTEventsGrid();
    _bgRefreshTeamEvents();
  } else {
    document.getElementById("events-main").innerHTML = `<div class="spinner"></div>`;
    loadTeamEvents();
  }
}

async function loadTeamEvents() {
  const cached = _sGet("tmgr_tevents");
  if (cached) {
    _teamEvents = cached; _teamEventsLoaded = true;
    _teamCalView === "year" ? renderTEventsYearView() : renderTEventsGrid();
  }
  try {
    const rows  = await readSheet(CALENDAR_SHEET_ID, TEAM_EVENTS_SHEET_NAME);
    const fresh = rowsToTeamEvents(rows);
    _sSet("tmgr_tevents", fresh);
    if (JSON.stringify(fresh) !== JSON.stringify(_teamEvents)) {
      _teamEvents = fresh;
      _teamCalView === "year" ? renderTEventsYearView() : renderTEventsGrid();
    }
    _teamEventsLoaded = true;
  } catch(e) {
    if (!cached) {
      _teamEvents = []; _teamEventsLoaded = true;
      _teamCalView === "year" ? renderTEventsYearView() : renderTEventsGrid();
    }
  }
}

async function _bgRefreshTeamEvents() {
  try {
    const rows  = await readSheet(CALENDAR_SHEET_ID, TEAM_EVENTS_SHEET_NAME);
    const fresh = rowsToTeamEvents(rows);
    _sSet("tmgr_tevents", fresh);
    if (JSON.stringify(fresh) !== JSON.stringify(_teamEvents)) {
      _teamEvents = fresh;
      _teamCalView === "year" ? renderTEventsYearView() : renderTEventsGrid();
    }
  } catch {}
}

async function reloadTeamEvents() {
  const rows = await readSheet(CALENDAR_SHEET_ID, TEAM_EVENTS_SHEET_NAME);
  _teamEvents = rowsToTeamEvents(rows);
  _sSet("tmgr_tevents", _teamEvents);
  _teamCalView === "year" ? renderTEventsYearView() : renderTEventsGrid();
}

function setActiveTeamCal(team) { _activeTeamCal = team; _teamCalView === "year" ? renderTEventsYearView() : renderTEventsGrid(); }
function teamCalPrevMonth() { if (_teamCalMonth===0){_teamCalMonth=11;_teamCalYear--;}else _teamCalMonth--; renderTEventsGrid(); }
function teamCalNextMonth() { if (_teamCalMonth===11){_teamCalMonth=0;_teamCalYear++;}else _teamCalMonth++; renderTEventsGrid(); }
function teamCalPrevYear()  { _teamCalYear--; renderTEventsYearView(); }
function teamCalNextYear()  { _teamCalYear++; renderTEventsYearView(); }
function setTeamCalView(v)  { _teamCalView=v; v==="year"?renderTEventsYearView():renderTEventsGrid(); }
function switchToTeamCalMonth(mi) { _teamCalMonth=mi; setTeamCalView("month"); }

function _tEventsTeamSwitcher(availTeams) {
  if (availTeams.length <= 1 && SESSION.role !== "Manager") return "";
  const buttons = [];
  if (SESSION.role === "Manager") {
    const on = _activeTeamCal === "all";
    buttons.push(`<button onclick="setActiveTeamCal('all')"
      style="padding:5px 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;
      border:${on?"2px solid #1b4332":"1.5px solid #d1fae5"};
      background:${on?"#1b4332":"#fff"};color:${on?"#fff":"#374151"};">All Teams</button>`);
  }
  availTeams.forEach(t => {
    const on = _activeTeamCal === t;
    buttons.push(`<button onclick="setActiveTeamCal('${t.replace(/'/g,"&#39;")}')"
      style="padding:5px 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;
      border:${on?"2px solid #1b4332":"1.5px solid #d1fae5"};
      background:${on?"#1b4332":"#fff"};color:${on?"#fff":"#374151"};">${t}</button>`);

  return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">${buttons.join("")}</div>`;

function _tEventsCalViewToggle() {
  return `<div style="display:flex;background:#f0fdf4;border-radius:7px;padding:2px;border:1px solid #d1fae5;">
    <button onclick="setTeamCalView('month')" style="padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;border:none;cursor:pointer;background:${_teamCalView==='month'?'#1b4332':'transparent'};color:${_teamCalView==='month'?'#fff':'#6b7280'};">Month</button>
    <button onclick="setTeamCalView('year')"  style="padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;border:none;cursor:pointer;background:${_teamCalView==='year'?'#1b4332':'transparent'};color:${_teamCalView==='year'?'#fff':'#6b7280'};">Year</button>
  </div>`;
}

function renderTEventsGrid() {
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DAYS   = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const year = _teamCalYear, month = _teamCalMonth;
  const firstDay = new Date(year, month, 1).getDay();
  const dim      = new Date(year, month+1, 0).getDate();
  const td = new Date();
  const todayStr = `${td.getFullYear()}-${String(td.getMonth()+1).padStart(2,"0")}-${String(td.getDate()).padStart(2,"0")}`;
  const mStart   = `${year}-${String(month+1).padStart(2,"0")}-01`;
  const mEnd     = `${year}-${String(month+1).padStart(2,"0")}-${String(dim).padStart(2,"0")}`;
  const showAll  = _activeTeamCal === "all";
  const mEvts    = _teamEvents.filter(e => (showAll || e.team === _activeTeamCal) && e.endDate >= mStart && e.startDate <= mEnd);

  const cells = Array(firstDay).fill(null);
  for (let d=1; d<=dim; d++) cells.push(d);
  while (cells.length%7!==0) cells.push(null);

  const dayHeaders = DAYS.map(d=>`<div style="text-align:center;font-size:10px;font-weight:700;color:#9ca3af;padding:5px 2px;">${d}</div>`).join("");

  const rowsHTML = [];
  for (let r=0; r<cells.length; r+=7) {
    const rowCells = cells.slice(r,r+7).map(day => {
      if (!day) return `<div style="min-height:80px;background:#fafafa;border-right:1px solid #f3f4f6;"></div>`;
      const ds = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      const isToday = ds===todayStr;
      const dayEvts = mEvts.filter(e => e.startDate<=ds && e.endDate>=ds);
      const chips   = dayEvts.map(e => {
        const bg    = showAll ? memberColor(e.team) : memberColor(e.title);
        const label = showAll ? `[${e.team}] ${e.title}` : e.title;
        return `<div onclick="event.stopPropagation();openTeamEventEditModal(${e.rowIndex})"
          title="${e.title}${e.desc?' | '+e.desc:''} (${e.team} · ${formatDueDate(e.startDate)} – ${formatDueDate(e.endDate)})"
          style="background:${bg};color:#fff;font-size:9px;font-weight:600;padding:2px 5px;border-radius:3px;margin-top:2px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${label}</div>`;
      }).join("");
      const bgN=isToday?"#f0fdf4":"#fff", bgH=isToday?"#d1fae5":"#f9fafb";
      return `<div onclick="openTeamEventAddModal('${ds}')"
        style="min-height:80px;padding:3px 4px;border-right:1px solid #f3f4f6;background:${bgN};cursor:pointer;"
        onmouseover="this.style.background='${bgH}'" onmouseout="this.style.background='${bgN}'">
        <div style="font-size:11px;font-weight:${isToday?700:500};width:19px;height:19px;display:flex;align-items:center;justify-content:center;border-radius:50%;${isToday?"background:#1b4332;color:#fff;":"color:#374151;"}">${day}</div>
        ${chips}
      </div>`;
    }).join("");
    rowsHTML.push(`<div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid #f3f4f6;">${rowCells}</div>`);
  }

  const legendItems = showAll
    ? [...new Set(mEvts.map(e=>e.team))].map(t=>`<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#6b7280;"><div style="width:8px;height:8px;border-radius:50%;background:${memberColor(t)};flex-shrink:0;"></div>${t}</div>`)
    : [...new Set(mEvts.map(e=>e.title))].map(t=>`<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#6b7280;"><div style="width:8px;height:8px;border-radius:50%;background:${memberColor(t)};flex-shrink:0;"></div>${t}</div>`);
  const legend = legendItems.length ? `
    <div style="display:flex;gap:12px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid #f3f4f6;">${legendItems.join("")}</div>` : "";

  const availTeams = getTeamNames().length ? getTeamNames() : (SESSION.teams||[]);
  const el = document.getElementById("events-main");
  if (!el) return;
  el.innerHTML = _tEventsTeamSwitcher(availTeams) + `
    <div style="overflow-x:auto;">
    <div style="background:#fff;border-radius:16px;border:1px solid #d1fae5;overflow:hidden;min-width:560px;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #d1fae5;gap:6px;">
        <button onclick="teamCalPrevMonth()" style="background:#f0fdf4;border:none;color:#1b4332;border-radius:8px;padding:4px 12px;font-size:18px;font-weight:700;cursor:pointer;line-height:1;flex-shrink:0;">&#8249;</button>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;flex:1;">
          <span style="font-size:15px;font-weight:700;color:#1b4332;">${MONTHS[month]} ${year}</span>
          ${_tEventsCalViewToggle()}

function renderTEventsYearView() {
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DAYS = ["S","M","T","W","T","F","S"];
  const year = _teamCalYear;
  const td = new Date();
  const todayStr = `${td.getFullYear()}-${String(td.getMonth()+1).padStart(2,"0")}-${String(td.getDate()).padStart(2,"0")}`;
  const showAllY = _activeTeamCal === "all";
  const yEvts = _teamEvents.filter(e => (showAllY || e.team===_activeTeamCal) && e.endDate>=`${year}-01-01` && e.startDate<=`${year}-12-31`);

  const miniMonths = MONTHS.map((mName,mi) => {
    const mn  = mi+1;
    const dim = new Date(year,mn,0).getDate();
    const fd  = new Date(year,mi,1).getDay();
    const mStart = `${year}-${String(mn).padStart(2,"0")}-01`;
    const mEnd   = `${year}-${String(mn).padStart(2,"0")}-${String(dim).padStart(2,"0")}`;
    const mEvts  = yEvts.filter(e => e.endDate>=mStart && e.startDate<=mEnd);
    const cells  = Array(fd).fill(null);
    for (let d=1;d<=dim;d++) cells.push(d);
    while (cells.length%7!==0) cells.push(null);
    const hdr = DAYS.map(d=>`<div style="text-align:center;font-size:7px;font-weight:700;color:#9ca3af;">${d}</div>`).join("");
    let gridRows = "";
    for (let r=0;r<cells.length;r+=7) {
      gridRows += `<div style="display:grid;grid-template-columns:repeat(7,1fr);">` +
        cells.slice(r,r+7).map(day => {
          if (!day) return `<div style="height:18px;"></div>`;
          const ds = `${year}-${String(mn).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
          const isToday = ds===todayStr;
          const dayEvts = mEvts.filter(e=>e.startDate<=ds&&e.endDate>=ds);
          const hasPTO  = dayEvts.length>0;
          const _evtColor = e => showAllY ? memberColor(e.team) : memberColor(e.title);
          const bg = hasPTO ? _evtColor(dayEvts[0])+"28" : "transparent";
          const numBg  = isToday ? "#1b4332" : "transparent";
          const numCol = isToday ? "#fff" : "#374151";
          const dots = hasPTO ? `<div style="display:flex;gap:1px;justify-content:center;">${
            dayEvts.slice(0,3).map(e=>`<div style="width:3px;height:3px;border-radius:50%;background:${_evtColor(e)};"></div>`).join("")
          }</div>` : "";
          const tip = hasPTO ? ` title="${dayEvts.map(e=>e.title).join(", ")}"` : "";
          return `<div${tip} style="height:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:${bg};border-radius:2px;">
            <div style="font-size:8px;font-weight:${isToday?700:400};color:${numCol};background:${numBg};border-radius:50%;width:13px;height:13px;display:flex;align-items:center;justify-content:center;">${day}</div>
            ${dots}
          </div>`;
        }).join("") + `</div>`;
    }
    return `<div onclick="switchToTeamCalMonth(${mi})" title="View ${mName}"
      style="background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:8px 6px;cursor:pointer;"
      onmouseover="this.style.borderColor='#1b4332';this.style.background='#f0fdf4'"
      onmouseout="this.style.borderColor='#e5e7eb';this.style.background='#fff'">
      <div style="font-size:11px;font-weight:700;color:#1b4332;text-align:center;margin-bottom:5px;">${mName}</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px;">${hdr}</div>
      ${gridRows}
    </div>`;
  });

  const availTeams = getTeamNames().length ? getTeamNames() : (SESSION.teams||[]);
  const el = document.getElementById("events-main");
  if (!el) return;
  el.innerHTML = _tEventsTeamSwitcher(availTeams) + `
    <div style="background:#fff;border-radius:16px;border:1px solid #d1fae5;overflow:hidden;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #d1fae5;gap:6px;">
        <button onclick="teamCalPrevYear()" style="background:#f0fdf4;border:none;color:#1b4332;border-radius:8px;padding:4px 12px;font-size:18px;font-weight:700;cursor:pointer;line-height:1;flex-shrink:0;">&#8249;</button>
        <div style="display:flex;align-items:center;gap:12px;">
          <span style="font-size:15px;font-weight:700;color:#1b4332;">${year}</span>
          ${_tEventsCalViewToggle()}
        </div>
        <button onclick="teamCalNextYear()" style="background:#f0fdf4;border:none;color:#1b4332;border-radius:8px;padding:4px 12px;font-size:18px;font-weight:700;cursor:pointer;line-height:1;flex-shrink:0;">&#8250;</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px;">
        ${miniMonths.join("")}
      </div>
    </div>`;
}

async function doSaveTeamEvent() {
  const team  = document.getElementById("tm-team").value;
  const title = document.getElementById("tm-title").value.trim();
  const start = document.getElementById("tm-start").value;
  const end   = document.getElementById("tm-end").value;
  const desc  = document.getElementById("tm-desc").value.trim();
  const m     = _teamEventModal;
  const errEl = document.getElementById("tm-error");
  if (!title) { errEl.textContent = "Title is required."; return; }
  if (!start || !end) { errEl.textContent = "Start and end dates are required."; return; }
  if (end < start) { errEl.textContent = "End date cannot be before start date."; return; }
  try {
    if (m.mode==="add") {
      await appendRow(CALENDAR_SHEET_ID, TEAM_EVENTS_SHEET_NAME, [nextTeamEventId(_teamEvents), team, title, start, end, desc]);
    } else {
      await updateRow(CALENDAR_SHEET_ID, TEAM_EVENTS_SHEET_NAME, m.rowIndex, [m.eventId, team, title, start, end, desc]);
    }
    closeTeamEventModal();
    await reloadTeamEvents();
    showToast("Saved ✓");
  } catch(e) { errEl.textContent = "Save failed: " + e.message; }
}

async function doDeleteTeamEvent(rowIndex) {

    await reloadTeamEvents();
    showToast("Deleted");

}

// ── ARCHIVE ────────────────────────────────────────────────────────────────────
async function doArchiveTask(rowIndex) {
  const isManager = SESSION.role === "Manager";
  const task = isManager
    ? _allTasks.find(t => t.rowIndex === rowIndex)
    : _memberTasks.find(t => t.rowIndex === rowIndex);
  if (!task) return;
  if (!confirm(`Archive "${task.task}"?\n\nThis will move the task to the Archive tab where you can search it later.`)) return;

  // Optimistic update — remove row immediately, fix indices for rows below
  _taskOpInProgress = true;
  const prevAllTasks    = _allTasks.slice();
  const prevMemberTasks = _memberTasks.slice();
  const shiftIndex = t => t.rowIndex > rowIndex ? { ...t, rowIndex: t.rowIndex - 1 } : t;
  if (isManager) {
    _allTasks    = _allTasks.filter(t => t.rowIndex !== rowIndex).map(shiftIndex);
    setCachedTasks(_allTasks); // update localStorage immediately so nav-back shows correct list
  } else {
    _memberTasks = _memberTasks.filter(t => t.rowIndex !== rowIndex).map(shiftIndex);
  }
  if (isManager) renderManagerTable(); else renderMemberTable();
  showToast("Archived ✓");

  // Background: write to Archive sheet then delete from Tasks sheet
  try {
    const today = new Date();
    const archivedDate = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
    await appendRow(CALENDAR_SHEET_ID, ARCHIVE_SHEET_NAME,
      [task.taskId, task.assignedTo, task.task, task.dueDate, task.priority, task.status, task.notes, task.url, archivedDate]);
    await deleteRowProxy(CALENDAR_SHEET_ID, TASKS_SHEET_NAME, rowIndex);
    _sDel(ARCHIVE_CACHE_KEY);
    _archiveLoaded = false;
  } catch(e) {
    // Restore on failure
    _allTasks    = prevAllTasks;
    _memberTasks = prevMemberTasks;
    if (isManager) { setCachedTasks(_allTasks); renderManagerTable(); } else renderMemberTable();
    if (e.message && e.message.toLowerCase().includes("sheet")) {
      alert(`Archive failed: The "Archive" sheet does not exist.\n\nPlease create a sheet named "Archive" in your spreadsheet and try again.`);
    } else {
      alert("Archive failed: " + e.message);
    }
  } finally {
    _taskOpInProgress = false;
  }
}

async function doUnarchiveTask(rowIndex) {
  const task = _archiveTasks.find(t => t.rowIndex === rowIndex);
  if (!task) return;
  if (!confirm(`Unarchive "${task.task}"?\n\nThis will move the task back to the active Tasks tab.`)) return;

  // Optimistic update — remove row immediately, fix indices for rows below
  _taskOpInProgress = true;
  const prevArchiveTasks = _archiveTasks.slice();
  const shiftIndex = t => t.rowIndex > rowIndex ? { ...t, rowIndex: t.rowIndex - 1 } : t;
  _archiveTasks = _archiveTasks.filter(t => t.rowIndex !== rowIndex).map(shiftIndex);
  renderArchiveTable();
  showToast("Unarchived ✓");

  // Background: get next task ID, write to Tasks sheet, delete from Archive sheet
  try {
    const allRows = await readSheet(CALENDAR_SHEET_ID, TASKS_SHEET_NAME);
    const taskId  = nextTaskId(rowsToTasks(allRows));
    await appendRow(CALENDAR_SHEET_ID, TASKS_SHEET_NAME,
      [taskId, task.assignedTo, task.task, task.dueDate, task.priority, task.status, task.notes, task.url]);
    await deleteRowProxy(CALENDAR_SHEET_ID, ARCHIVE_SHEET_NAME, rowIndex);
    _sDel(ARCHIVE_CACHE_KEY);
    _archiveLoaded = false;
    // Add restored task into in-memory task lists so Tasks tab shows it immediately
    const newTask = {
      rowIndex: allRows.length + 1,
      taskId, assignedTo: task.assignedTo, task: task.task,
      dueDate: task.dueDate, priority: task.priority,
      status: task.status, notes: task.notes, url: task.url
    };
    if (_allTasks.length > 0) {
      _allTasks = [..._allTasks, newTask];
      setCachedTasks(_allTasks);
    } else {
      clearTasksCache();
    }
    _memberTasks = SESSION.role !== "Manager"
      ? [..._memberTasks, newTask]
      : [];
    if (_activeTab === "tasks") {
      if (SESSION.role === "Manager") renderManagerTable(); else renderMemberTable();
    }
  } catch(e) {
    // Restore on failure
    _archiveTasks = prevArchiveTasks;
    renderArchiveTable();
    alert("Unarchive failed: " + e.message);
  } finally {
    _taskOpInProgress = false;
  }
}

function renderArchive() {
  document.getElementById("app").innerHTML = shellHTML(SESSION.role, SESSION.name,
    tabBarHTML() + `<div id="archive-main"></div>`);
  if (_archiveLoaded) {
    renderArchiveTable();
    _bgRefreshArchiveTasks();
  } else {
    document.getElementById("archive-main").innerHTML = `<div class="spinner"></div>`;
    loadArchiveTasks();
  }
}

async function loadArchiveTasks() {
  const cached = _sGet(ARCHIVE_CACHE_KEY);
  if (cached) {
    _archiveTasks = cached;
    _archiveLoaded = true;
    renderArchiveTable();
  }
  try {
    const rows  = await readSheet(CALENDAR_SHEET_ID, ARCHIVE_SHEET_NAME);
    const fresh = rowsToArchiveTasks(rows);
    _sSet(ARCHIVE_CACHE_KEY, fresh);
    if (JSON.stringify(fresh) !== JSON.stringify(_archiveTasks)) {
      _archiveTasks = fresh;
      renderArchiveTable();
    }
    _archiveLoaded = true;
  } catch(e) {
    if (!cached) {
      const el = document.getElementById("archive-main");
      if (el) el.innerHTML = `
        <div style="background:#fef9c3;color:#854d0e;padding:16px 20px;border-radius:12px;margin:16px 0;border:1px solid #fde68a;">
          <div style="font-weight:600;margin-bottom:6px;">Archive sheet not found</div>
          <div style="font-size:12px;">Please create a sheet named <strong>"Archive"</strong> in your Google Spreadsheet, then refresh.</div>
        </div>`;
    }
  }
}

async function _bgRefreshArchiveTasks() {
  if (_taskOpInProgress) return;
  try {
    const rows  = await readSheet(CALENDAR_SHEET_ID, ARCHIVE_SHEET_NAME);
    if (_taskOpInProgress) return; // re-check after async wait
    const fresh = rowsToArchiveTasks(rows);
    _sSet(ARCHIVE_CACHE_KEY, fresh);
    if (JSON.stringify(fresh) !== JSON.stringify(_archiveTasks)) {
      _archiveTasks = fresh;
      renderArchiveTable();
    }
  } catch {}
}

function setArchiveFilter(name) {
  _archiveFilterMember = name;
  renderArchiveTable();
}

function renderArchiveTable() {
  const el = document.getElementById("archive-main");
  if (!el) return;
  const isManager = SESSION.role === "Manager";

  let tasks = isManager ? _archiveTasks : _archiveTasks.filter(t => t.assignedTo === SESSION.name);

  let filterHTML = "";
  if (isManager) {
    const memberNames = SESSION.memberRows.map(r => r[0]);
    const filterBtns = memberNames.map(n => {
      const active = _archiveFilterMember === n;
      const count  = _archiveTasks.filter(t => t.assignedTo === n).length;
      const status = (window._accountStatus || {})[n];
      const manualLocked = status?.locked && (status?.failed || 0) === 0;
      if (manualLocked) return "";
      const autoLocked = status?.locked && (status?.failed || 0) >= 3;
      const bg     = active ? (autoLocked ? "#7f1d1d" : "#1b4332") : (autoLocked ? "#fff1f2" : "#f0fdf4");
      const fg     = active ? "#fff" : (autoLocked ? "#991b1b" : "#1b4332");
      const border = active ? `2px solid ${autoLocked?"#991b1b":"#1b4332"}` : `1.5px solid ${autoLocked?"#fca5a5":"#d1fae5"}`;
      const label  = `${autoLocked?"🔒 ":""}${n.split(" ")[0]} (${count})`;
      return `<button onclick="setArchiveFilter('${n}')" title="${autoLocked?n+" is locked — too many attempts":""}"
        style="padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;
        border:${border};background:${bg};color:${fg};">${label}</button>`;
    }).join("");
    const clearBtn = _archiveFilterMember !== "All"
      ? `<button onclick="setArchiveFilter('All')" style="padding:6px 14px;border-radius:999px;font-size:12px;border:1.5px solid #fca5a5;background:#fff1f2;color:#991b1b;font-weight:600;">✕ Clear filter</button>`
      : "";
    filterHTML = `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">${filterBtns}${clearBtn}</div>`;
    if (_archiveFilterMember !== "All") tasks = tasks.filter(t => t.assignedTo === _archiveFilterMember);
  }

  const q = _archiveSearch.toLowerCase();
  if (q) {
    tasks = tasks.filter(t =>
      t.task.toLowerCase().includes(q) ||
      (t.notes||"").toLowerCase().includes(q) ||
      t.taskId.toLowerCase().includes(q) ||
      (t.assignedTo||"").toLowerCase().includes(q)
    );
  }

  const safeQ = (_archiveSearch||"").replace(/"/g,"&quot;");
  const searchBar = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
      <input id="archive-search" type="text" placeholder="Search by task, notes, name…" value="${safeQ}"
        oninput="_archiveSearch=this.value;renderArchiveTable()"
        style="padding:8px 12px;border-radius:8px;border:1.5px solid #d1fae5;font-size:13px;width:280px;"/>
      ${_archiveSearch ? `<button onclick="_archiveSearch='';renderArchiveTable()" style="background:#fff1f2;color:#dc2626;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid #fca5a5;cursor:pointer;">✕ Clear</button>` : ""}
      <span style="font-size:12px;color:#9ca3af;margin-left:auto;">${tasks.length} archived task${tasks.length!==1?"s":""}</span>
    </div>`;

  const colHeaders = isManager
    ? ["Task ID","Assigned To","Task","Due Date","Priority","Status","Notes","URL","Archived Date","Actions"]
    : ["Task ID","Task","Due Date","Priority","Status","Notes","URL","Archived Date","Actions"];

  const bodyRows = tasks.length === 0
    ? `<tr><td colspan="${colHeaders.length}" style="text-align:center;padding:3rem;color:#9ca3af;">No archived tasks${q?" matching your search":""}.</td></tr>`
    : tasks.map(t => {
        const assignedCell = isManager
          ? `<td style="padding:10px 12px;white-space:nowrap;font-weight:500;color:#1b4332;">${t.assignedTo.split(" ")[0]}</td>`
          : "";
        return `<tr style="background:#fff;border-bottom:1px solid #f0fdf4;">
          <td style="padding:10px 12px;color:#6b7280;white-space:nowrap;">${t.taskId}</td>
          ${assignedCell}
          <td style="padding:10px 12px;max-width:200px;">${t.task}</td>
          <td style="padding:10px 12px;white-space:nowrap;font-size:12px;color:#374151;">${formatDueDate(t.dueDate)}</td>
          <td style="padding:10px 12px;">${priorityBadge(t.priority)}</td>
          <td style="padding:10px 12px;">${statusBadge(t.status)}</td>
          <td style="padding:10px 12px;max-width:220px;">${notesCellHTML(t.notes, "arc"+t.rowIndex)}</td>
          <td style="padding:10px 12px;white-space:nowrap;">
            ${t.url ? `<a href="${normalizeUrl(t.url)}" target="_blank" rel="noopener" style="font-size:11px;font-weight:600;color:#1b4332;background:#f0fdf4;border:1px solid #d1fae5;padding:3px 9px;border-radius:5px;text-decoration:none;">🔗 Open</a>` : `<span style="color:#e5e7eb;font-size:11px;">—</span>`}
          </td>
          <td style="padding:10px 12px;white-space:nowrap;font-size:11px;color:#6b7280;">${formatDueDate(t.archivedDate)}</td>
          <td style="padding:10px 12px;white-space:nowrap;">
            <button onclick="doUnarchiveTask(${t.rowIndex})" style="background:#dbeafe;color:#1e40af;font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;border:none;cursor:pointer;">Unarchive</button>
          </td>
        </tr>`;
      }).join("");

  el.innerHTML = filterHTML + searchBar + `
    <div style="overflow-x:auto;">
      <table style="font-size:13px;">
        <thead><tr style="background:#f0fdf4;">
          ${colHeaders.map(h=>`<th style="padding:10px 12px;font-weight:600;color:#1b4332;border-bottom:2px solid #d1fae5;white-space:nowrap;">${h}</th>`).join("")}
        </tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>`;
}

// ── BOOT ───────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
